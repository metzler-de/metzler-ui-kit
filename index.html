<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metzler Design System</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fff; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    input::placeholder { color: #A1A1A1; }
    a { color: #015253; }
    h1[id] { scroll-margin-top: 72px; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ── UTILITIES ──
    const hexToRgb = (hex) => { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgb(${r},${g},${b})`; };
    const rgbaToHex = (rgba) => { const m=rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); if(!m)return null; const h=n=>parseInt(n).toString(16).padStart(2,"0"); return `#${h(m[1])}${h(m[2])}${h(m[3])}`.toUpperCase(); };
    const getHex = v => v.startsWith("#") ? v.toUpperCase() : rgbaToHex(v);

    const S = 1.2;
    const f = n => Math.round(n * S);
    const font = "'Helvetica Neue', Helvetica, Arial, sans-serif";

    // ── NAV ITEMS ──
    const navItems = [
      { type:"group", label:"Getting started" },
      { type:"item",  label:"Introduction",      id:"instruction" },
      { type:"group", label:"Tokens" },
      { type:"item",  label:"Colors",            id:"colors" },
      { type:"item",  label:"Typography",        id:"typography" },
      { type:"item",  label:"Spacing",           id:"spacing" },
      { type:"item",  label:"Shadows",           id:"shadows" },
      { type:"group", label:"Icons" },
      { type:"item",  label:"Icons",             id:"icons" },
      { type:"group", label:"Components" },
      { type:"item",  label:"Buttons",           id:"buttons" },
      { type:"item",  label:"Form Elements",     id:"form-elements" },
      { type:"item",  label:"Dropdown",          id:"dropdown" },
      { type:"item",  label:"Tooltip",           id:"tooltip" },
      { type:"item",  label:"Alert",             id:"alert" },
      { type:"item",  label:"Badge",             id:"badge" },
      { type:"item",  label:"Toast",             id:"toast" },
      { type:"item",  label:"Tabs",              id:"tabs" },
      { type:"group", label:"Patterns" },
      { type:"item",  label:"Notifications",     id:"notifications" },
      { type:"item",  label:"Ratings",           id:"ratings-badges" },
      { type:"item",  label:"Product Cards",     id:"product-cards" },
      { type:"item",  label:"Breadcrumbs",        id:"breadcrumbs" },
      { type:"item",  label:"Header",            id:"header" },
      { type:"item",  label:"Footer",            id:"footer" },
    ];
    const allNavItems = navItems.filter(n=>n.type==="item");

    // ── COLOR TOKENS (Metzler Extended Color System) ──
    const colorTokens = [
      // ── PRIMARY TEAL ──
      {value:"#015253", label:"Metzler Teal",       subtitle:"Primary · CTAs + brand surfaces",      role:"All CTA buttons, top bar, active nav, pagination, search bar, focus rings, header background", hex:"#015253", rgb:"1 · 82 · 83",       grp:"Primary Teal"},
      {value:"#01292A", label:"Primary Dark",        subtitle:"Deep teal · Footer",                   role:"Footer background, footer accordion, dark overlays, deep teal section backgrounds",             hex:"#01292A", rgb:"1 · 41 · 42",       grp:"Primary Teal"},
      {value:"#006D75", label:"Primary Hover",       subtitle:"Mid teal · Hover state",               role:"Hover on all filled teal buttons — the only hover colour for the Primary CTA",                  hex:"#006D75", rgb:"0 · 109 · 117",     grp:"Primary Teal"},
      {value:"rgba(1,82,83,0.1)",  label:"Primary 10%",  subtitle:"Teal tint · Hover fills",         role:"Arrow/pagination button hover fill, secondary button hover tint, filter chip ring",             hex:"—",       rgb:"—",                 grp:"Primary Teal"},
      {value:"rgba(1,82,83,0.05)", label:"Primary 5%",   subtitle:"Subtle teal tint",                role:"Section tints, info box backgrounds, alternating row fills",                                    hex:"—",       rgb:"—",                 grp:"Primary Teal"},
      // ── BRAND ──
      {value:"#D42924", label:"Metzler Rot",         subtitle:"Signal color · Logo M-square only",    role:"Logo M-square, discount badge (–10%) on product cards. Never for CTAs, body text, or large fills", hex:"#D42924", rgb:"212 · 41 · 36",  grp:"Brand"},
      {value:"#1A171B", label:"Digital Schwarz",     subtitle:"Brand black · Headlines + wordmark",   role:'Product titles, page headings, "METZLER" wordmark, table rules, icon fills across print and web',  hex:"#1A171B", rgb:"26 · 23 · 27",   grp:"Brand"},
      // ── GREEN ──
      {value:"#009951", label:"Green / Select",      subtitle:"Success · Availability · Selection",   role:"In-stock badge, success alert/toast, checkbox (Configurator), radio, textfield active/done border", hex:"#009951", rgb:"0 · 153 · 81",   grp:"Green"},
      {value:"rgba(0,153,81,0.5)", label:"Green 50%",subtitle:"Muted green · Inactive states",       role:"Muted in-stock, disabled selected checkboxes, greyed-out availability indicators",                hex:"—",       rgb:"—",                 grp:"Green"},
      // ── RED ──
      {value:"#C90000", label:"Red / Default",       subtitle:"Error · Sale pricing",                 role:"Sale price text on product cards, error alert/toast border, textfield error border. Not buttons", hex:"#C90000", rgb:"201 · 0 · 0",     grp:"Red"},
      {value:"#FF4D4F", label:"Red / Error",         subtitle:"Form validation",                      role:"Field error borders, inline validation messages, error notification dot",                         hex:"#FF4D4F", rgb:"255 · 77 · 79",    grp:"Red"},
      // ── BLACK ──
      {value:"#000000", label:"Base / Black",        subtitle:"Text black · UI labels",               role:"Body text, nav menu labels, category nav items, tab labels, price text, form input text",         hex:"#000000", rgb:"0 · 0 · 0",        grp:"Black & White"},
      {value:"rgba(0,0,0,0.8)",   label:"Black 80%", subtitle:"Overlay dark",                        role:"Modal backdrop scrim, dark overlay on hero images, semi-transparent dark layers",                 hex:"—",       rgb:"—",                 grp:"Black & White"},
      {value:"#FFFFFF", label:"Base / White",        subtitle:"Pure white · Surfaces",                role:"Card backgrounds, modal surfaces, search bar fill, button label on teal/dark, icon fill on teal", hex:"#FFFFFF", rgb:"255 · 255 · 255",  grp:"Black & White"},
      {value:"rgba(255,255,255,0.5)", label:"White 50%", subtitle:"Ghost text · Dark backgrounds",   role:"Footer accordion labels, footer nav text, top-bar secondary text on teal",                        hex:"—",       rgb:"—",                 grp:"Black & White"},
      // ── GRAY ──
      {value:"#A1A1A1", label:"Graphite 500",        subtitle:"Mid gray · Placeholders",              role:"Placeholder text, disabled labels, inactive icons, secondary metadata, arrow button disabled",    hex:"#A1A1A1", rgb:"161 · 161 · 161",  grp:"Grays"},
      {value:"#DADADA", label:"Graphite 300",        subtitle:"Light gray · Borders + inputs",        role:"All input borders (default), card outlines, category nav rule, swatch borders, dividers",         hex:"#DADADA", rgb:"218 · 218 · 218",  grp:"Grays"},
      {value:"#F0F0F0", label:"Graphite 100",        subtitle:"Off-white · Row dividers",             role:"Product list dividers, inactive tab background, skeleton shimmer base, out-of-stock badge",       hex:"#F0F0F0", rgb:"240 · 240 · 240",  grp:"Grays"},
      {value:"#F5F6FA", label:"Paper White",         subtitle:"Near-white · Page backgrounds",        role:"Page background, sidebar fill, search bar pill fill, email meta backgrounds, alternating rows",   hex:"#F5F6FA", rgb:"245 · 246 · 250",  grp:"Grays"},
      // ── ACCENT ──
      {value:"#5CDBD3", label:"Teal Mint",           subtitle:"Footer links · Dark bg hyperlinks",    role:"Hyperlinks on dark/teal backgrounds, hover colour for footer nav links",                          hex:"#5CDBD3", rgb:"92 · 219 · 211",   grp:"Accent"},
      {value:"#3B9ADB", label:"Info Blue",           subtitle:"Info state · Badges",                  role:"Info alert/toast border and dot, informational badge background, help icon tint",                 hex:"#3B9ADB", rgb:"59 · 154 · 219",   grp:"Accent"},
      {value:"#FFC041", label:"Star Fill",           subtitle:"Star rating colour",                   role:"Star rating filled colour on product cards, review components, and the Ratings section",          hex:"#FFC041", rgb:"255 · 192 · 65",   grp:"Accent"},
    ];

    // ── LOGO ──
    const Logo = ({ height=28, color="dark" }) => {
      const tf = color==="light" ? "#fff" : "#1a171a";
      return (
        <svg viewBox="0 0 1095.83 184.29" style={{height,width:"auto",display:"block"}} xmlns="http://www.w3.org/2000/svg">
          <g>
            <rect x="0" y="0" width="184.3" height="184.3" rx="5.75" fill="#fff"/>
            <path fill="#cc322b" d="M178.55,0H5.75C2.58,0,0,2.58,0,5.75v172.8c0,3.16,2.58,5.75,5.75,5.75h172.8c3.16,0,5.75-2.58,5.75-5.75V5.75c0-3.16-2.58-5.75-5.75-5.75ZM70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z"/>
            <g>
              <path fill={tf} d="M338.52,153.83l-.33-63.09-30.6,51.35h-14.96l-30.44-49.66v61.39h-31.11V34.81h27.72l41.82,68.7,40.82-68.7h27.72l.33,119.02h-30.98Z"/>
              <path fill={tf} d="M489.31,127.82v26.01h-95.55V34.81h95.58v26.01h-62.24v20.06h52.89v25.16h-52.89v21.76h62.24Z"/>
              <path fill={tf} d="M965.1,127.82v26.01h-95.55V34.81h95.58v26.01h-62.24v20.06h52.89v25.16h-52.89v21.76h62.24Z"/>
              <path fill={tf} d="M544.54,61.5h-36.56v-26.7h106.62v26.7h-36.39v92.32h-33.67V61.5Z"/>
              <path fill={tf} d="M737.47,127.13v26.72H633.33v-21.09l60.01-71.24h-60.12v-26.72h104.14v21.09l-60.01,71.24h60.12Z"/>
              <path fill={tf} d="M758.29,34.79h33.67v92.35h56.78v26.7h-90.45V34.79Z"/>
              <path fill={tf} d="M1038.2,122.21h-18.37v31.62h-33.67V34.81h54.4c10.78,0,20.13,1.78,28.06,5.34,7.93,3.56,14.05,8.66,18.37,15.3,4.3,6.64,6.46,14.43,6.46,23.38s-2,16.12-6.03,22.54c-4.03,6.41-9.78,11.42-17.26,15.05l25.68,37.41h-36.05l-21.6-31.62ZM1054.19,65.94c-3.52-3.05-8.73-4.59-15.65-4.59h-18.71v34.85h18.71c6.9,0,12.14-1.49,15.65-4.5,3.52-3.01,5.28-7.28,5.28-12.83s-1.76-9.86-5.28-12.92Z"/>
            </g>
          </g>
        </svg>
      );
    };

    // ── ICONS ──
    const Icon = ({ name, size=20, color="#000000" }) => {
      if (name==="profile") return (
        <svg width={size} height={size} viewBox="0 0 26 25" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 24L2.54 22.06C4.13 20.05 6.55 18.87 9.12 18.87H16.88C19.45 18.87 21.87 20.05 23.46 22.06L25 24" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          <path d="M13 0.8C16.97 0.8 20.19 4.02 20.19 8C20.19 11.98 16.97 15.2 13 15.2C9.03 15.2 5.81 11.98 5.81 8C5.81 4.02 9.03 0.8 13 0.8Z" stroke={color} strokeWidth="1.5"/>
        </svg>
      );
      const icons = {
        search:     <svg width={size} height={size} viewBox="0 0 18 19" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke={color} strokeWidth="2"/><line x1="12.5" y1="13" x2="17" y2="17.5" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>,
        close:      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>,
        check:      <svg width={size} height={size} viewBox="0 0 20 20" fill="none"><path d="M5 10l3 3 7-7" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
        info:       <svg width={size} height={size} viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="7.5" stroke={color} strokeWidth="1.5"/><line x1="8.5" y1="7" x2="8.5" y2="13" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><circle cx="8.5" cy="5" r="1" fill={color}/></svg>,
        plus:       <svg width={size} height={size} viewBox="0 0 14 14" fill="none"><line x1="7" y1="1" x2="7" y2="13" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="1" y1="7" x2="13" y2="7" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
        minus:      <svg width={size} height={size} viewBox="0 0 14 14" fill="none"><line x1="1" y1="7" x2="13" y2="7" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
        star:       <svg width={size} height={size} viewBox="0 0 14 14" fill={color}><path d="M7 0l2.1 4.3 4.9.7-3.5 3.4.8 4.6L7 10.8 2.7 13l.8-4.6L0 5l4.9-.7z"/></svg>,
        menu:       <svg width={size} height={size*0.7} viewBox="0 0 21 15" fill="none"><rect width="21" height="2" rx="1" fill={color}/><rect y="6" width="21" height="2" rx="1" fill={color}/><rect y="12" width="21" height="2" rx="1" fill={color}/></svg>,
      };
      return icons[name] || null;
    };

    // ── ATOMS ──
    // Checkbox — matches Figma node 6746:101137
    // States: Default (unchecked), Checked-teal (#015253), Checked-green (#009951)
    // Size: 25×25px Desktop; borderRadius: 4px
    const Checkbox = ({ state="Default", variant="Filter", label, size=25 }) => {
      const isChecked = state === "Checked";
      const bg = isChecked ? (variant==="Configurator" ? "#009951" : "#015253") : "#fff";
      const border = isChecked ? "none" : "1px solid #A1A1A1";
      return (
        <div style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",userSelect:"none"}}>
          <div style={{width:size,height:size,borderRadius:4,border,background:bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxSizing:"border-box"}}>
            {isChecked && (
              <svg width={Math.round(size*0.56)} height={Math.round(size*0.56)} viewBox="0 0 14 14" fill="none">
                <path d="M2 7l3.5 3.5L12 3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            )}
          </div>
          {label && <span style={{fontFamily:font,fontSize:14,color:"#000000"}}>{label}</span>}
        </div>
      );
    };

    // RadioBtn — matches Figma node 6746:101369
    // States: Default, Active, Disabled, Error
    // Size: 20×20px Desktop; fully rounded
    const RadioBtn = ({ state="Default", label }) => {
      const cfg = {
        Default:  { bg:"#fff",      border:"1px solid #A1A1A1", dot:false },
        Active:   { bg:"#fff",      border:"1px solid #009951", dot:true,  dotColor:"#009951" },
        Disabled: { bg:"#F5F6FA",   border:"1px solid #DADADA", dot:false },
        Error:    { bg:"#fff",      border:"1px solid #C90000", dot:false },
      };
      const c = cfg[state] || cfg.Default;
      return (
        <div style={{display:"flex",alignItems:"center",gap:9,cursor:state==="Disabled"?"not-allowed":"pointer",userSelect:"none",opacity:state==="Disabled"?0.7:1}}>
          <div style={{width:20,height:20,borderRadius:"50%",border:c.border,background:c.bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxSizing:"border-box"}}>
            {c.dot && <div style={{width:13,height:13,borderRadius:"50%",background:c.dotColor}}/>}
          </div>
          {label && <span style={{fontFamily:font,fontSize:14,color:state==="Disabled"?"#A1A1A1":"#000000"}}>{label}</span>}
        </div>
      );
    };
    const Badge = ({ children, color="green" }) => {
      const b={green:"#E6F9F0",red:"#FFF1F0",blue:"#E6F7FF",gray:"#F5F6FA"}, t={green:"#009951",red:"#C90000",blue:"#3B9ADB",gray:"#666"};
      return <span style={{display:"inline-block",padding:"4px 10px",borderRadius:4,background:b[color],color:t[color],fontSize:f(12),fontWeight:500,fontFamily:font}}>{children}</span>;
    };
    const SaleBadge = ({ pct=10 }) => <div style={{background:"#C90000",borderRadius:4,padding:"2px 8px",display:"inline-flex",alignItems:"center"}}><span style={{fontWeight:800,fontSize:f(16),color:"#fff"}}>-{pct}%</span></div>;

    // ── COLOR PALETTE TABLE ──
    const ColorPalette = () => {
      const [copiedHex, setCopiedHex] = useState(null);
      const copy = (hex, id) => {
        navigator.clipboard?.writeText(hex).catch(()=>{});
        setCopiedHex(id);
        setTimeout(()=>setCopiedHex(null), 1500);
      };
      const groups = [
        {id:'Primary Teal', label:'PRIMARY TEAL',    desc:'Brand foundation — all CTAs, headers, interactive UI'},
        {id:'Brand',        label:'BRAND',           desc:'Logo marks and brand identity'},
        {id:'Green',        label:'GREEN · SUCCESS', desc:'In-stock, availability, checkboxes, success states'},
        {id:'Red',          label:'RED · ERROR',     desc:'Sale prices, form errors, validation messages'},
        {id:'Black & White',label:'BLACK & WHITE',   desc:'Text, overlays, surfaces, card backgrounds'},
        {id:'Grays',        label:'GRAYS',           desc:'Borders, placeholders, dividers, page backgrounds'},
        {id:'Accent',       label:'ACCENT',          desc:'Highlights, info states, star ratings, trust bar'},
      ];
      return (
        <div style={{marginBottom:32}}>
          {groups.map(grp => {
            const tokens = colorTokens.filter(t=>t.grp===grp.id);
            return (
              <div key={grp.id} style={{marginBottom:24,border:'1px solid #E8E8E8',borderRadius:10,overflow:'hidden',fontFamily:font}}>
                <div style={{padding:'12px 16px',background:'#fff',borderBottom:'1px solid #E8E8E8',display:'flex',alignItems:'baseline',gap:12}}>
                  <span style={{fontSize:11,fontWeight:800,letterSpacing:'0.12em',color:'#015253',textTransform:'uppercase'}}>{grp.label}</span>
                  <span style={{fontSize:11,color:'#A1A1A1'}}>{grp.desc}</span>
                </div>
                <div style={{display:'grid',gridTemplateColumns:'56px 1fr 2fr 100px 120px',padding:'7px 16px',background:'#F5F6FA',borderBottom:'1px solid #DADADA'}}>
                  {['','Name','Usage','HEX','RGB'].map(h=>(
                    <div key={h} style={{fontSize:9,fontWeight:700,color:'#AAA',fontFamily:font,textTransform:'uppercase',letterSpacing:'0.08em'}}>{h}</div>
                  ))}
                </div>
                {tokens.map((t, i)=>{
                  const isLast = i === tokens.length-1;
                  const isLight = ['#FFFFFF','#F5F6FA','#F0F0F0'].includes(t.hex) || t.value.includes('0.05') || t.value.includes('0.1');
                  const uid = t.hex + t.label;
                  const copied = copiedHex === uid;
                  return (
                    <div key={uid} style={{display:'grid',gridTemplateColumns:'56px 1fr 2fr 100px 120px',alignItems:'center',padding:'0 16px',minHeight:58,background:'#fff',borderBottom:isLast?'none':'1px solid #F0F0F0'}}>
                      <div onClick={()=>t.hex!=='—'&&copy(t.hex,uid)} title={copied?'Copied!':'Click to copy'} style={{width:38,height:34,borderRadius:6,background:t.value,border:isLight?'1px solid #E8E8E8':'none',cursor:t.hex!=='—'?'pointer':'default',position:'relative',overflow:'hidden',boxShadow:copied?'0 0 0 2px #015253':'none'}}>
                        {copied&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'#fff',fontSize:8,fontWeight:700}}>✓</span></div>}
                      </div>
                      <div style={{paddingRight:8}}>
                        <div style={{fontSize:13,fontWeight:700,color:'#000',lineHeight:1.25}}>{t.label}</div>
                        <div style={{fontSize:10,color:'#A1A1A1',marginTop:1,lineHeight:1.4}}>{t.subtitle}</div>
                      </div>
                      <div style={{fontSize:14,color:'#444',lineHeight:1.55,paddingRight:16}}>{t.role}</div>
                      <div>{t.hex!=='—'?<span onClick={()=>copy(t.hex,uid)} style={{fontFamily:'monospace',fontSize:11,fontWeight:700,color:'#015253',background:'rgba(1,82,83,0.07)',padding:'3px 6px',borderRadius:4,cursor:'pointer',whiteSpace:'nowrap'}}>{t.hex}</span>:<span style={{fontSize:11,color:'#CCC',fontStyle:'italic'}}>alpha</span>}</div>
                      <div style={{fontFamily:'monospace',fontSize:11,color:'#888'}}>{t.rgb}</div>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      );
    };

    // ── COLOR CARD ──
    const ColorCard = ({ value, label, rgb, usage }) => {
      const [cp,setCp]=useState(false);
      const hex=getHex(value);
      const isLight=["#FFFFFF","#F5F6FA","#F0F0F0","#F4FBFA","#FAFEFE"].includes(hex) || value.includes("0.05") || value.includes("0.1");
      return (
        <div onClick={()=>{navigator.clipboard?.writeText(hex||value).catch(()=>{});setCp(true);setTimeout(()=>setCp(false),1500);}}
          style={{cursor:"pointer",borderRadius:12,overflow:"hidden",border:"1px solid #E8E8E8",fontFamily:font,background:"#fff",display:"flex",flexDirection:"column",width:"100%"}}>
          <div style={{height:f(80),background:value,borderBottom:"1px solid #E8E8E8",position:"relative",flexShrink:0}}>
            {cp&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:f(12),fontWeight:700}}>Copied!</span></div>}
            <div style={{position:"absolute",bottom:8,right:10,background:"rgba(0,0,0,0.18)",borderRadius:4,padding:"2px 7px"}}>
              <span style={{fontSize:f(10),color:"#fff",fontFamily:"monospace",fontWeight:600}}>click to copy</span>
            </div>
          </div>
          <div style={{padding:`${f(12)}px ${f(14)}px ${f(14)}px`,display:"flex",flexDirection:"column",gap:f(6),flex:1}}>
            <div style={{fontSize:f(14),fontWeight:700,color:"#000000"}}>{label}</div>
            <div style={{display:"flex",gap:f(8),flexWrap:"wrap"}}>
              {hex&&<span style={{fontSize:f(11),fontFamily:"monospace",color:"#015253",background:"rgba(1,82,83,0.07)",padding:"2px 7px",borderRadius:4,fontWeight:600}}>{hex}</span>}
              <span style={{fontSize:f(11),fontFamily:"monospace",color:"#555",background:"#F5F6FA",padding:"2px 7px",borderRadius:4}}>{rgb}</span>
            </div>
            <div style={{fontSize:f(12),color:"#666",lineHeight:1.55,marginTop:f(2),borderTop:"1px solid #F0F0F0",paddingTop:f(8)}}>{usage}</div>
          </div>
        </div>
      );
    };

    // ── CODE BLOCK ──
    const CodeBlock = ({code}) => {
      const [copied,setCopied] = useState(false);

      // ── Syntax colours (VS Code dark theme inspired) ──
      const C = {
        comment:   '#5a8a6a',   // /* comments */        muted green
        selector:  '#DCDCAA',   // .class-name { }       yellow
        brace:     'rgba(255,255,255,0.45)', // { }      neutral
        prop:      '#9CDCFE',   // property-name:        sky blue
        colon:     'rgba(255,255,255,0.35)', // :        punctuation
        semi:      'rgba(255,255,255,0.35)', // ;
        value:     '#CE9178',   // values                salmon/orange
        hex:       '#B5CEA8',   // #015253 color values  light green
        num:       '#B5CEA8',   // px / rem numbers      light green
        htmlTag:   '#569CD6',   // <button>              blue
        htmlAttr:  '#9CDCFE',   // class=                sky blue
        htmlStr:   '#CE9178',   // "btn-primary"         salmon
        pseudo:    '#C586C0',   // :hover :active        purple
        atRule:    '#C586C0',   // -webkit-              purple
        text:      '#5CDBD3',   // default               teal
      };

      // ── CSS property line: "  property: value; /* cmt */" ──
      const highlightPropLine = (line) => {
        const indent = line.match(/^(\s*)/)[1];
        const trimmed = line.trimStart();
        const cmtMatch = trimmed.match(/^(.*?)(\/\*.*?\*\/\s*)$/);
        const body = cmtMatch ? cmtMatch[1] : trimmed;
        const cmt  = cmtMatch ? cmtMatch[2] : '';
        const colonIdx = body.indexOf(':');
        if (colonIdx === -1)
          return <>{indent}<span style={{color:C.text}}>{body}</span>{cmt&&<span style={{color:C.comment}}>{cmt}</span>}</>;
        const prop   = body.slice(0, colonIdx);
        const rest   = body.slice(colonIdx + 1);
        const valRaw = rest.replace(/;\s*$/, '').trim();
        const semi   = rest.trimEnd().endsWith(';') ? ';' : '';
        const isHex  = /^#[0-9a-fA-F]{3,8}$/.test(valRaw) || /^rgba?\(/.test(valRaw);
        return (
          <>
            {indent}
            <span style={{color:C.prop}}>{prop}</span>
            <span style={{color:C.colon}}>: </span>
            <span style={{color:isHex ? C.hex : C.value}}>{valRaw}</span>
            <span style={{color:C.semi}}>{semi}</span>
            {cmt && <span style={{color:C.comment}}>  {cmt.trim()}</span>}
          </>
        );
      };

      // ── HTML/JSX attribute string tokeniser ──
      // Handles: attr="val"  attr='val'  attr={{obj}}  attr={expr}  boolAttr
      const tokenizeAttrs = (attrStr) => {
        const out = []; let i = 0; let k = 0;
        const n = attrStr.length;
        while (i < n) {
          // Whitespace
          let ws = '';
          while (i < n && /\s/.test(attrStr[i])) ws += attrStr[i++];
          if (ws) out.push(<span key={k++} style={{color:C.text}}>{ws}</span>);
          if (i >= n) break;
          // Attr name
          let name = '';
          while (i < n && /[\w:-]/.test(attrStr[i])) name += attrStr[i++];
          if (!name) { out.push(<span key={k++} style={{color:C.text}}>{attrStr[i++]}</span>); continue; }
          if (i < n && attrStr[i] === '=') {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>);
            out.push(<span key={k++} style={{color:C.colon}}>=</span>);
            i++; // skip =
            // Value
            let val = ''; let valColor = C.htmlStr;
            if (attrStr[i] === '"' || attrStr[i] === "'") {
              const q = attrStr[i++]; val = q;
              while (i < n && attrStr[i] !== q) val += attrStr[i++];
              val += attrStr[i] || ''; if (i < n) i++;
            } else if (attrStr[i] === '{') {
              valColor = C.value; // JSX expr → salmon
              let depth = 0;
              while (i < n) {
                const ch = attrStr[i++]; val += ch;
                if (ch === '{') depth++;
                else if (ch === '}') { depth--; if (depth === 0) break; }
              }
            }
            out.push(<span key={k++} style={{color:valColor}}>{val}</span>);
          } else {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>); // boolean attr
          }
        }
        return out;
      };

      // ── Find closing > or /> index, skipping quoted strings & braces ──
      const findTagClose = (str) => {
        let i = 0;
        while (i < str.length) {
          const ch = str[i];
          if (ch === '"' || ch === "'") { const q=ch; i++; while(i<str.length&&str[i]!==q)i++; }
          else if (ch === '{') { let d=1; i++; while(i<str.length&&d>0){if(str[i]==='{')d++;else if(str[i]==='}')d--;i++;} continue; }
          else if (ch === '/' && str[i+1] === '>') return i;
          else if (ch === '>') return i;
          i++;
        }
        return -1;
      };

      // ── Per-line highlighter ──
      const highlightLine = (line, idx) => {
        const trimmed = line.trim();

        // Blank
        if (!trimmed) return <div key={idx} style={{height:'0.7em'}}/>;

        // Block comment  /* ... */
        if (/^\/\*/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML comment  <!-- ... -->
        if (/^<!--/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML / JSX tag line  <tag ...>  </tag>
        if (/^\s*<\/?[\w!]/.test(line)) {
          const parts = []; let k = 0;
          const indentM = line.match(/^(\s+)/);
          let rest = indentM ? (parts.push(indentM[1]), line.slice(indentM[1].length)) : line;

          // Tag name  <div  </div
          const tagM = rest.match(/^(<\/?)(\w[\w-]*)/);
          if (tagM) {
            parts.push(<span key={k++} style={{color:C.htmlTag}}>{tagM[1]}{tagM[2]}</span>);
            rest = rest.slice(tagM[0].length);
          }

          // Find where attrs end (closing > or />)
          const closeIdx = findTagClose(rest);
          const attrStr  = closeIdx >= 0 ? rest.slice(0, closeIdx) : rest;
          const afterClose = closeIdx >= 0 ? rest.slice(closeIdx) : '';

          // Tokenise attrs
          tokenizeAttrs(attrStr).forEach((el,i) => parts.push(React.cloneElement(el,{key:k++})));

          // Closing bracket + inline text after
          if (afterClose) {
            const cbM = afterClose.match(/^(\/?>)(.*)/s);
            if (cbM) {
              parts.push(<span key={k++} style={{color:C.htmlTag}}>{cbM[1]}</span>);
              if (cbM[2].trim()) {
                // Split: optional text · closing tag · optional remainder
                const splitM = cbM[2].match(/^([^<]*?)(<\/[\w][\w-]*>)(.*)$/s);
                if (splitM) {
                  if (splitM[1]) parts.push(<span key={k++} style={{color:C.text}}>{splitM[1]}</span>);
                  parts.push(<span key={k++} style={{color:C.htmlTag}}>{splitM[2]}</span>);
                  if (splitM[3]) parts.push(<span key={k++} style={{color:C.text}}>{splitM[3]}</span>);
                } else {
                  parts.push(<span key={k++} style={{color:C.text}}>{cbM[2]}</span>);
                }
              }
            } else parts.push(<span key={k++} style={{color:C.text}}>{afterClose}</span>);
          }
          return <div key={idx}>{parts}</div>;
        }

        // Self-close  />  or lone  >  on its own line
        if (/^\s*\/?>$/.test(trimmed)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.htmlTag}}>{trimmed}</span></div>;
        }

        // Closing CSS brace  }
        if (/^\s*\}\s*$/.test(line)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.brace}}>{'}'}</span></div>;
        }

        // CSS property line: word-chars then colon (not a URL)
        if (/^\s*-?[\w-]+\s*:(?!\/\/)/.test(line))
          return <div key={idx}>{highlightPropLine(line)}</div>;

        // CSS selector: must start with . # & * or end with { or ,
        // (plain text like "Button" or SVG path data should fall through to default)
        if (/^\s*[.#&*]/.test(line) || (/^\s*[\w-]/.test(line) && /[{,]\s*$/.test(line))) {
          const m = line.match(/^(\s*)(.*?)(\s*\{)?\s*$/);
          const indent = m[1], brace = m[3]||'';
          const selParts = m[2].split(/(::?[\w-]+)/g).map((p,i) =>
            /^::?[\w-]/.test(p)
              ? <span key={i} style={{color:C.pseudo}}>{p}</span>
              : <span key={i} style={{color:C.selector}}>{p}</span>
          );
          return <div key={idx}>{indent}{selParts}{brace&&<span style={{color:C.brace}}>{brace}</span>}</div>;
        }

        // Default: plain text, SVG path data, text content, etc.
        return <div key={idx}><span style={{color:C.text}}>{line}</span></div>;
      };

      const lines = code.split('\n');
      const [open, setOpen] = useState(false);

      return (
        <>
          {/* "View Code" trigger button */}
          <button
            onClick={() => setOpen(true)}
            style={{
              display:'inline-flex', alignItems:'center', gap:6,
              background:'#F5F6FA', border:'1px solid #E8E8E8',
              borderRadius:6, padding:'6px 14px',
              fontSize:f(13), fontFamily:font, fontWeight:500, color:'#015253',
              cursor:'pointer', marginBottom:24,
              transition:'background 0.15s',
            }}
            onMouseEnter={e=>e.currentTarget.style.background='#E8EEF0'}
            onMouseLeave={e=>e.currentTarget.style.background='#F5F6FA'}
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#015253" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>
            </svg>
            View Code
          </button>

          {/* Modal overlay */}
          {open && (
            <div
              onClick={e=>{if(e.target===e.currentTarget)setOpen(false);}}
              style={{
                position:'fixed', inset:0, background:'rgba(0,0,0,0.55)',
                zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center',
                padding:32,
              }}
            >
              <div style={{
                background:'#01292A', borderRadius:12, width:'100%', maxWidth:860,
                maxHeight:'80vh', display:'flex', flexDirection:'column',
                boxShadow:'0 24px 60px rgba(0,0,0,0.45)',
                overflow:'hidden',
              }}>
                {/* Modal header */}
                <div style={{
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                  padding:'12px 16px', borderBottom:'1px solid rgba(255,255,255,0.1)',
                  flexShrink:0,
                }}>
                  <span style={{fontSize:13,color:'rgba(255,255,255,0.6)',fontFamily:'monospace'}}>Code snippet</span>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <button
                      onClick={()=>{navigator.clipboard?.writeText(code).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),1500);}}
                      style={{background:copied?'#009900':'rgba(255,255,255,0.12)',color:'#fff',border:'none',borderRadius:4,padding:'4px 12px',fontSize:f(11),fontFamily:font,cursor:'pointer',transition:'background 0.2s'}}>
                      {copied?'Copied!':'Copy'}
                    </button>
                    <button
                      onClick={()=>setOpen(false)}
                      style={{background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.7)',border:'none',borderRadius:4,width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:16}}>
                      ✕
                    </button>
                  </div>
                </div>
                {/* Code body */}
                <div style={{overflowY:'auto', padding:`${f(14)}px ${f(16)}px`, fontSize:f(12), fontFamily:'monospace', lineHeight:1.65, whiteSpace:'pre'}}>
                  {lines.map((line,i) => highlightLine(line,i))}
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    // ── PREVIEW & HELPER COMPONENTS ──
    const Preview = ({children}) => <div style={{background:'#F8F9FA',border:'1px solid #E8E8E8',borderRadius:8,padding:24,marginBottom:20}}>{children}</div>;

    const ShowRow = ({label,children,dark=true}) => (

    // ── NEW SECTION COMPONENTS ──

    // Spacing Section — exact Figma "Spacing Tokens" variable values
    const SpacingSection = () => {
      const tokens = [
        {name:'spacing/1',px:4},{name:'spacing/2',px:8},{name:'spacing/3',px:12},

    // Shadow Section
    const ShadowSection = () => {

    // Tooltip Section
    const TooltipSection = () => {

        <div>

            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>

              <span style={{fontSize:f(10),color:'#A1A1A1',fontFamily:font}}>Type=Dark</span>

            <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
              <div style={{padding:'8px 12px',borderRadius:6,background:'#fff',color:'#000000',border:'1px solid #CCCCCC',fontSize:f(12),fontFamily:font,boxShadow:'0 2px 8px rgba(0,0,0,0.10)'}}>Tooltip text</div>

    // Toast Section
    const ToastSection = () => {

    // Tabs Section
    const TabsSection = () => {

      return (
        <div>

/* height: 50px · border-radius: 4px · font: 16px Regular      */

.textfield-wrapper {
  position: relative;
  width: 500px;
}

.textfield {
  width: 100%;
  height: 50px;
  padding: 13px 15px;
  border: 1px solid #DADADA;        /* color/gray/border */
  border-radius: 4px;               /* corner-radius/m */
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 16px;
  line-height: 24px;
  color: #000000;                   /* color/base/black */
  background: #ffffff;
  outline: none;
  box-sizing: border-box;
}

.textfield::placeholder {
  color: #A1A1A1;                   /* color/gray/default */
}

.textfield:focus {
  border-color: #009951;            /* color/green/select */
}

.textfield.is-done {
  border-color: #009951;
}

.textfield.is-error {
  border-color: #C90000;            /* color/red/error */
}

/* Floating label — appears when focused or filled */
.textfield-label {
  position: absolute;
  top: -7px;
  left: 11px;
  background: #ffffff;
  padding: 0 5px;
  font-size: 12px;
  color: #000000;
  pointer-events: none;
}

/* Error message */
.textfield-error {
  position: absolute;
  bottom: -18px;
  right: 0;
  font-size: 10px;
  color: #C90000;
}

<!-- HTML -->
<!-- Default -->
<div class="textfield-wrapper">
  <input class="textfield" type="text" placeholder="Name" />
</div>

<!-- Active (focused, empty) -->
<div class="textfield-wrapper">
  <label class="textfield-label">Name</label>
  <input class="textfield" type="text" autofocus />
</div>

<!-- Done (value entered) -->
<div class="textfield-wrapper">
  <label class="textfield-label">Name</label>
  <input class="textfield is-done" type="text" value="Vossberg" />

<!-- Error -->
<div class="textfield-wrapper">
  <input class="textfield is-error" type="text" placeholder="Name" />

`/* ── Radio Button ──────────────────────────────────────────── */
/* 20×20px circle · green active dot · error & disabled states */

.radio-wrapper {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 14px;
  color: #000000;
  user-select: none;
}

.radio {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid #DADADA;      /* color/gray/border */
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-sizing: border-box;
}

/* Active / selected */
.radio.active {
  border-color: #009951;            /* color/green/select */
  background: #009951;
}

.radio.active::after {
  content: '';
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #ffffff;
}

/* Error */
.radio.error {
  border-color: #C90000;            /* color/red/error */
}

/* Disabled */
.radio-wrapper.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

<!-- HTML -->
<!-- Default (Unselected) -->
<label class="radio-wrapper">
  <span class="radio"></span>
  Unselected
</label>

<!-- Active (Selected) -->
<label class="radio-wrapper">
  <span class="radio active"></span>
  Selected
</label>

<!-- Disabled -->
<label class="radio-wrapper disabled">
  <span class="radio"></span>
  Disabled option
</label>

<!-- Error -->
<label class="radio-wrapper">
  <span class="radio error"></span>
  Error state
</label>`
