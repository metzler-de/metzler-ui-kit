  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 184.3 184.3'%3E%3Crect width='184.3' height='184.3' rx='5.75' fill='%23cc322b'/%3E%3Cpath fill='%23fff' d='M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    button { -webkit-tap-highlight-color: transparent; }
    button:active { transform: none !important; top: 0 !important; position: relative; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #FFFFFF; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #DADADA; border-radius: 3px; }
    input { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    input::placeholder { color: #A1A1A1; }
    input[type="password"]:not(:placeholder-shown) { letter-spacing: 0.12em; }
    a { color: #015253; }
    h1[id] { scroll-margin-top: 72px; }
    @keyframes tslidein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @keyframes drawerIn  { from { transform:translateX(-100%); } to { transform:translateX(0); } }
    @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }

    /* ── Spacers ── */
    .spacer-s { display: block; height: 1.5rem; }
    .spacer-m { display: block; height: 3rem; }
    .spacer-l { display: block; height: 6rem; }

    /* ── Dividers ── */
    .divider-s { border: none; border-top: 0.0625rem solid var(--color-graphite-200, #E6E6E8); margin: 1rem 0; }
    .divider-m { border: none; border-top: 0.0625rem solid var(--color-graphite-200, #E6E6E8); margin: 2rem 0; }
    .divider-l { border: none; border-top: 0.0625rem solid var(--color-graphite-200, #E6E6E8); margin: 4rem 0; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useContext, createContext } = React;
    const MobCtx = createContext({ mob: false, openDrawer: () => {} });

    // ── UTILITIES ──
    const hexToRgb = (hex) => { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgb(${r},${g},${b})`; };
    const rgbaToHex = (rgba) => { const m=rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); if(!m)return null; const h=n=>parseInt(n).toString(16).padStart(2,"0"); return `#${h(m[1])}${h(m[2])}${h(m[3])}`.toUpperCase(); };
    const getHex = v => v.startsWith("#") ? v.toUpperCase() : rgbaToHex(v);

    const S = 1.2;
    const f = n => Math.round(n * S);
    const _ua   = typeof navigator !== 'undefined' ? navigator.userAgent : '';
    const _isWin = /Win/.test(_ua) && !/Macintosh/.test(_ua);
    const font  = _isWin
      ? "Arial, 'Helvetica Neue', Helvetica, sans-serif"
      : "'Helvetica Neue', Helvetica, Arial, sans-serif";

    // ── DESIGN TOKENS (JS) ──
    const T = {
      // Teal
      teal50:'#F2F6F6', teal75:'#E3F2F0', teal100:'#E6EEEE',
      teal:'#015253', teal600:'#014A4B', teal700:'#01292A', teal900:'#001D1D',
      // Brand
      dBlack:'#1A171B',
      // Green
      green:'#009951',
      // Red
      red50:'#FFF0EF', red:'#D42924', red600:'#B52320', red900:'#4D0E0D',
      // Accent
      mint:'#5CDBD3', star:'#FFC041',
      // Surfaces
      paper:'#F5F6FA', g100:'#F0F0F0', g200:'#E6E6E8', g300:'#DADADA',
      g400:'#BFBFC2', g450:'#CCCCCC',
      // Text
      g500:'#A1A1A1', g600:'#6A6A6A', g700:'#54545C', g800:'#2E2E36',
      g850:'#333333', g900:'#1A1A1F',
      white:'#FFFFFF', black:'#000000',
      // Border Radius
      rSm:'0.125rem', r:'0.25rem', rLg:'0.5rem', rPill:'624.94rem',
      // Font sizes
      fD1:'5rem', fD2:'3.5rem', fD3:'3rem',
      fD4:'2.875rem', fH1:'1.875rem', fH2:'1.5rem', fH3:'1.25rem',
      fH4:'1.125rem', fXl:'1.25rem', fLg:'1.125rem', fBody:'1rem', fSm:'0.875rem', fXs:'0.75rem',
      fXxs:'0.6875rem', f13:'0.8125rem',
    };

    // ── TOKEN REVERSE LOOKUP (hex → JS token name + CSS variable name) ──
    const tokenMap = {};
    Object.entries(T).forEach(([key,val])=>{
      if(typeof val==='string' && val.startsWith('#')){
        const h=val.toUpperCase();
        if(!tokenMap[h]) tokenMap[h]=[];
        tokenMap[h].push(`T.${key}`);
      }
    });
    const cssVarMap = {
      '#F2F6F6':'--color-teal-50','#E3F2F0':'--color-teal-75','#E6EEEE':'--color-teal-100',
      '#015253':'--color-teal','#014A4B':'--color-teal-600','#01292A':'--color-teal-700','#001D1D':'--color-teal-900',
      '#D42924':'--color-metzler-rot','#1A171B':'--color-digital-black',
      '#009951':'--color-green',
      '#FFF0EF':'--color-red-50','#B52320':'--color-red-600','#4D0E0D':'--color-red-900',
      '#5CDBD3':'--color-mint','#FFC041':'--color-star',
      '#F5F6FA':'--color-paper','#F0F0F0':'--color-graphite-100','#E6E6E8':'--color-graphite-200',
      '#DADADA':'--color-graphite-300','#BFBFC2':'--color-graphite-400','#CCCCCC':'--color-graphite-450',
      '#A1A1A1':'--color-graphite-500','#6A6A6A':'--color-graphite-600','#54545C':'--color-graphite-700',
      '#2E2E36':'--color-graphite-800','#333333':'--color-graphite-850','#1A1A1F':'--color-graphite-900',
      '#FFFFFF':'--color-white','#000000':'--color-black',
    };

    // ── CHANGELOG — update this on every push ──
    const CHANGELOG = {

      date: '2026-07-02',

    // ── DS INPUT FIELD — floating-label input matching Textfield component spec ──
    // Matches exactly: height 3.125rem · border T.g300→T.teal on focus · T.r radius · floating label on border
    const DSInputField = ({ label, type='text', showToggle=false, error=null }) => {
      const [val,  setVal]  = useState('');
      const [focus, setFocus] = useState(false);
      const [show,  setShow]  = useState(false);
      const isFloating = focus || val.length > 0;
      const borderColor = error ? T.red : (focus ? T.teal : T.g300);
      const labelColor  = error ? T.red : (isFloating ? (focus ? T.teal : T.g700) : T.g500);
      const inputType   = showToggle ? (show ? 'text' : 'password') : type;
      return (
        <div style={{position:'relative', width:'100%'}}>
          {/* Floating label — merges with the top border when active or filled */}
          <label style={{
            position:'absolute',
            top: isFloating ? '-0.4375rem' : '50%',
            left: isFloating ? '0.6875rem' : '0.9375rem',
            transform: isFloating ? 'none' : 'translateY(-50%)',
            background: isFloating ? T.white : 'transparent',
            padding: isFloating ? '0 0.3125rem' : '0',
            fontSize: isFloating ? T.fXs : T.fBody,
            lineHeight: '0.875rem',
            color: labelColor,
            fontFamily: font,
            whiteSpace: 'nowrap',
            pointerEvents: 'none',
            zIndex: 1,
            transition: 'top 0.15s, left 0.15s, font-size 0.15s, color 0.15s',
            userSelect: 'none',
          }}>{label}</label>
          {/* Actual input */}
          <input
            type={inputType}
            value={val}
            onChange={e => setVal(e.target.value)}
            onFocus={() => setFocus(true)}
            onBlur={() => setFocus(false)}
            style={{
              display:'block', width:'100%', height:'3.125rem',
              border:`0.0625rem solid ${borderColor}`,
              borderRadius: T.r,
              padding: showToggle ? '0 3rem 0 0.9375rem' : '0 0.9375rem',
              fontSize: T.fBody, fontFamily: font, color: T.g900,
              background: T.white, boxSizing:'border-box',
              outline:'none', transition:'border-color 0.15s',
              appearance:'none', WebkitAppearance:'none',
            }}
          />
          {/* Show/hide toggle */}
          {showToggle && (
            <button type="button" onClick={()=>setShow(v=>!v)}
              style={{position:'absolute',right:'0.75rem',top:'50%',transform:'translateY(-50%)',
                background:'none',border:'none',cursor:'pointer',padding:'0.25rem',
                display:'flex',alignItems:'center',color:T.g500}}>
              {show
                ? <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                : <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              }
            </button>
          )}
          {/* Error message — sits on the bottom border, right-aligned */}
          {error && (
            <div style={{position:'absolute',bottom:'-0.4375rem',right:'0.6875rem',
              background:T.white,padding:'0 0.3125rem',lineHeight:'0.875rem',zIndex:1}}>
              <span style={{fontFamily:font,fontSize:T.fXs,color:T.red,whiteSpace:'nowrap'}}>{error}</span>
            </div>
          )}
        </div>
      );
    };

    // ── NAV ITEMS ──
    const navItems = [

    const allNavItems = navItems.filter(n=>n.type==="item");

    // ── COLOR TOKENS (Metzler Extended Color System) ──
    const colorTokens = [
      // ── TEAL TONES ──
      {value:"#F2F6F6", label:"Teal 50",  subtitle:"Brand-tinted backgrounds",           role:"Subtle brand-tinted backgrounds, selected row highlight, hover row",                                        hex:"#F2F6F6", rgb:"242 · 246 · 246", grp:"Teal Tones"},
      {value:"#E3F2F0", label:"Teal 75",  subtitle:"Light teal · Hover fills",           role:"Button hover fills, active list row, light teal accent surfaces, section backgrounds on landing pages",                                           hex:"#E3F2F0", rgb:"227 · 242 · 240", grp:"Teal Tones"},
      {value:"#E6EEEE", label:"Teal 100", subtitle:"Info surfaces · Selected states",     role:"Info box fills, selected filter chip, tooltip backgrounds",                                                 hex:"#E6EEEE", rgb:"230 · 238 · 238", grp:"Teal Tones"},
      {value:"#015253", label:"Teal 500", subtitle:"The brand",                           role:"CTAs, nav, active states, focus rings, links — the single brand anchor",                                   hex:"#015253", rgb:"1 · 82 · 83",     grp:"Teal Tones", isDefault:true},
      {value:"#014A4B", label:"Teal 600", subtitle:"Hover · Pressed",                    role:"Hover/pressed state for any teal interactive element",                                                      hex:"#014A4B", rgb:"1 · 74 · 75",     grp:"Teal Tones"},
      {value:"#01292A", label:"Teal 700", subtitle:"Footer · High-contrast",              role:"Footer background, high-contrast icons, accessible text on Teal 50/100",                                hex:"#01292A", rgb:"1 · 41 · 42",     grp:"Teal Tones"},
      {value:"#001D1D", label:"Teal 900", subtitle:"Max-contrast",                       role:"Maximum-contrast text on teal surfaces",                                                                     hex:"#001D1D", rgb:"0 · 29 · 29",     grp:"Teal Tones"},
      // ── BRAND ──
      {value:"#D42924", label:"Metzler Rot",         subtitle:"Signal color · Logo M-square only",    role:"Logo M-square, discount badge (–10%) on product cards. Never for CTAs, body text, or large fills", hex:"#D42924", rgb:"212 · 41 · 36",  grp:"Brand"},
      {value:"#1A171B", label:"Digital Schwarz",     subtitle:"Brand black · Headlines + wordmark",   role:'Product titles, page headings, "METZLER" wordmark, table rules, icon fills across print and web',  hex:"#1A171B", rgb:"26 · 23 · 27",   grp:"Brand"},
      // ── GREEN ──
      {value:"#009951", label:"Green / Select",      subtitle:"Success · Availability · Selection",   role:"In-stock badge, success alert/toast, checkbox (Configurator). Not used for radio/textfield active — those use teal.", hex:"#009951", rgb:"0 · 153 · 81",   grp:"Green"},
      {value:"rgba(0,153,81,0.5)", label:"Green 50%", subtitle:"Muted green · Inactive states",       role:"Muted in-stock, disabled selected checkboxes, greyed-out availability indicators",                hex:"#009951", rgb:"rgba(0, 153, 81, 0.50)",  grp:"Green"},
      // ── RED ──
      {value:"#FFF0EF", label:"Red 50",  subtitle:"Alert · Error backgrounds",         role:"Alert/error background fills, validation row tints — derived from Metzler Rot",                           hex:"#FFF0EF", rgb:"255 · 240 · 239", grp:"Red"},
      {value:"#D42924", label:"Red 500", subtitle:"Metzler Rot · Default",             role:"Sale prices, error text, badges, borders. Not for CTA buttons — red triggers purchase anxiety",           hex:"#D42924", rgb:"212 · 41 · 36",   grp:"Red", isDefault:true},

      // ── YELLOW ──
      {value:"#FFC041", label:"Star Yellow",         subtitle:"Review stars · Rating UI",             role:"Review star fill colour on product cards, PDP rating bars, order confirmation star rating widget",  hex:"#FFC041", rgb:"255 · 192 · 65",   grp:"Accent"},
      // ── GRAPHITE SURFACES ──
      {value:"#F5F6FA", label:"Paper White",  subtitle:"Graphite 50 · Page backgrounds",  role:"Page bg, sidebar, search bar pill",                                                                         hex:"#F5F6FA", rgb:"245 · 246 · 250", grp:"Graphite Surfaces"},
      {value:"#F0F0F0", label:"Graphite 100", subtitle:"Off-white · Row dividers",         role:"Row dividers, inactive tabs, skeleton, badges",                                                             hex:"#F0F0F0", rgb:"240 · 240 · 240", grp:"Graphite Surfaces"},

      // ── GRAPHITE TEXT ──
      {value:"#A1A1A1", label:"Graphite 500", subtitle:"Placeholders · Disabled",          role:"Placeholder text, disabled labels, inactive icons",                                                         hex:"#A1A1A1", rgb:"161 · 161 · 161", grp:"Graphite Text"},

      {value:"#1A1A1F", label:"Graphite 900", subtitle:"Headings",                         role:"Headings, product names, prices",                                                                           hex:"#1A1A1F", rgb:"26 · 26 · 31",    grp:"Graphite Text"},

    // ── CODE BLOCK ──
    const CodeBlock = ({code, inline=false, lang='HTML'}) => {
      const [copied,setCopied] = useState(false);

      // ── Syntax colours (VS Code dark theme inspired) ──
      const C = {
        comment:   '#5a8a6a',   // /* comments */        muted green
        selector:  '#DCDCAA',   // .class-name { }       yellow
        brace:     'rgba(255,255,255,0.45)', // { }      neutral
        prop:      '#9CDCFE',   // property-name:        sky blue
        colon:     'rgba(255,255,255,0.35)', // :        punctuation
        semi:      'rgba(255,255,255,0.35)', // ;
        value:     '#CE9178',   // values                salmon/orange
        hex:       '#B5CEA8',   // #015253 color values  light green
        num:       '#B5CEA8',   // px / rem numbers      light green
        htmlTag:   '#569CD6',   // <button>              blue
        htmlAttr:  '#9CDCFE',   // class=                sky blue
        htmlStr:   '#CE9178',   // "btn-primary"         salmon
        pseudo:    '#C586C0',   // :hover :active        purple
        atRule:    '#C586C0',   // -webkit-              purple
        text:      '#5CDBD3',   // default               teal
      };

      // ── CSS property line: "  property: value; /* cmt */" ──
      const highlightPropLine = (line) => {
        const indent = line.match(/^(\s*)/)[1];
        const trimmed = line.trimStart();
        const cmtMatch = trimmed.match(/^(.*?)(\/\*.*?\*\/\s*)$/);
        const body = cmtMatch ? cmtMatch[1] : trimmed;
        const cmt  = cmtMatch ? cmtMatch[2] : '';
        const colonIdx = body.indexOf(':');
        if (colonIdx === -1)
          return <>{indent}<span style={{color:C.text}}>{body}</span>{cmt&&<span style={{color:C.comment}}>{cmt}</span>}</>;
        const prop   = body.slice(0, colonIdx);
        const rest   = body.slice(colonIdx + 1);
        const valRaw = rest.replace(/;\s*$/, '').trim();
        const semi   = rest.trimEnd().endsWith(';') ? ';' : '';
        const isHex  = /^#[0-9a-fA-F]{3,8}$/.test(valRaw) || /^rgba?\(/.test(valRaw);
        return (
          <>
            {indent}
            <span style={{color:C.prop}}>{prop}</span>
            <span style={{color:C.colon}}>: </span>
            <span style={{color:isHex ? C.hex : C.value}}>{valRaw}</span>
            <span style={{color:C.semi}}>{semi}</span>
            {cmt && <span style={{color:C.comment}}>  {cmt.trim()}</span>}
          </>
        );
      };

      // ── HTML/JSX attribute string tokeniser ──
      // Handles: attr="val"  attr='val'  attr={{obj}}  attr={expr}  boolAttr
      const tokenizeAttrs = (attrStr) => {
        const out = []; let i = 0; let k = 0;
        const n = attrStr.length;
        while (i < n) {
          // Whitespace
          let ws = '';
          while (i < n && /\s/.test(attrStr[i])) ws += attrStr[i++];
          if (ws) out.push(<span key={k++} style={{color:C.text}}>{ws}</span>);
          if (i >= n) break;
          // Attr name
          let name = '';
          while (i < n && /[\w:-]/.test(attrStr[i])) name += attrStr[i++];
          if (!name) { out.push(<span key={k++} style={{color:C.text}}>{attrStr[i++]}</span>); continue; }
          if (i < n && attrStr[i] === '=') {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>);
            out.push(<span key={k++} style={{color:C.colon}}>=</span>);
            i++; // skip =
            // Value
            let val = ''; let valColor = C.htmlStr;
            if (attrStr[i] === '"' || attrStr[i] === "'") {
              const q = attrStr[i++]; val = q;
              while (i < n && attrStr[i] !== q) val += attrStr[i++];
              val += attrStr[i] || ''; if (i < n) i++;
            } else if (attrStr[i] === '{') {
              valColor = C.value; // JSX expr → salmon
              let depth = 0;
              while (i < n) {
                const ch = attrStr[i++]; val += ch;
                if (ch === '{') depth++;
                else if (ch === '}') { depth--; if (depth === 0) break; }
              }
            }
            out.push(<span key={k++} style={{color:valColor}}>{val}</span>);
          } else {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>); // boolean attr
          }
        }
        return out;
      };

      // ── Find closing > or /> index, skipping quoted strings & braces ──
      const findTagClose = (str) => {
        let i = 0;
        while (i < str.length) {
          const ch = str[i];
          if (ch === '"' || ch === "'") { const q=ch; i++; while(i<str.length&&str[i]!==q)i++; }
          else if (ch === '{') { let d=1; i++; while(i<str.length&&d>0){if(str[i]==='{')d++;else if(str[i]==='}')d--;i++;} continue; }
          else if (ch === '/' && str[i+1] === '>') return i;
          else if (ch === '>') return i;
          i++;
        }
        return -1;
      };

      // ── Per-line highlighter ──
      const highlightLine = (line, idx) => {
        const trimmed = line.trim();

        // Blank
        if (!trimmed) return <div key={idx} style={{height:'0.7em'}}/>;

        // Block comment  /* ... */
        if (/^\/\*/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML comment  <!-- ... -->
        if (/^<!--/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML / JSX tag line  <tag ...>  </tag>
        if (/^\s*<\/?[\w!]/.test(line)) {
          const parts = []; let k = 0;
          const indentM = line.match(/^(\s+)/);
          let rest = indentM ? (parts.push(indentM[1]), line.slice(indentM[1].length)) : line;

          // Tag name  <div  </div
          const tagM = rest.match(/^(<\/?)(\w[\w-]*)/);
          if (tagM) {
            parts.push(<span key={k++} style={{color:C.htmlTag}}>{tagM[1]}{tagM[2]}</span>);
            rest = rest.slice(tagM[0].length);
          }

          // Find where attrs end (closing > or />)
          const closeIdx = findTagClose(rest);
          const attrStr  = closeIdx >= 0 ? rest.slice(0, closeIdx) : rest;
          const afterClose = closeIdx >= 0 ? rest.slice(closeIdx) : '';

          // Tokenise attrs
          tokenizeAttrs(attrStr).forEach((el,i) => parts.push(React.cloneElement(el,{key:k++})));

          // Closing bracket + inline text after
          if (afterClose) {
            const cbM = afterClose.match(/^(\/?>)(.*)/s);
            if (cbM) {
              parts.push(<span key={k++} style={{color:C.htmlTag}}>{cbM[1]}</span>);
              if (cbM[2].trim()) {
                // Split: optional text · closing tag · optional remainder
                const splitM = cbM[2].match(/^(.*?)(<\/[\w][\w-]*>)\s*$/s);
                const pushTextWithTags = (str) => {
                  str.split(/(<[^>]+>)/g).forEach(p => {
                    if (!p) return;
                    if (/^<[^>]+>$/.test(p))
                      parts.push(<span key={k++} style={{color:'#569CD6',opacity:0.85}}>{p}</span>);
                    else
                      parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{p}</span>);
                  });
                };
                if (splitM) {
                  if (splitM[1]) pushTextWithTags(splitM[1]);
                  parts.push(<span key={k++} style={{color:C.htmlTag}}>{splitM[2]}</span>);
                  if (splitM[3]) pushTextWithTags(splitM[3]);
                } else {
                  parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{cbM[2]}</span>);
                }
              }
            } else parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{afterClose}</span>);
          }
          return <div key={idx}>{parts}</div>;
        }

        // Self-close  />  or lone  >  on its own line
        if (/^\s*\/?>$/.test(trimmed)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.htmlTag}}>{trimmed}</span></div>;
        }

        // Closing CSS brace  }
        if (/^\s*\}\s*$/.test(line)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.brace}}>{'}'}</span></div>;
        }

        // CSS property line: word-chars then colon (not a URL)
        if (/^\s*-?[\w-]+\s*:(?!\/\/)/.test(line))
          return <div key={idx}>{highlightPropLine(line)}</div>;

        // Single-line CSS rule: .selector { prop: val; prop: val; }
        if (/^\s*[.#&*]/.test(line) && /\{[^}]+\}/.test(line)) {
          const m = line.match(/^(\s*)([^{]+?)(\{)(.*?)(\})\s*$/);
          if (m) {
            const [, indent, selectorRaw, , declarations] = m;
            const selParts = selectorRaw.trim().split(/(::?[\w-]+)/g).map((p,i) =>
              /^::?[\w-]/.test(p)
                ? <span key={i} style={{color:C.pseudo}}>{p}</span>
                : <span key={i} style={{color:C.selector}}>{p}</span>
            );
            const declParts = []; let di = 0;
            declarations.trim().split(';').forEach(decl => {
              const d = decl.trim(); if (!d) return;
              const ci = d.indexOf(':'); if (ci === -1) return;
              const prop = d.slice(0,ci).trim();
              const valRaw = d.slice(ci+1).trim();
              const isHex = /^#[0-9a-fA-F]{3,8}$/.test(valRaw) || /^rgba?\(/.test(valRaw);
              if (di > 0) declParts.push(' ');
              declParts.push(
                <React.Fragment key={di++}>
                  <span style={{color:C.prop}}>{prop}</span>
                  <span style={{color:C.colon}}>: </span>
                  <span style={{color:isHex?C.hex:C.value}}>{valRaw}</span>
                  <span style={{color:C.semi}}>;</span>
                </React.Fragment>
              );
            });
            return (
              <div key={idx}>
                {indent}{selParts}
                <span style={{color:C.brace}}>{' {'}</span>
                {' '}{declParts}{' '}
                <span style={{color:C.brace}}>{'}'}</span>
              </div>
            );
          }
        }

        // CSS selector: must start with . # & * or end with { or ,
        // (plain text like "Button" or SVG path data should fall through to default)
        if (/^\s*[.#&*]/.test(line) || (/^\s*[\w-]/.test(line) && /[{,]\s*$/.test(line))) {
          const m = line.match(/^(\s*)(.*?)(\s*\{)?\s*$/);
          const indent = m[1], brace = m[3]||'';
          const selParts = m[2].split(/(::?[\w-]+)/g).map((p,i) =>
            /^::?[\w-]/.test(p)
              ? <span key={i} style={{color:C.pseudo}}>{p}</span>
              : <span key={i} style={{color:C.selector}}>{p}</span>
          );
          return <div key={idx}>{indent}{selParts}{brace&&<span style={{color:C.brace}}>{brace}</span>}</div>;
        }

        // HTML attribute continuation line (wrapped multi-line tag, no leading <)
        if (/^\s+[\w:-][\w:-]*\s*=/.test(line)) {
          const parts = []; let k = 0;
          const indentM = line.match(/^(\s+)/);
          let rest = indentM ? (parts.push(indentM[1]), line.slice(indentM[1].length)) : line;
          const closeM = rest.match(/^(.*?)(\s*\/?>)\s*$/);
          const attrPart = closeM ? closeM[1] : rest;
          const closePart = closeM ? closeM[2] : '';
          tokenizeAttrs(attrPart).forEach((el,i) => parts.push(React.cloneElement(el,{key:k++})));
          if (closePart) parts.push(<span key={k++} style={{color:C.htmlTag}}>{closePart.trim()}</span>);
          return <div key={idx}>{parts}</div>;
        }

        // Default: plain text, HTML text content, etc.
        return <div key={idx}><span style={{color:'#D4D4D4'}}>{line}</span></div>;
      };

      const lines = code.split('\n');
      const [open, setOpen] = useState(false);

      // ── Inline (Bootstrap-style) mode ──
      if (inline) {
        return (
          <div style={{borderTop:`1px solid ${T.g200}`,overflow:'hidden',borderRadius:'0 0 8px 8px',maxWidth:'100%',width:'100%',boxSizing:'border-box'}}>

              <button
                onClick={()=>{navigator.clipboard?.writeText(code).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),1500);}}
                style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',alignItems:'center',gap:4,
                  color:copied?T.green:T.g500,fontSize:10,fontFamily:font,fontWeight:600,transition:'color 0.2s'}}>

                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                  </svg>

              </button>
            </div>
            <div style={{background:'#1E1E1E',padding:'14px 20px',fontFamily:'monospace',
              fontSize:12.5,lineHeight:1.7,whiteSpace:'pre',overflowX:'auto',maxWidth:'100%',boxSizing:'border-box'}}>
              {lines.map((line,i) => highlightLine(line,i))}
            </div>
          </div>
        );
      }

      return (
        <>

          {/* View Code trigger button */}
          <button
            onClick={()=>setOpen(true)}
            style={{
              display:'inline-flex', alignItems:'center', gap:6,
              background:'none', border:'1.5px solid #DA7756',
              borderRadius:6, padding:'6px 14px',
              fontSize:T.fXs, color:'#DA7756', fontFamily:font,

            }}
            onMouseEnter={e=>{e.currentTarget.style.background='#DA7756';e.currentTarget.style.color=T.white;}}
            onMouseLeave={e=>{e.currentTarget.style.background='none';e.currentTarget.style.color='#DA7756';}}
          >
            <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
              <path d="M4.5 2.5L1.5 6.5l3 4M8.5 2.5l3 4-3 4" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            View Code
          </button>

          {/* Modal overlay */}
          {open && (
            <div
              onClick={e=>{if(e.target===e.currentTarget)setOpen(false);}}
              style={{
                position:'fixed', inset:0, background:'rgba(0,0,0,0.55)',
                zIndex:9999, display:'flex', alignItems:'center', justifyContent:'center',
                padding:32,
              }}
            >
              <div style={{
                background:T.teal900, borderRadius:12, width:'100%', maxWidth:860,
                maxHeight:'80vh', display:'flex', flexDirection:'column',
                boxShadow:'0 24px 60px rgba(0,0,0,0.45)',
                overflow:'hidden',
              }}>
                {/* Modal header */}
                <div style={{
                  display:'flex', alignItems:'center', justifyContent:'space-between',
                  padding:'12px 16px', borderBottom:'1px solid rgba(255,255,255,0.1)',
                  flexShrink:0,
                }}>
                  <span style={{fontSize:T.f13,color:'rgba(255,255,255,0.6)',fontFamily:'monospace'}}>Code snippet</span>
                  <div style={{display:'flex',gap:8,alignItems:'center'}}>
                    <button
                      onClick={()=>{navigator.clipboard?.writeText(code).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),1500);}}
                      style={{background:copied?T.green:'rgba(255,255,255,0.12)',color:T.white,border:'none',borderRadius:T.r,padding:'4px 12px',fontSize:f(11),fontFamily:font,cursor:'pointer',transition:'background 0.2s'}}>
                      {copied?'Copied!':'Copy'}
                    </button>
                    <button
                      onClick={()=>setOpen(false)}
                      style={{background:'rgba(255,255,255,0.08)',color:'rgba(255,255,255,0.7)',border:'none',borderRadius:T.r,width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',fontSize:T.fBody}}>
                      ✕
                    </button>
                  </div>
                </div>
                {/* Code body */}
                <div style={{overflowY:'auto', padding:`${f(14)}px ${f(16)}px`, fontSize:f(12), fontFamily:'monospace', lineHeight:1.65, whiteSpace:'pre'}}>
                  {lines.map((line,i) => highlightLine(line,i))}
                </div>
              </div>
            </div>
          )}
        </>
      );
    };

    // ── PREVIEW & HELPER COMPONENTS ──
    const Preview = ({children, plain=false}) => {
      const { mob } = useContext(MobCtx);
      return <div style={{background:plain?'transparent':T.paper,border:plain?'none':`1px solid ${T.g200}`,borderRadius:T.rLg,padding:mob?14:24,marginBottom:mob?12:20,overflowX:'auto'}}>{children}</div>;
    };
    const CLbl = ({children}) => <div style={{fontSize:T.fBody,fontWeight:600,color:T.black,fontFamily:font,marginTop:28,marginBottom:10}}>{children}</div>;
    const Lead = ({children}) => {

    const SH1 = ({id,children}) => {

    };
    const ShowRow = ({label,children,dark=true}) => (

        {label&&<div style={{fontSize:f(11),textTransform:'uppercase',letterSpacing:'0.06em',color:T.g500,fontFamily:font,fontWeight:600,marginBottom:f(12)}}>{label}</div>}

    // ── NEW SECTION COMPONENTS ──

    // Spacers & Dividers Section
    const SpacersSection = () => {

        <div style={{fontFamily:font,fontSize:T.fXs,fontWeight:600,color:T.g500,
          textTransform:'uppercase',letterSpacing:'0.08em',marginBottom:'0.5rem'}}>{children}</div>
      );
      const spacers = [
        { label:'S', token:'spacer-s', height:'1.5rem',  px:'24px'  },
        { label:'M', token:'spacer-m', height:'3rem',    px:'48px'  },

      const dividers = [

      const CodeChip = ({children}) => (
        <code style={{fontFamily:'monospace',fontSize:T.fXxs,fontWeight:700,color:T.teal,
          background:'rgba(1,82,83,0.08)',padding:'2px 7px',borderRadius:T.rSm}}>{children}</code>
      );
      return (
        <div style={{display:'flex',flexDirection:'column',gap:'3rem'}}>

          {/* ── Empty Spacers ── */}
          <div>
            <SizeLabel>Empty Spacers — vertical breathing room between sections</SizeLabel>
            <div style={{background:T.white,border:`1px solid ${T.g200}`,borderRadius:T.rLg,overflow:'hidden'}}>

                ))}
              </div>
              {spacers.map((s,i)=>(
                <div key={s.label} style={{display:'grid',gridTemplateColumns:'4rem 5rem 5rem 1fr',

                  <CodeChip>{s.label}</CodeChip>
                  <span style={{fontFamily:'monospace',fontSize:T.f13,color:T.g700}}>{s.px}</span>

                  <div style={{position:'relative',background:T.paper,borderRadius:T.rSm,

            <CodeBlock inline lang="HTML" code={`<!-- HTML — add a named class to any block element -->
<div class="spacer-s"></div>   <!-- 24px -->

<div class="spacer-l"></div>   <!-- 96px -->`}/>

<hr class="divider-s">   <!-- 1rem top & bottom margin -->
<hr class="divider-m">   <!-- 2rem top & bottom margin -->
<hr class="divider-l">   <!-- 4rem top & bottom margin -->`}/>

.divider-m { border: none; border-top: 0.0625rem solid var(--color-graphite-200, #E6E6E8); margin: 2rem 0; }

    // Spacing Section — exact variable values
    const SpacingSection = () => {

          </div>

    // Shadow Section

`/* Wrapper — must be position:relative */
.tooltip-wrapper { position: relative; display: inline-flex; }

/* Bubble */
.tooltip {

.tooltip-top    { bottom: calc(100% + 0.5rem); left: 50%; transform: translateX(-50%) translateY(4px); }

          <BH>CSS-Definitionen</BH>
          <CodeBlock inline lang="CSS" code={
`/* Overlay */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0, 0, 0, 0.45);
  display: flex; align-items: center; justify-content: center;
  padding: 1rem;
}

/* Dialog base */
.modal-dialog {
  width: 100%; max-width: 37.5rem; /* 600px — MD default */
  background: var(--color-white);
  border-radius: var(--radius-lg);
  box-shadow: 0 1.25rem 3.75rem rgba(0,0,0,0.2), 0 0.25rem 1rem rgba(0,0,0,0.1);
  display: flex; flex-direction: column;
  max-height: 90vh; overflow: hidden;
  position: relative;
}

/* Size modifiers */
.modal-dialog.modal-xl { max-width: 68.75rem; } /* 1100px — Product detail */
.modal-dialog.modal-lg { max-width: 60rem;    } /* 960px  — Rich content, split, review */
.modal-dialog.modal-sm { max-width: 25rem;    } /* 400px  — Login, small forms */

/* Header — always title left, X right */
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 0.0625rem solid var(--color-graphite-200);
  flex-shrink: 0;
}
.modal-title {
  font-family: var(--font-family);
  font-size: 1.3rem; font-weight: 700; line-height: 1.3; letter-spacing: -0.015em; color: var(--color-digital-black);
}
@media (max-width: 48rem) {
  .modal-title { font-size: 1.1rem; }
}

/* Close button — same style in all modals */
.modal-close {
  display: flex; align-items: center; justify-content: center;
  width: 2rem; height: 2rem;
  border: none; border-radius: var(--radius);
  background: transparent; cursor: pointer; color: var(--color-graphite-700);
  transition: background 0.15s; flex-shrink: 0;
}
.modal-close:hover { background: var(--color-graphite-100); }

/* Overlay close (no-header variants: photo/review) */
.modal-close--overlay {
  position: absolute; top: 1rem; right: 1rem; z-index: 2;
  background: var(--color-white);
  box-shadow: 0 0.125rem 0.5rem rgba(0,0,0,0.15);
  border-radius: 50%;
}
.modal-close--overlay:hover { background: var(--color-graphite-100); }

/* Body */
.modal-body {
  padding: 1.5rem; overflow-y: auto; flex-grow: 1;
  font-family: var(--font-family);
  font-size: 1rem; color: var(--color-graphite-700); line-height: 1.6;
}

/* XL: 2-column product layout */
.modal-xl .modal-body--product {
  display: flex; padding: 0; overflow: hidden;
}
.modal-xl .modal-body--product .modal-media {
  flex: 0 0 45%; background: var(--color-graphite-100);
}
.modal-xl .modal-body--product .modal-info {
  flex: 1; padding: 2rem; overflow-y: auto;
}

/* LG photo/review: no-header, full-height left image */
.modal-lg .modal-body--review {
  display: flex; padding: 0; overflow: hidden; flex-grow: 1;
}
.modal-lg .modal-body--review .modal-photo {
  flex: 0 0 50%; object-fit: cover;
}
.modal-lg .modal-body--review .modal-review-content {
  flex: 1; padding: 2rem; overflow-y: auto;
}

/* LG split panel */
.modal-lg .modal-body--split {
  display: flex; padding: 0; flex-grow: 1;
}
.modal-body--split .modal-panel-left {
  flex: 0 0 40%; background: var(--color-teal);
  padding: 2rem; display: flex; flex-direction: column; gap: 1.5rem;
}
.modal-body--split .modal-panel-right {
  flex: 1; padding: 1.5rem; overflow-y: auto;
}`}/>

      const [hov, setHov] = useState(false);
      return (
        <div

          onMouseEnter={()=>setHov(true)}
          onMouseLeave={()=>setHov(false)}
          style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,padding:'28px 12px 20px',
            border: hov ? `1px solid ${T.teal}` : `1px solid ${T.g200}`,
            borderRadius:10,background:T.white,cursor:'pointer',
            boxShadow: hov ? '0 2px 12px rgba(1,82,83,0.10)' : 'none',
            transition:'border-color 0.15s,box-shadow 0.15s'}}

          <div style={{width:38,height:38,display:'flex',alignItems:'center',justifyContent:'center'}}>

            {ic.label}

    };

      const [detail, setDetail] = useState(null);

      const [previewColor, setPreviewColor] = useState(T.dBlack);
      const [previewSize, setPreviewSize] = useState(80);
      const [copied, setCopied] = useState(false);
      const font = "'Helvetica Neue',Helvetica,Arial,sans-serif";

      const handleCopy = () => {
        const code = getSvgString(detail.key);
        navigator.clipboard?.writeText(code).catch(()=>{});
        setCopied(true);
        setTimeout(()=>setCopied(false),1500);
      };

      const handleDownload = () => {
        const code = getSvgString(detail.key);
        const blob = new Blob([code], {type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${detail.key}.svg`; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
      };

      // Filtered icons list
      const q = query.toLowerCase();
      const filtered = icons.filter(ic =>
        !q || ic.label.toLowerCase().includes(q) || ic.tags.some(t => t.includes(q)) || ic.category.toLowerCase().includes(q)
      );

      // Categories in display order

`.alert {

  border-left-width: 0.25rem;

}

  border-color: var(--color-teal);
  color: #012F30;
}

/* Heading inside alert */
.alert-heading {
  font-size: 1rem;
  font-weight: 700;
  margin: 0 0 0.5rem;
}

/* Link inside alert */
.alert-link {
  font-weight: 600;
  text-decoration: underline;
}
.alert-success .alert-link { color: #15803D; }
.alert-danger  .alert-link { color: #B52320; }
.alert-warning .alert-link { color: #D97706; }
.alert-info    .alert-link { color: var(--color-teal-600); }

/* Divider inside alert */
.alert-divider {
  border: none;
  border-top: 0.0625rem solid currentColor;
  opacity: 0.25;
  margin: 0.625rem 0;
}

/* Dismissible */
.alert-dismissible { padding-right: 2.5rem; }
.alert-close {

  top: 0.75rem;
  right: 0.75rem;

  cursor: pointer;
  opacity: 0.6;
  font-size: 1.125rem;
  line-height: 1;

}
.alert-close:hover { opacity: 1; }`}/>

      React.useLayoutEffect(() => {
        if (!containerRef.current || !measureRef.current) return;
        const compute = () => {
          const navW = containerRef.current.clientWidth - 48;
          const items = Array.from(measureRef.current.children);
          const moreReserve = 90;
          const minGap = 16;
          let widths = items.map(el => el.offsetWidth);
          let n = items.length;
          while (n > 0) {
            const sum = widths.slice(0, n).reduce((a,b) => a+b, 0);
            const willNeedMore = n < items.length;
            const need = sum + minGap * Math.max(0, n - 1) + (willNeedMore ? minGap + moreReserve : 0);
            if (need <= navW) break;
            n--;
          }
          setVisibleCount(n || 1);
        };
        compute();
        const ro = new ResizeObserver(compute);
        ro.observe(containerRef.current);
        return () => ro.disconnect();

      const [open, setOpen] = React.useState(false);
      const [status, setStatus] = React.useState({}); // { [filename]: 'downloading' | 'done' }
      const rootRef = React.useRef(null);

      React.useEffect(() => {
        if (!open) return;
        const onDocClick = (e) => { if (rootRef.current && !rootRef.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', onDocClick);
        return () => document.removeEventListener('mousedown', onDocClick);
      }, [open]);

      const downloadFile = (filename) => {
        setStatus(s => ({...s, [filename]: 'downloading'}));
        fetch(`https://raw.githubusercontent.com/metzler-de/metzler-ui-kit/main/${filename}`)
          .then(r => r.blob())
          .then(blob => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            setStatus(s => ({...s, [filename]: 'done'}));
            setTimeout(() => setStatus(s => ({...s, [filename]: undefined})), 2200);
          })
          .catch(() => setStatus(s => ({...s, [filename]: undefined})));
      };

      const downloadAll = () => {
        KIT_FILES.forEach((f, i) => setTimeout(() => downloadFile(f.name), i * 350));

                  <div style={{position:'absolute',top:'calc(100% + 6px)',left:40,right:40,

                      <div key={n.id}

                    transform:'translate(-50%,-50%)',zIndex:3001,
                    background:T.white,borderRadius:T.rLg,width:'min(36rem,90vw)',

                      <button onClick={()=>setWhatsNew(false)}

    // ── LEFT SIDEBAR — fixed desktop sidebar / mobile drawer ──
    const SiteNav = ({activeId, onNavClick, mob, drawerOpen, onClose, onOpenIcons, onOpenSections, onOpenBrandbook}) => {
      if (mob && !drawerOpen) return null;
      const [searchQ, setSearchQ] = useState('');
      const [drawerWN, setDrawerWN] = useState(false);
      const typeStyle = {
        new:      { bg:'#F0FDF4', color:'#15803D', label:'New' },
        improved: { bg:'#EFF6FF', color:'#1D4ED8', label:'Improved' },
        fix:      { bg:'#FFF7ED', color:'#C2410C', label:'Fix' },
        removed:  { bg:T.red50,   color:T.red600,   label:'Removed' },
      };
      const searchResults = searchQ.trim().length > 0
        ? allNavItems.filter(n => n.label.toLowerCase().includes(searchQ.toLowerCase().trim())).slice(0,6)
        : [];
      const navList = (
        <div style={{padding:'12px 0 40px'}}>
          {navItems.map(item=>{
            const childIds = (item.children||[]).map(c=>c.id);
            const parentActive = activeId===item.id || childIds.includes(activeId);
            return (
              <div key={item.label}>
                {item.type==='group'
                  ? <div style={{fontSize:'0.6875rem',fontWeight:700,color:T.teal,textTransform:'uppercase',

                        onMouseEnter={e=>{if(!parentActive)e.currentTarget.querySelector('div').style.background='rgba(1,82,83,0.05)';}}
                        onMouseLeave={e=>{if(!parentActive)e.currentTarget.querySelector('div').style.background='transparent';}}

                        <div style={{padding:'6px 12px',borderRadius:6,
                          background: parentActive ? T.teal : 'transparent',
                          color: parentActive ? T.white : T.g700,
                          fontFamily:font, fontSize:T.fSm,
                          fontWeight: parentActive ? 600 : 400,
                          transition:'background 0.12s, color 0.12s'}}>{item.label}</div>
                      </button>
                      {parentActive && item.children && item.children.map(child=>(
                        <button key={child.id}
                          onClick={()=>{onNavClick(child.id);if(mob)onClose();}}
                          onMouseEnter={e=>{if(activeId!==child.id)e.currentTarget.querySelector('div').style.background='rgba(1,82,83,0.05)';}}
                          onMouseLeave={e=>{if(activeId!==child.id)e.currentTarget.querySelector('div').style.background='transparent';}}

                          <div style={{padding:'5px 12px',borderRadius:5,
                            background: activeId===child.id ? T.teal : 'transparent',
                            color: activeId===child.id ? T.white : T.g600,
                            fontFamily:font, fontSize:T.f13,
                            fontWeight: activeId===child.id ? 600 : 400,
                            transition:'background 0.12s, color 0.12s'}}>{child.label}</div>

                    <div key={n.id}
                      onClick={()=>{onNavClick(n.id);setSearchQ('');onClose();}}
                      style={{padding:'9px 14px',fontSize:T.fSm,fontFamily:font,color:T.black,

                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke={T.g500} strokeWidth="1.6" strokeLinecap="round"

      <div style={{display:'flex',gap:'1.25rem',marginBottom:'1.5rem'}}>
        <div style={{flexShrink:0,width:'2rem',height:'2rem',borderRadius:'50%',background:T.teal,
          color:T.white,fontFamily:font,fontWeight:700,fontSize:T.fSm,
          display:'flex',alignItems:'center',justifyContent:'center',marginTop:'0.125rem'}}>{num}</div>
        <div>
          <div style={{fontSize:T.fBody,fontWeight:700,color:T.black,fontFamily:font,marginBottom:'0.375rem'}}>{title}</div>

                        style={{width:28,height:28,borderRadius:'50%',background:c,padding:0,cursor:'pointer',
                          border: c===T.white ? `1.5px solid ${T.g450}` : 'none',
                          outline: previewColor===c ? `2.5px solid ${T.teal}` : '2.5px solid transparent',
                          outlineOffset:2,transition:'outline-color 0.15s'}}/>
                    ))}
                  </div>
                </div>

                {/* Size slider */}
                <div style={{marginBottom:28}}>
                  <div style={{fontSize:T.fXxs,color:T.g500,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',fontFamily:ff,marginBottom:10}}>
                    Size — <span style={{color:T.teal}}>{previewSize}px</span>
                  </div>
                  <input type="range" min={24} max={200} value={previewSize}
                    onChange={e=>setPreviewSize(Number(e.target.value))}

                </div>

                {/* Download */}
                <div style={{marginBottom:12}}>
                  <div style={{fontSize:T.fXxs,color:T.g500,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',fontFamily:ff,marginBottom:8}}>Download</div>
                  <p style={{fontSize:T.f13,color:T.g600,fontFamily:ff,margin:'0 0 12px 0'}}>Download the SVG to use or edit.</p>
                  <button onClick={handleDownload}
                    onMouseEnter={e=>e.currentTarget.style.background=T.teal600}
                    onMouseLeave={e=>e.currentTarget.style.background=T.teal}
                    onMouseDown={e=>e.currentTarget.style.background=T.teal700}
                    onMouseUp={e=>e.currentTarget.style.background=T.teal600}
                    style={{width:'100%',height:42,borderRadius:T.r,border:'none',cursor:'pointer',
                      fontFamily:ff,fontSize:T.fSm,fontWeight:600,
                      background:T.teal,color:T.white,
                      transition:'background 0.15s ease'}}>
                    Download SVG
                  </button>
                </div>

                {/* Copy SVG */}
                <div style={{marginBottom:20}}>
                  <button onClick={handleCopySvg}

                    onMouseLeave={e=>{ if(!copied){ e.currentTarget.style.background='transparent'; e.currentTarget.style.color=T.teal; } }}
                    onMouseDown={e=>{ if(!copied){ e.currentTarget.style.background=T.teal; e.currentTarget.style.color=T.white; } }}
                    onMouseUp={e=>{ if(!copied){ e.currentTarget.style.background=T.teal100; e.currentTarget.style.color=T.teal; } }}
                    style={{width:'100%',height:42,borderRadius:T.r,cursor:'pointer',
                      fontFamily:ff,fontSize:T.fSm,fontWeight:600,
                      background: copied?T.teal:'transparent',
                      color: copied?T.white:T.teal,
                      border:`1.5px solid ${T.teal}`,
                      transition:'background 0.15s ease, color 0.15s ease'}}>
                    {copied?'✓ Copied!':'Copy SVG'}
                  </button>
                </div>

                {/* Copy HTML */}
                <div style={{marginBottom:24}}>
                  <div style={{fontSize:T.fXxs,color:T.g500,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',fontFamily:ff,marginBottom:8}}>Copy HTML</div>
                  <p style={{fontSize:T.f13,color:T.g600,fontFamily:ff,margin:'0 0 10px 0'}}>Paste the SVG right into your project's code.</p>
                  <div style={{background:'#1E1F2E',borderRadius:T.rLg,padding:'14px 16px',position:'relative',overflow:'hidden'}}>
                    <button onClick={()=>handleCopyHtml(svgCode)}
                      style={{position:'absolute',top:10,right:10,background:'none',border:'none',cursor:'pointer',padding:4,
                        color: htmlCopied?'#4ADE80':'rgba(255,255,255,0.45)',transition:'color 0.2s',lineHeight:1,display:'flex',alignItems:'center',justifyContent:'center'}}>
                      {htmlCopied
                        ? <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M20 6L9 17l-5-5" stroke="#4ADE80" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                        : <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><rect x="9" y="9" width="13" height="13" rx="2" stroke="rgba(255,255,255,0.45)" strokeWidth="1.8"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1" stroke="rgba(255,255,255,0.45)" strokeWidth="1.8" strokeLinecap="round"/></svg>
                      }
                    </button>
                    <code style={{fontFamily:"'Fira Code','Cascadia Code','Consolas',monospace",fontSize:T.fXs,lineHeight:1.7,display:'block',paddingRight:24,wordBreak:'break-word',whiteSpace:'pre-wrap'}}>
                      {(()=>{
                        // Simple SVG syntax highlighter
                        const orange = (t) => `<span style="color:#F97B6B">${t}</span>`;
                        const purple = (t) => `<span style="color:#BD93F9">${t}</span>`;
                        const green  = (t) => `<span style="color:#A8D8A8">${t}</span>`;
                        const white  = (t) => `<span style="color:#F8F8F2">${t}</span>`;
                        const dim    = (t) => `<span style="color:rgba(248,248,242,0.5)">${t}</span>`;
                        const highlighted = svgCode
                          .replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                          .replace(/(&lt;\/?)([\w]+)/g, (_,bracket,tag) => dim(bracket)+orange(tag))
                          .replace(/([\w-]+)(=)(&quot;)/g, (_,attr,eq,q) => purple(attr)+white(eq)+green(q))
                          .replace(/(&quot;)([^&]*)(&quot;)/g, (_,q1,val,q2) => green(q1+val+q2))
                          .replace(/(&gt;&lt;)/g, dim('&gt;&lt;'))
                          .replace(/(&gt;)(?!&lt;)/g, dim('&gt;'));
                        return <span dangerouslySetInnerHTML={{__html: highlighted}}/>;
                      })()}
                    </code>
                  </div>
                </div>

                {/* Tags */}
                {iconData.tags && iconData.tags.length > 0 && (
                  <div>
                    <div style={{fontSize:T.fXxs,color:T.g500,fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',fontFamily:ff,marginBottom:8}}>Tags</div>

                  </div>

              </div>
            </div>
          </div>
        );

      // ─── GRID PAGE ───
      return (
        <div style={{fontFamily:ff,minHeight:'calc(100vh - 57px)',background:T.white}}>
          {/* Back bar — same style as Sections page */}
          <div style={{background:T.white,borderBottom:`0.0625rem solid ${T.g200}`,
            padding:'0.75rem 3rem',display:'flex',alignItems:'center',gap:12}}>
            <button onClick={onBackToMain}
              style={{display:'inline-flex',alignItems:'center',gap:6,

                fontSize:T.f13,color:T.teal,fontFamily:ff,fontWeight:600,padding:0}}
              onMouseEnter={e=>e.currentTarget.style.opacity='0.7'}
              onMouseLeave={e=>e.currentTarget.style.opacity='1'}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
              Back to Design System
            </button>
            <span style={{color:T.g200,fontFamily:ff}}>|</span>
            <span style={{fontSize:T.f13,fontWeight:700,color:T.black,fontFamily:ff}}>Icons</span>
          </div>

          {/* Page header */}
          <div style={{background:T.white,borderBottom:`1px solid ${T.g200}`,padding:'20px 40px 18px'}}>
            <div style={{maxWidth:1440,margin:'0 auto',display:'flex',alignItems:'center',gap:24,flexWrap:'wrap'}}>
              <div style={{flex:1}}>
                <h1 style={{fontFamily:ff,fontSize:28,fontWeight:700,color:T.dBlack,margin:0}}>Icons</h1>
              </div>
              {/* Search */}
              <div style={{position:'relative',width:280}}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
                  style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
                  <circle cx="11" cy="11" r="7" stroke={T.g500} strokeWidth="1.8"/>
                  <path d="M16.5 16.5l4 4" stroke={T.g500} strokeWidth="1.8" strokeLinecap="round"/>
                </svg>
                <input type="text" placeholder="Start typing to filter…"
                  value={query} onChange={e=>setQuery(e.target.value)}
                  style={{width:'100%',boxSizing:'border-box',height:38,paddingLeft:34,paddingRight:12,
                    border:`1px solid ${T.g300}`,borderRadius:6,fontFamily:ff,fontSize:T.f13,color:T.dBlack,outline:'none'}}/>
                {query && (
                  <button onClick={()=>setQuery('')}
                    style={{position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',
                      background:'none',border:'none',cursor:'pointer',color:T.g500,fontSize:T.fSm,padding:2}}>
                    ✕
                  </button>
                )}
              </div>
            </div>
          </div>

          {/* Icons grid */}
          <div style={{maxWidth:1440,margin:'0 auto',padding:'24px 40px 60px'}}>
            <p style={{fontFamily:ff,fontSize:T.f13,color:T.g500,margin:'0 0 20px 0'}}>
              {filtered.length} icons{q ? ` matching "${q}"` : ''}

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(140px,1fr))',gap:16}}>
              {filtered.map(ic=>(
                <IconTile key={ic.key} ic={ic} onSelect={onOpenDetail} font={ff}/>

            </div>
            {filtered.length === 0 && (
              <div style={{textAlign:'center',padding:'60px 0',color:T.g500,fontFamily:ff,fontSize:T.fSm}}>
                No icons found for "{query}"
              </div>
            )}
          </div>
        </div>
      );
    };

    // ── MAIN DESIGN SYSTEM COMPONENT ──
    const DesignSystem = () => {
      const [activeId,   setActiveId]   = useState(() => {
        try { return localStorage.getItem('mz-ds-active') || 'introduction'; } catch(e) { return 'introduction'; }
      });
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [isMobile,   setIsMobile]   = useState(() => window.innerWidth < 769);
      const [page, setPage] = useState(() => { // 'main' | 'icons' | 'sections' | 'brandbook'
        try { const p = localStorage.getItem('mz-ds-page'); return ['main','icons','sections','brandbook'].includes(p) ? p : 'main'; } catch(e) { return 'main'; }
      });
      const [iconDetailKey, setIconDetailKey] = useState(null);
      const contentRef = useRef(null);

      useEffect(() => {
        const onResize = () => setIsMobile(window.innerWidth < 769);
        window.addEventListener('resize', onResize);
        return () => window.removeEventListener('resize', onResize);
      }, []);

      // Close drawer when going back to desktop
      useEffect(() => { if (!isMobile) setDrawerOpen(false); }, [isMobile]);

      useEffect(() => {
        const observer = new IntersectionObserver(
          entries => {
            entries.forEach(entry => {
              if (entry.isIntersecting) setActiveId(entry.target.id);
            });
          },
          { threshold: 0.1 }
        );
        allNavItems.forEach(item => {
          const el = document.getElementById(item.id);
          if (el) observer.observe(el);
        });
        return () => observer.disconnect();
      }, []);

      // Persist current page + section so a reload reopens at the same place.
      useEffect(() => { try { localStorage.setItem('mz-ds-page', page); } catch(e){} }, [page]);
      useEffect(() => { try { localStorage.setItem('mz-ds-active', activeId); } catch(e){} }, [activeId]);

      // On first mount, restore scroll to the last-viewed section (own restore, not the browser's).
      useEffect(() => {
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
        if (page !== 'main') return;
        let id; try { id = localStorage.getItem('mz-ds-active'); } catch(e){}
        if (id && id !== 'introduction') {
          requestAnimationFrame(() => document.getElementById(id)?.scrollIntoView({behavior:'instant', block:'start'}));
        }
      }, []);

      const navClick = (id) => {
        document.getElementById(id)?.scrollIntoView({behavior:'instant'});
        setActiveId(id);
      };

      const mob = isMobile;
      const ctxVal = { mob, openDrawer: () => setDrawerOpen(true) };

      return (
        <MobCtx.Provider value={ctxVal}>
        <div style={{background:T.white,minHeight:'100vh'}}>
          <TopNav onNavClick={navClick} onMenuClick={()=>setDrawerOpen(true)} mob={mob}
            onOpenIcons={()=>{setPage('icons');setIconDetailKey(null);}}
            onOpenSections={()=>setPage('sections')}
            onOpenBrandbook={()=>setPage('brandbook')}
            onGoHome={()=>setPage('main')}
            iconsActive={page!=='main'} />

          {/* Sidebar — desktop fixed / mobile drawer, only on main page */}
          {page==='main' && <SiteNav activeId={activeId} onNavClick={navClick}
            mob={mob} drawerOpen={drawerOpen} onClose={()=>setDrawerOpen(false)}
            onOpenIcons={()=>{setPage('icons');setIconDetailKey(null);}}
            onOpenSections={()=>setPage('sections')}
            onOpenBrandbook={()=>setPage('brandbook')} />}

          {/* Icons standalone page */}
          {(page==='icons'||page==='icon-detail') && (
            <div style={{paddingTop:57,minHeight:'100vh',background:T.paper}}>
              <IconsPage
                iconDetailKey={page==='icon-detail' ? iconDetailKey : null}
                onOpenDetail={key=>{setIconDetailKey(key);setPage('icon-detail');}}
                onBackToGrid={()=>setPage('icons')}
                onBackToMain={()=>{setPage('main');setIconDetailKey(null);}}
              />
            </div>
          )}

          {/* Sections standalone page */}
          {page==='sections' && (
            <SectionsPage onBackToMain={()=>setPage('main')}/>
          )}

          {/* Brandbook standalone page */}
          {page==='brandbook' && (
            <BrandbookPage onBackToMain={()=>setPage('main')}/>
          )}

          {/* Content — offset right of sidebar on desktop, full-width on mobile */}
          {page==='main' && <div style={{
            marginLeft: mob ? 0 : 'calc(260px + max(0px, (100vw - 1900px) / 2))',
            paddingTop:57, minHeight:'100vh',
            maxWidth: mob ? '100%' : 1640,
          }}>
            <main style={{minWidth:0}}>
            <div style={{padding: mob ? '24px 16px 60px' : '40px 48px 80px'}}>
              <div style={{marginBottom:mob?20:32}}>
                <div style={{fontSize:mob?28:42,fontWeight:700,color:T.black,fontFamily:font,marginBottom:8,lineHeight:1.1}}>Metzler Design System</div>
                <div style={{fontSize:mob?11:16,color:T.g600,fontFamily:font,lineHeight:1.6}}>Complete component and token documentation for Metzler products. </div>
              </div>


            {/* INTRODUCTION */}
            <SH1 id="introduction">Introduction</SH1>
            <IntroductionSection />

            {/* FAVICON */}
            <SH1 id="favicon">Favicon</SH1>
            <Lead>Das Metzler-Markenzeichen (rotes M-Quadrat) als SVG-Favicon. <strong>Pflicht auf jeder Metzler-Seite</strong> — identisch im &lt;head&gt; einbinden, damit alle Seiten dieselbe Tab-Ikone tragen. SVG skaliert verlustfrei für Retina-Tabs, Lesezeichen und PWA-Kacheln.</Lead>
            <Preview>
              <div style={{display:'flex',gap:'2.5rem',alignItems:'flex-end',flexWrap:'wrap'}}>
                {[16,32,64].map(s=>(
                  <div key={s} style={{textAlign:'center'}}>
                    <svg viewBox="0 0 184.3 184.3" style={{width:s,height:s,display:'block',margin:'0 auto 0.5rem'}} xmlns="http://www.w3.org/2000/svg">
                      <rect width="184.3" height="184.3" rx="5.75" fill="#cc322b"/>
                      <path fill="#fff" d="M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z"/>
                    </svg>
                    <span style={{fontFamily:font,fontSize:T.fXxs,color:T.g500}}>{s}×{s}</span>
                  </div>
                ))}
                <div style={{display:'flex',alignItems:'center',gap:'0.5rem',background:T.white,border:`1px solid ${T.g200}`,borderBottom:'none',borderRadius:'0.5rem 0.5rem 0 0',padding:'0.5rem 0.875rem',alignSelf:'flex-end',boxShadow:'0 -1px 4px rgba(0,0,0,0.04)'}}>
                  <svg viewBox="0 0 184.3 184.3" style={{width:16,height:16,display:'block',flexShrink:0}} xmlns="http://www.w3.org/2000/svg">
                    <rect width="184.3" height="184.3" rx="5.75" fill="#cc322b"/>
                    <path fill="#fff" d="M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z"/>
                  </svg>
                  <span style={{fontFamily:font,fontSize:T.fSm,color:T.g700}}>Metzler Design System</span>
                </div>
              </div>
            </Preview>
            <CodeBlock inline lang="HTML" code={`<!-- Pflicht im <head> jeder Metzler-Seite (Datei-Variante) -->
<link rel="icon" type="image/svg+xml" href="favicon.svg">`}/>
            <p style={{fontSize:T.fSm,color:T.g600,fontFamily:font,margin:'0.5rem 0 0.75rem',lineHeight:1.6}}>Self-contained Variante — inline Data-URI, kein externes Asset nötig (empfohlen für Einzeldatei-Seiten):</p>
            <CodeBlock inline lang="HTML" code={`<link rel="icon" type="image/svg+xml"
  href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 184.3 184.3'%3E%3Crect width='184.3' height='184.3' rx='5.75' fill='%23cc322b'/%3E%3Cpath fill='%23fff' d='M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z'/%3E%3C/svg%3E">`}/>

            {/* COLORS */}
            <SH1 id="colors">Colors</SH1>
            <Lead>Full Metzler palette — web, print, and brand. All colors follow the Extended Color System from the Metzler brand guidelines.</Lead>

            {/* Grouped color tables */}
            <ColorPalette />

            {/* TYPOGRAPHY */}
            <SH1 id="typography">Typography</SH1>
            <Lead>Font family resolves per OS — <strong>Helvetica Neue</strong> on macOS/Ubuntu, <strong>Arial</strong> on Windows. Weights, sizes, and line-heights are identical across both; only the typeface differs. Windows stack: <code style={{fontFamily:'monospace',fontSize:T.f13,background:T.paper,padding:'1px 5px',borderRadius:3}}>Arial, "Helvetica Neue", Helvetica, sans-serif</code> — Arial is first by default. Sizes in <code style={{fontFamily:'monospace',fontSize:T.f13,background:T.paper,padding:'1px 5px',borderRadius:3}}>rem</code> — base 16px = 1rem.</Lead>

            {/* OS font detection banner */}
            {(()=>{
              const ua = typeof navigator !== 'undefined' ? navigator.userAgent : '';
              const isMac    = /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua);
              const isWin    = /Win/.test(ua);
              const isLinux  = /Linux/.test(ua) && !/Android/.test(ua);
              const isHelvetica = isMac || isLinux; // both use Helvetica Neue stack
              const activeFont    = isHelvetica ? 'Helvetica Neue' : isWin ? 'Arial' : 'Helvetica Neue / Arial';
              const activeFontCSS = isHelvetica
                ? '"Helvetica Neue", Helvetica, Arial, sans-serif'
                : isWin
                  ? 'Arial, "Helvetica Neue", Helvetica, sans-serif'
                  : '"Helvetica Neue", Helvetica, Arial, sans-serif';
              const osLabel  = isMac ? 'macOS' : isWin ? 'Windows' : isLinux ? 'Ubuntu / Linux' : 'Other';
              const dotColor = isHelvetica ? T.green : isWin ? '#3B9ADB' : T.star;
              return (
                <div style={{
                  display:'flex', alignItems:'center', gap:'1.25rem',
                  background:T.paper, border:`1px solid ${T.g200}`,
                  borderRadius:T.rLg, padding:'0.875rem 1.25rem',
                  marginBottom:'1.5rem', flexWrap:'wrap',
                }}>
                  {/* OS pill */}
                  <div style={{display:'flex',alignItems:'center',gap:'0.5rem',flexShrink:0}}>
                    <div style={{width:'0.5rem',height:'0.5rem',borderRadius:'50%',background:dotColor,flexShrink:0}}/>
                    <span style={{fontFamily:font,fontSize:T.f13,fontWeight:600,color:T.g850}}>{osLabel} detected</span>
                  </div>
                  {/* Divider */}
                  <div style={{width:'1px',height:'1.25rem',background:T.g300,flexShrink:0}}/>
                  {/* Active font */}
                  <div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
                    <span style={{fontFamily:font,fontSize:T.f13,color:T.g600}}>Active typeface:</span>
                    <span style={{fontFamily:font,fontSize:T.fSm,fontWeight:700,color:T.teal}}>{activeFont}</span>
                  </div>
                  {/* Divider */}
                  <div style={{width:'1px',height:'1.25rem',background:T.g300,flexShrink:0}}/>
                  {/* Font stack */}
                  <code style={{fontFamily:'monospace',fontSize:T.fXs,color:T.g700,background:'rgba(0,0,0,0.04)',padding:'0.2rem 0.5rem',borderRadius:T.r}}>{activeFontCSS}</code>
                  {/* Rule note */}
                  <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:'0.375rem',flexShrink:0}}>
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke={T.g500} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    <span style={{fontFamily:font,fontSize:T.fXs,color:T.g500}}>macOS · Ubuntu → Helvetica Neue · Windows → Arial · same scale</span>
                  </div>
                </div>
              );
            })()}

            {/* Typeface showcase banner */}
            <div style={{
              background:`linear-gradient(135deg, #014647 0%, ${T.teal} 50%, #016B6C 100%)`,
              borderRadius:16, marginBottom:32, overflow:'hidden', position:'relative',
            }}>
              {/* Subtle dot grid */}
              <div style={{position:'absolute',inset:0,opacity:0.07,backgroundImage:`radial-gradient(circle, ${T.white} 1px, transparent 1px)`,backgroundSize:'32px 32px'}}/>
              {/* Glow accent */}

            <CodeBlock inline lang="CSS" code={`.pdp-stepper {
  width: 100%;
}
.pdp-stepper-inner {
  display: flex;
  align-items: stretch;
  background: var(--color-teal);       /* Teal 500 — #015253 */
  border-radius: 0.5rem;
  overflow: hidden;
  height: 3.5rem;
}
.pdp-stepper-step {
  flex: 1 1 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  padding: 0 1.25rem;
  background: transparent;
  border: none;
  color: rgba(255, 255, 255, 0.55);
  font-size: 1rem;
  cursor: pointer;
  transition: color 0.15s, background 0.2s;
  z-index: 1;
}
.pdp-stepper-step.active {
  background: var(--color-teal-dark);  /* Teal 700 — #01292A */
  color: #fff;
  clip-path: polygon(
    0 0,
    calc(100% - 0.75rem) 0,
    100% 50%,
    calc(100% - 0.75rem) 100%,
    0 100%
  );
  padding-right: calc(1.25rem + 0.75rem);
  z-index: 2;
}
.pdp-stepper-step.completed {
  color: rgba(255, 255, 255, 0.85);
}
.pdp-stepper-num  { font-weight: 700; }
.pdp-stepper-label { font-weight: 400; }

/* Hide label on inactive steps — show only the number */
.pdp-stepper-step:not(.active) .pdp-stepper-label {
  display: none;
}

.pdp-stepper-sep {
  display: flex;
  align-items: center;
  flex-shrink: 0;
  color: rgba(255, 255, 255, 0.3);
}
.pdp-stepper-sep svg {
  width: 0.5rem;
  height: 1rem;
}`}/>

            <CodeBlock inline lang="CSS" code={`.psx-dl__item {
  position: relative; overflow: hidden; box-sizing: border-box;
  display: flex; align-items: center; gap: 1.1rem;
  padding: 1.15rem 1.25rem; text-decoration: none;
  background: var(--color-white);
  border: 1px solid var(--color-graphite-300);
  border-radius: var(--radius-xl);       /* 12px */
  transition: border-color .2s ease, box-shadow .25s ease, transform .2s ease;
}
/* soft teal wash fading in from the top-right on hover */
.psx-dl__item::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(130% 140% at 100% 0%, rgba(1,82,83,0.07), transparent 55%);
  opacity: 0; transition: opacity .25s ease;
}

/* PDF badge — document sheet with a folded top-right corner (::before) */
.psx-dl__badge {
  position: relative; flex: none; display: grid; place-items: center;
  width: 2.75rem; height: 3.25rem; border-radius: 0.55rem;
  background: linear-gradient(158deg, #fff 0%, var(--color-teal-50) 100%);
  border: 1px solid var(--color-teal-75);
  color: var(--color-teal);
  font-size: 0.6875rem; font-weight: 800; letter-spacing: 0.05em;   /* --text-caption-xs */
  box-shadow: 0 3px 8px -4px rgba(1,82,83,0.35);
  transition: transform .2s ease;
}
.psx-dl__badge::before {
  content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0;
  border-top: 0.75rem solid var(--color-white);
  border-left: 0.75rem solid transparent;
  border-top-right-radius: 0.55rem;
  filter: drop-shadow(-1px 1px 1px rgba(1,82,83,0.12));
}

.psx-dl__text { display: flex; flex-direction: column; gap: 0.15rem; min-width: 0; flex: 1; }
.psx-dl__text b    { font-size: 1rem; font-weight: 700; line-height: 1.3; color: var(--color-digital-black); }      /* --text-body */
.psx-dl__text span { font-size: 0.8125rem; color: var(--color-graphite-700); }                                     /* --text-label */

/* circular download button */
.psx-dl__icon {
  flex: none; box-sizing: content-box;
  width: 1.1rem; height: 1.1rem; padding: 0.55rem; border-radius: 50%;
  background: var(--color-teal-50); color: var(--color-teal);
  transition: background .2s ease, color .2s ease;
}

/* hover */
.psx-dl__item:hover {
  border-color: var(--color-teal); transform: translateY(-3px);
  box-shadow: 0 20px 34px -20px rgba(1,82,83,0.5), 0 2px 6px -3px rgba(16,24,40,0.08);
}
.psx-dl__item:hover::after         { opacity: 1; }
.psx-dl__item:hover .psx-dl__badge { transform: translateY(-2px) rotate(-3deg); }
.psx-dl__item:hover .psx-dl__icon  { background: var(--color-teal); color: #fff; }

/* keyboard focus + arrow nudge (respects reduced-motion) */
.psx-dl__item:focus-visible { outline: 2px solid var(--color-teal); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .psx-dl__item:hover .psx-dl__icon { animation: dl-nudge .7s ease; }
  @keyframes dl-nudge { 0%,100% { transform: translateY(0); } 45% { transform: translateY(3px); } }
}`}/>

        if (this.state.error) {
          return (
            <div style={{padding:'40px',fontFamily:'monospace',color:'#D42924',background:'#FFF0EF',minHeight:'100vh'}}>
              <h2 style={{marginBottom:'16px'}}>⚠ Render Error (debug mode)</h2>

              <pre style={{whiteSpace:'pre-wrap',fontSize:'12px',color:T.g600,marginTop:'16px'}}>{this.state.error.stack}</pre>
            </div>
          );
        }
        return this.props.children;
      }
