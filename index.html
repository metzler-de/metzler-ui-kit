<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Metzler Design System</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 184.3 184.3'%3E%3Crect width='184.3' height='184.3' rx='5.75' fill='%23cc322b'/%3E%3Cpath fill='%23fff' d='M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    button { -webkit-tap-highlight-color: transparent; }
    button:active { transform: none !important; top: 0 !important; position: relative; }
    body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: #fff; }
    ::-webkit-scrollbar { width: 5px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
    input::placeholder { color: #A1A1A1; }
    a { color: #015253; }
    h1[id] { scroll-margin-top: 72px; }
    @keyframes tslidein { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
    @keyframes drawerIn  { from { transform:translateX(-100%); } to { transform:translateX(0); } }
    @keyframes fadeIn    { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useContext, createContext } = React;
    const MobCtx = createContext({ mob: false, openDrawer: () => {} });

    // ── UTILITIES ──
    const hexToRgb = (hex) => { const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16); return `rgb(${r},${g},${b})`; };
    const rgbaToHex = (rgba) => { const m=rgba.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/); if(!m)return null; const h=n=>parseInt(n).toString(16).padStart(2,"0"); return `#${h(m[1])}${h(m[2])}${h(m[3])}`.toUpperCase(); };
    const getHex = v => v.startsWith("#") ? v.toUpperCase() : rgbaToHex(v);

    const S = 1.2;
    const f = n => Math.round(n * S);
    const font = "'Helvetica Neue', Helvetica, Arial, sans-serif";

    // ── CHANGELOG — update this on every push ──
    const CHANGELOG = {
      version: '1.3',
      date: '2026-05-28',
      entries: [
        {
          type: 'new',
          text: 'Introduction section added — hero banner, overview cards, how-to guide, quick reference table'
        },
        {
          type: 'new',
          text: 'Download .md button in header — fetches and auto-saves metzler-design-system.md from GitHub'
        },
        {
          type: 'new',
          text: 'What\'s New popup — version changelog visible directly in the design system'
        },
        {
          type: 'improved',
          text: 'Nav section group labels — darker color (#54545C), top border divider, more visible hierarchy'
        },
        {
          type: 'improved',
          text: 'Sidebar nav click — instant jump (no smooth scroll animation)'
        },
        {
          type: 'improved',
          text: 'Nav restructured into 6 groups: Foundations / Navigation / Forms / Components / Product / Layout'
        },
        {
          type: 'fix',
          text: 'Form input padding updated to 0.7rem 0.9375rem across all states and size variants'
        },
        {
          type: 'fix',
          text: 'Quick Reference table — removed inaccurate Grid gutter entry; split border-radius into cards (8px) and controls (4px)'
        },
      ]
    };

    // ── NAV ITEMS ──
    const navItems = [
      { type:"item",  label:"Introduction",      id:"introduction" },

      { type:"group", label:"Foundations" },
      { type:"item",  label:"Colors",            id:"colors" },
      { type:"item",  label:"Typography",        id:"typography" },
      { type:"item",  label:"Border Radius",     id:"border-radius" },
      { type:"item",  label:"Breakpoints",       id:"breakpoints" },

      { type:"group", label:"Actions" },
      { type:"item",  label:"Buttons",           id:"buttons-css" },
      { type:"item",  label:"Navigation Arrows", id:"navigation-arrows" },
      { type:"item",  label:"Pagination",        id:"pagination" },
      { type:"item",  label:"Filter Chips",      id:"filter-chips" },

      { type:"group", label:"Forms" },
      { type:"item",  label:"Form Elements",     id:"form-elements", children:[
          { label:"Textfield",    id:"form-textfield" },
          { label:"Checkbox",     id:"form-checkbox" },
          { label:"Radio Button", id:"form-radio" },
          { label:"Switch",       id:"form-switch" },
        ]},
      { type:"item",  label:"Quantity Counter",  id:"qty-counter" },

      { type:"group", label:"Feedback" },
      { type:"item",  label:"Alerts",            id:"alerts" },
      { type:"item",  label:"Tooltip",           id:"tooltip" },
      { type:"item",  label:"Badge",             id:"badge" },

      { type:"group", label:"Content" },
      { type:"item",  label:"Tabs",              id:"tabs" },
      { type:"item",  label:"Lists",             id:"lists" },
      { type:"item",  label:"Table",             id:"table" },
      { type:"item",  label:"Links",             id:"links-comp" },
      { type:"item",  label:"File Download",     id:"file-download" },
      { type:"item",  label:"Modal",             id:"modal" },
      { type:"item",  label:"Breadcrumbs",       id:"breadcrumbs" },

      { type:"group", label:"Product" },
      { type:"item",  label:"Product Cards",     id:"product-cards" },

      { type:"group", label:"Layout" },
      { type:"item",  label:"Header",            id:"header" },
      { type:"item",  label:"Header · Mobile",   id:"header-mobile" },
      { type:"item",  label:"Header · Sticky",   id:"header-sticky" },
      { type:"item",  label:"Footer",            id:"footer" },
      { type:"item",  label:"Footer · Mobile",   id:"footer-mobile" },
    ];
    const allNavItems = navItems.filter(n=>n.type==="item");

    // ── COLOR TOKENS (Metzler Extended Color System) ──
    const colorTokens = [
      // ── TEAL TONES ──
      {value:"#F2F6F6", label:"Teal 50",  subtitle:"Brand-tinted backgrounds",           role:"Subtle brand-tinted backgrounds, selected row highlight, hover row",                                        hex:"#F2F6F6", rgb:"242 · 246 · 246", grp:"Teal Tones"},
      {value:"#E3F2F0", label:"Teal 75",  subtitle:"Light teal · Hover fills",           role:"Button hover fills, active list row, light teal accent surfaces, section backgrounds on landing pages",                                           hex:"#E3F2F0", rgb:"227 · 242 · 240", grp:"Teal Tones"},
      {value:"#E6EEEE", label:"Teal 100", subtitle:"Info surfaces · Selected states",     role:"Info box fills, selected filter chip, tooltip backgrounds",                                                 hex:"#E6EEEE", rgb:"230 · 238 · 238", grp:"Teal Tones"},
      {value:"#015253", label:"Teal 500", subtitle:"The brand",                           role:"CTAs, nav, active states, focus rings, links — the single brand anchor",                                   hex:"#015253", rgb:"1 · 82 · 83",     grp:"Teal Tones", isDefault:true},
      {value:"#014A4B", label:"Teal 600", subtitle:"Hover · Pressed",                    role:"Hover/pressed state for any teal interactive element",                                                      hex:"#014A4B", rgb:"1 · 74 · 75",     grp:"Teal Tones"},
      {value:"#013E3E", label:"Teal 700", subtitle:"High-contrast · Accessible text",    role:"High-contrast icons, focus rings on light bg, accessible text on Teal 50/100",                             hex:"#013E3E", rgb:"1 · 62 · 62",     grp:"Teal Tones"},
      {value:"#001D1D", label:"Teal 900", subtitle:"Footer · Max-contrast",              role:"Footer background (dark footer), maximum-contrast text on teal surfaces",                                   hex:"#001D1D", rgb:"0 · 29 · 29",     grp:"Teal Tones"},
      // ── BRAND ──
      {value:"#D42924", label:"Metzler Rot",         subtitle:"Signal color · Logo M-square only",    role:"Logo M-square, discount badge (–10%) on product cards. Never for CTAs, body text, or large fills", hex:"#D42924", rgb:"212 · 41 · 36",  grp:"Brand"},
      {value:"#1A171B", label:"Digital Schwarz",     subtitle:"Brand black · Headlines + wordmark",   role:'Product titles, page headings, "METZLER" wordmark, table rules, icon fills across print and web',  hex:"#1A171B", rgb:"26 · 23 · 27",   grp:"Brand"},
      // ── GREEN ──
      {value:"#009951", label:"Green / Select",      subtitle:"Success · Availability · Selection",   role:"In-stock badge, success alert/toast, checkbox (Configurator), radio, textfield active/done border", hex:"#009951", rgb:"0 · 153 · 81",   grp:"Green"},
      {value:"rgba(0,153,81,0.5)", label:"Green 50%", subtitle:"Muted green · Inactive states",       role:"Muted in-stock, disabled selected checkboxes, greyed-out availability indicators",                hex:"#009951", rgb:"rgba(0, 153, 81, 0.50)",  grp:"Green"},
      // ── RED ──
      {value:"#FFF0EF", label:"Red 50",  subtitle:"Alert · Error backgrounds",         role:"Alert/error background fills, validation row tints — derived from Metzler Rot",                           hex:"#FFF0EF", rgb:"255 · 240 · 239", grp:"Red"},
      {value:"#D42924", label:"Red 500", subtitle:"Metzler Rot · Default",             role:"Sale prices, error text, badges, borders. Not for CTA buttons — red triggers purchase anxiety",           hex:"#D42924", rgb:"212 · 41 · 36",   grp:"Red", isDefault:true},
      {value:"#B52320", label:"Red 600", subtitle:"Hover · Pressed",                  role:"Hover/pressed state for any red interactive element",                                                       hex:"#B52320", rgb:"181 · 35 · 32",   grp:"Red"},
      {value:"#4D0E0D", label:"Red 900", subtitle:"Text on red backgrounds",           role:"Readable text on Red 50 alert surfaces (error messages, alert body text)",                                 hex:"#4D0E0D", rgb:"77 · 14 · 13",    grp:"Red"},
      // ── YELLOW ──
      {value:"#FFC041", label:"Star Yellow",         subtitle:"Review stars · Rating UI",             role:"Review star fill colour on product cards, PDP rating bars, order confirmation star rating widget",  hex:"#FFC041", rgb:"255 · 192 · 65",   grp:"Yellow"},
      // ── GRAPHITE SURFACES ──
      {value:"#F5F6FA", label:"Paper White",  subtitle:"Graphite 50 · Page backgrounds",  role:"Page bg, sidebar, search bar pill",                                                                         hex:"#F5F6FA", rgb:"245 · 246 · 250", grp:"Graphite Surfaces"},
      {value:"#F0F0F0", label:"Graphite 100", subtitle:"Off-white · Row dividers",         role:"Row dividers, inactive tabs, skeleton, badges",                                                             hex:"#F0F0F0", rgb:"240 · 240 · 240", grp:"Graphite Surfaces"},
      {value:"#E6E6E8", label:"Graphite 200", subtitle:"Hairline separators",              role:"Hairline separators in lists",                                                                              hex:"#E6E6E8", rgb:"230 · 230 · 232", grp:"Graphite Surfaces"},
      {value:"#DADADA", label:"Graphite 300", subtitle:"Default borders",                  role:"Default input borders, card outlines, swatches",                                                            hex:"#DADADA", rgb:"218 · 218 · 218", grp:"Graphite Surfaces"},
      {value:"#BFBFC2", label:"Graphite 400", subtitle:"Focused borders",                  role:"Focused borders, table outline, selected ring",                                                             hex:"#BFBFC2", rgb:"191 · 191 · 194", grp:"Graphite Surfaces"},
      {value:"#CCCCCC", label:"Graphite 450", subtitle:"Soft borders · Dividers",           role:"Soft borders, dividers, skeleton lines, disabled input outlines",                                            hex:"#CCCCCC", rgb:"204 · 204 · 204", grp:"Graphite Surfaces"},
      // ── GRAPHITE TEXT ──
      {value:"#A1A1A1", label:"Graphite 500", subtitle:"Placeholders · Disabled",          role:"Placeholder text, disabled labels, inactive icons",                                                         hex:"#A1A1A1", rgb:"161 · 161 · 161", grp:"Graphite Text"},
      {value:"#7A7A82", label:"Graphite 600", subtitle:"Metadata · Captions",              role:"Metadata, captions, 'in stock', timestamps",                                                               hex:"#7A7A82", rgb:"122 · 122 · 130", grp:"Graphite Text"},
      {value:"#54545C", label:"Graphite 700", subtitle:"Secondary text",                   role:"Secondary text, helper text, secondary nav",                                                                hex:"#54545C", rgb:"84 · 84 · 92",    grp:"Graphite Text"},
      {value:"#2E2E36", label:"Graphite 800", subtitle:"Body text",                        role:"Body paragraphs, primary nav, input values",                                                                hex:"#2E2E36", rgb:"46 · 46 · 54",    grp:"Graphite Text"},
      {value:"#333333", label:"Graphite 850", subtitle:"Icons · Dark UI text",              role:"Icon fills on light surfaces, dark UI labels, secondary headings",                                           hex:"#333333", rgb:"51 · 51 · 51",    grp:"Graphite Text"},
      {value:"#1A1A1F", label:"Graphite 900", subtitle:"Headings",                         role:"Headings, product names, prices",                                                                           hex:"#1A1A1F", rgb:"26 · 26 · 31",    grp:"Graphite Text"},
      // ── GRAPHITE OVERLAYS ──
      {value:"#000000", label:"True Black",   subtitle:"Logo · Primary CTA",               role:'Logo, primary CTA, "Add to cart"',                                                                          hex:"#000000", rgb:"0 · 0 · 0",       grp:"Graphite Overlays"},
      {value:"#FFFFFF", label:"Pure White",   subtitle:"Surfaces · Button labels",          role:"Card backgrounds, modal surfaces, button label on teal/dark, icon fill on teal",                           hex:"#FFFFFF", rgb:"255 · 255 · 255",  grp:"Graphite Overlays"},
      {value:"rgba(255,255,255,0.5)", label:"White 50%", subtitle:"Ghost text · Dark bg",  role:"Footer accordion labels, footer nav text, top-bar secondary text on teal",                                 hex:"#FFFFFF", rgb:"rgba(255, 255, 255, 0.50)", grp:"Graphite Overlays"},
      // ── ACCENT ──
      {value:"#5CDBD3", label:"Teal Mint",           subtitle:"Footer links · Dark bg hyperlinks",    role:"Hyperlinks on dark/teal backgrounds, hover colour for footer nav links",                          hex:"#5CDBD3", rgb:"92 · 219 · 211",   grp:"Accent"},
      // ── GRADIENTS ──
      {value:"linear-gradient(90deg,#01292A 0%,#011d1e 50%,#000000 100%)", label:"Gradient Brand",  subtitle:"Hero · Dark sections",      role:"Hero section background, dark banner fills, full-width dark overlays",  hex:"—", rgb:"—", grp:"Gradients"},
      {value:"linear-gradient(135deg,#5CDBD3,#015253)",                     label:"Gradient Accent", subtitle:"Accent · Decorative fills", role:"Accent highlights, decorative cards, icon backgrounds, badge fills",     hex:"—", rgb:"—", grp:"Gradients"},
    ];

    // ── LOGO ──
    const Logo = ({ height=28, color="dark" }) => {
      const tf = color==="light" ? "#fff" : "#1a171a";
      return (
        <svg viewBox="0 0 1095.83 184.29" style={{height,width:"auto",display:"block"}} xmlns="http://www.w3.org/2000/svg">
          <g>
            <rect x="0" y="0" width="184.3" height="184.3" rx="5.75" fill="#cc322b"/>
            <path fill="#fff" d="M70.19,34.81l19.04,32.98-9.58,16.57-28.59-49.55h19.13ZM70.28,108.58h0l-23.45-40.64v85.89h-16.57V34.81h16.57l33.02,57.21L123.92,15.65h19.13l-63.22,109.52-9.58-16.57.02-.02ZM153.14,153.83h-16.57v-85.87l-33,57.14h-19.13l52.11-90.28h16.57v119.02l.02-.02Z"/>
            <g>
              <path fill={tf} d="M338.52,153.83l-.33-63.09-30.6,51.35h-14.96l-30.44-49.66v61.39h-31.11V34.81h27.72l41.82,68.7,40.82-68.7h27.72l.33,119.02h-30.98Z"/>
              <path fill={tf} d="M489.31,127.82v26.01h-95.55V34.81h95.58v26.01h-62.24v20.06h52.89v25.16h-52.89v21.76h62.24Z"/>
              <path fill={tf} d="M965.1,127.82v26.01h-95.55V34.81h95.58v26.01h-62.24v20.06h52.89v25.16h-52.89v21.76h62.24Z"/>
              <path fill={tf} d="M544.54,61.5h-36.56v-26.7h106.62v26.7h-36.39v92.32h-33.67V61.5Z"/>
              <path fill={tf} d="M737.47,127.13v26.72H633.33v-21.09l60.01-71.24h-60.12v-26.72h104.14v21.09l-60.01,71.24h60.12Z"/>
              <path fill={tf} d="M758.29,34.79h33.67v92.35h56.78v26.7h-90.45V34.79Z"/>
              <path fill={tf} d="M1038.2,122.21h-18.37v31.62h-33.67V34.81h54.4c10.78,0,20.13,1.78,28.06,5.34,7.93,3.56,14.05,8.66,18.37,15.3,4.3,6.64,6.46,14.43,6.46,23.38s-2,16.12-6.03,22.54c-4.03,6.41-9.78,11.42-17.26,15.05l25.68,37.41h-36.05l-21.6-31.62ZM1054.19,65.94c-3.52-3.05-8.73-4.59-15.65-4.59h-18.71v34.85h18.71c6.9,0,12.14-1.49,15.65-4.5,3.52-3.01,5.28-7.28,5.28-12.83s-1.76-9.86-5.28-12.92Z"/>
            </g>
          </g>
        </svg>
      );
    };

    // ── ICONS ──
    const Icon = ({ name, size=20, color="#000000" }) => {
      if (name==="profile") return (
        <svg width={size} height={size} viewBox="0 0 26 25" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 24L2.54 22.06C4.13 20.05 6.55 18.87 9.12 18.87H16.88C19.45 18.87 21.87 20.05 23.46 22.06L25 24" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          <path d="M13 0.8C16.97 0.8 20.19 4.02 20.19 8C20.19 11.98 16.97 15.2 13 15.2C9.03 15.2 5.81 11.98 5.81 8C5.81 4.02 9.03 0.8 13 0.8Z" stroke={color} strokeWidth="1.5"/>
        </svg>
      );
      const icons = {
        search:     <svg width={size} height={size} viewBox="0 0 18 19" fill="none"><circle cx="7.5" cy="7.5" r="6.5" stroke={color} strokeWidth="2"/><line x1="12.5" y1="13" x2="17" y2="17.5" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>,
        close:      <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke={color} strokeWidth="2" strokeLinecap="round"/></svg>,
        check:      <svg width={size} height={size} viewBox="0 0 20 20" fill="none"><path d="M5 10l3 3 7-7" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
        info:       <svg width={size} height={size} viewBox="0 0 17 17" fill="none"><circle cx="8.5" cy="8.5" r="7.5" stroke={color} strokeWidth="1.5"/><line x1="8.5" y1="7" x2="8.5" y2="13" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><circle cx="8.5" cy="5" r="1" fill={color}/></svg>,
        plus:       <svg width={size} height={size} viewBox="0 0 14 14" fill="none"><line x1="7" y1="1" x2="7" y2="13" stroke={color} strokeWidth="1.5" strokeLinecap="round"/><line x1="1" y1="7" x2="13" y2="7" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
        minus:      <svg width={size} height={size} viewBox="0 0 14 14" fill="none"><line x1="1" y1="7" x2="13" y2="7" stroke={color} strokeWidth="1.5" strokeLinecap="round"/></svg>,
        star:       <svg width={size} height={size} viewBox="0 0 14 14" fill={color}><path d="M7 0l2.1 4.3 4.9.7-3.5 3.4.8 4.6L7 10.8 2.7 13l.8-4.6L0 5l4.9-.7z"/></svg>,
        menu:       <svg width={size} height={size*0.7} viewBox="0 0 21 15" fill="none"><rect width="21" height="2" rx="1" fill={color}/><rect y="6" width="21" height="2" rx="1" fill={color}/><rect y="12" width="21" height="2" rx="1" fill={color}/></svg>,
      };
      return icons[name] || null;
    };

    // ── ATOMS ──
    // Checkbox — matches // States: Default (unchecked), Checked-teal (#015253), Checked-green (#009951)
    // Size: 25×25px Desktop; borderRadius: 4px
    const Checkbox = ({ state="Default", variant="Filter", label, size=25 }) => {
      const isChecked = state === "Checked";
      const bg = isChecked ? (variant==="Configurator" ? "#009951" : "#015253") : "#fff";
      const border = isChecked ? "none" : "1px solid #DADADA";
      return (
        <div style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer",userSelect:"none"}}>
          <div style={{width:size,height:size,borderRadius:4,border,background:bg,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxSizing:"border-box"}}>
            {isChecked && (
              <svg width={Math.round(size*0.56)} height={Math.round(size*0.56)} viewBox="0 0 14 14" fill="none">
                <path d="M2 7l3.5 3.5L12 3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            )}
          </div>
          {label && <span style={{fontFamily:font,fontSize:16,color:"#000000"}}>{label}</span>}
        </div>
      );
    };

    // RadioBtn — matches // States: Default, Active, Disabled, Error
    // Size: 20×20px Desktop; fully rounded
    const RadioBtn = ({ state="Default", label }) => {
      const cfg = {
        Default:  { bg:"#fff",      border:"1px solid #DADADA", dot:false },
        Active:   { bg:"#fff",      border:"1px solid #009951", dot:true,  dotColor:"#009951" },
        Disabled: { bg:"#F5F6FA",   border:"1px solid #DADADA", dot:false },
        Error:    { bg:"#fff",      border:"1px solid #C90000", dot:false },
      };
      const c = cfg[state] || cfg.Default;
      return (
        <div style={{display:"flex",alignItems:"center",gap:9,cursor:state==="Disabled"?"not-allowed":"pointer",userSelect:"none",opacity:state==="Disabled"?0.7:1}}>
          <div style={{width:20,height:20,borderRadius:"50%",border:c.border,background:c.bg,position:"relative",flexShrink:0,boxSizing:"border-box"}}>
            {c.dot && <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",width:13,height:13,borderRadius:"50%",background:c.dotColor}}/>}
          </div>
          {label && <span style={{fontFamily:font,fontSize:16,color:state==="Disabled"?"#A1A1A1":"#000000"}}>{label}</span>}
        </div>
      );
    };
    const Badge = ({ children, color="green" }) => {
      const b={green:"#E6F9F0",red:"#FFF1F0",blue:"#E6F7FF",gray:"#F5F6FA"}, t={green:"#009951",red:"#C90000",blue:"#3B9ADB",gray:"#666"};
      return <span style={{display:"inline-block",padding:"4px 10px",borderRadius:4,background:b[color],color:t[color],fontSize:f(12),fontWeight:500,fontFamily:font}}>{children}</span>;
    };
    const SaleBadge = ({ pct=10 }) => <div style={{background:"#C90000",borderRadius:4,padding:"2px 8px",display:"inline-flex",alignItems:"center"}}><span style={{fontWeight:800,fontSize:f(16),color:"#fff"}}>-{pct}%</span></div>;

    // ── COLOR PALETTE TABLE ──
    const ColorPalette = () => {
      const [copiedHex, setCopiedHex] = useState(null);

      const groups = [

        {id:'Red',          label:'RED TONES',       desc:'4 tones anchored to Metzler Rot — light fill, default signal red, hover state, and accessible dark text'},
        {id:'Graphite Surfaces', label:'GRAPHITE · SURFACES', desc:'Surfaces & borders — from page background to focused ring'},
        {id:'Graphite Text',     label:'GRAPHITE · TEXT',     desc:'Text & icons — four levels from placeholder to heading'},
        {id:'Graphite Overlays', label:'GRAPHITE · OVERLAYS', desc:'Blacks, whites & scrims for CTAs, modals and dark surfaces'},
        {id:'Accent',       label:'ACCENT',          desc:'Highlights, info states, star ratings, trust bar'},

      ];
      return (

                  <span style={{fontSize:11,fontWeight:800,letterSpacing:'0.12em',color:'#015253',textTransform:'uppercase'}}>{grp.label}</span>

                </div>
                {grp.id==='Gradients'
                  ? <div style={{display:'grid',gridTemplateColumns:'44px 170px 2fr 1fr',padding:'7px 16px',background:'#F5F6FA',borderBottom:'1px solid #DADADA'}}>
                      {['','Name','Usage','VALUE'].map(h=>(
                        <div key={h} style={{fontSize:9,fontWeight:700,color:'#AAA',fontFamily:font,textTransform:'uppercase',letterSpacing:'0.08em'}}>{h}</div>
                      ))}

                  : <div style={{display:'grid',gridTemplateColumns:'44px 170px 2fr 110px 130px',padding:'7px 16px',background:'#F5F6FA',borderBottom:'1px solid #DADADA'}}>
                      {['','Name','Usage','HEX','RGB'].map(h=>(

                {tokens.map((t, i)=>{
                  const isLast = i === tokens.length-1;
                  const isLight = ['#FFFFFF','#F5F6FA','#F0F0F0'].includes(t.hex) || t.value.includes('0.05') || t.value.includes('0.1');
                  const uid = t.hex + t.label;

                    <div key={uid} style={{display:'grid',gridTemplateColumns:'44px 170px 2fr 1fr',alignItems:'center',padding:'10px 16px',minHeight:52,background:'#fff',borderBottom:isLast?'none':'1px solid #F0F0F0'}}>
                      <div onClick={()=>copy(t.value,uid)} title={copied?'Copied!':'Click to copy'}
                        style={{width:38,height:34,borderRadius:6,border:'1px solid #E8E8E8',cursor:'pointer',position:'relative',overflow:'hidden',boxShadow:copied?'0 0 0 2px #015253':'none',
                          background: t.value,
                        }}>
                        {copied&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'#fff',fontSize:8,fontWeight:700}}>✓</span></div>}
                      </div>
                      <div style={{paddingRight:8}}>
                        <div style={{fontSize:16,fontWeight:700,color:'#000',lineHeight:1.25}}>{t.label}</div>

                      </div>

                    <div key={uid} style={{display:'grid',gridTemplateColumns:'44px 170px 2fr 110px 130px',alignItems:'center',padding:'10px 16px',minHeight:52,background:'#fff',borderBottom:isLast?'none':'1px solid #F0F0F0'}}>
                      <div onClick={()=>copy(t.value,uid)} title={copied?'Copied!':'Click to copy'}
                        style={{width:38,height:34,borderRadius:6,border:'1px solid #E8E8E8',cursor:'pointer',position:'relative',overflow:'hidden',boxShadow:copied?'0 0 0 2px #015253':'none',
                          background: t.value,
                        }}>
                        {copied&&<div style={{position:'absolute',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:'center',justifyContent:'center'}}><span style={{color:'#fff',fontSize:8,fontWeight:700}}>✓</span></div>}
                      </div>
                      <div style={{paddingRight:8}}>

                        </div>
                        <div style={{fontSize:10,color:'#A1A1A1',marginTop:1,lineHeight:1.4}}>{t.subtitle}</div>
                      </div>
                      <div style={{fontSize:16,color:'#444',lineHeight:1.55,paddingRight:16}}>{t.role}</div>
                      <div style={{minWidth:0}}>
                        {t.hex!=='—'
                        ? <span onClick={()=>copy(t.hex,uid)} style={{fontFamily:'monospace',fontSize:11,fontWeight:700,color:'#015253',background:'rgba(1,82,83,0.07)',padding:'3px 6px',borderRadius:4,cursor:'pointer',whiteSpace:'nowrap'}}>{t.hex}</span>
                        : <span onClick={()=>copy(t.value,uid)} title="Click to copy" style={{fontFamily:'monospace',fontSize:9,fontWeight:600,color:'#015253',background:'rgba(1,82,83,0.07)',padding:'3px 6px',borderRadius:4,cursor:'pointer',wordBreak:'break-all',display:'inline-block',lineHeight:1.5}}>{t.value}</span>
                        }
                      </div>
                      <div style={{fontFamily:'monospace',fontSize:11,color:'#888'}}>{t.rgb!=='—' ? t.rgb : '—'}</div>
                    </div>
                  );
                })}

            );
          })}

      );
    };

    // ── COLOR CARD ──
    const ColorCard = ({ value, label, rgb, usage }) => {
      const [cp,setCp]=useState(false);
      const hex=getHex(value);
      const isLight=["#FFFFFF","#F5F6FA","#F0F0F0","#F4FBFA","#FAFEFE"].includes(hex) || value.includes("0.05") || value.includes("0.1");
      return (
        <div onClick={()=>{navigator.clipboard?.writeText(hex||value).catch(()=>{});setCp(true);setTimeout(()=>setCp(false),1500);}}

          <div style={{height:f(80),background:value,borderBottom:"1px solid #E8E8E8",position:"relative",flexShrink:0}}>
            {cp&&<div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.45)",display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{color:"#fff",fontSize:f(12),fontWeight:700}}>Copied!</span></div>}
            <div style={{position:"absolute",bottom:8,right:10,background:"rgba(0,0,0,0.18)",borderRadius:4,padding:"2px 7px"}}>
              <span style={{fontSize:f(10),color:"#fff",fontFamily:"monospace",fontWeight:600}}>click to copy</span>

          <div style={{padding:`${f(12)}px ${f(14)}px ${f(14)}px`,display:"flex",flexDirection:"column",gap:f(6),flex:1}}>

            <div style={{display:"flex",gap:f(8),flexWrap:"wrap"}}>
              {hex&&<span style={{fontSize:f(11),fontFamily:"monospace",color:"#015253",background:"rgba(1,82,83,0.07)",padding:"2px 7px",borderRadius:4,fontWeight:600}}>{hex}</span>}
              <span style={{fontSize:f(11),fontFamily:"monospace",color:"#555",background:"#F5F6FA",padding:"2px 7px",borderRadius:4}}>{rgb}</span>
            </div>
            <div style={{fontSize:f(12),color:"#666",lineHeight:1.55,marginTop:f(2),borderTop:"1px solid #F0F0F0",paddingTop:f(8)}}>{usage}</div>
          </div>
        </div>
      );
    };

    // ── CODE BLOCK ──
    const CodeBlock = ({code, inline=false, lang='HTML'}) => {
      const [copied,setCopied] = useState(false);

      // ── Syntax colours (VS Code dark theme inspired) ──
      const C = {
        comment:   '#5a8a6a',   // /* comments */        muted green
        selector:  '#DCDCAA',   // .class-name { }       yellow
        brace:     'rgba(255,255,255,0.45)', // { }      neutral
        prop:      '#9CDCFE',   // property-name:        sky blue
        colon:     'rgba(255,255,255,0.35)', // :        punctuation
        semi:      'rgba(255,255,255,0.35)', // ;
        value:     '#CE9178',   // values                salmon/orange
        hex:       '#B5CEA8',   // #015253 color values  light green
        num:       '#B5CEA8',   // px / rem numbers      light green
        htmlTag:   '#569CD6',   // <button>              blue
        htmlAttr:  '#9CDCFE',   // class=                sky blue
        htmlStr:   '#CE9178',   // "btn-primary"         salmon
        pseudo:    '#C586C0',   // :hover :active        purple
        atRule:    '#C586C0',   // -webkit-              purple
        text:      '#5CDBD3',   // default               teal
      };

      // ── CSS property line: "  property: value; /* cmt */" ──
      const highlightPropLine = (line) => {
        const indent = line.match(/^(\s*)/)[1];
        const trimmed = line.trimStart();
        const cmtMatch = trimmed.match(/^(.*?)(\/\*.*?\*\/\s*)$/);
        const body = cmtMatch ? cmtMatch[1] : trimmed;
        const cmt  = cmtMatch ? cmtMatch[2] : '';
        const colonIdx = body.indexOf(':');
        if (colonIdx === -1)
          return <>{indent}<span style={{color:C.text}}>{body}</span>{cmt&&<span style={{color:C.comment}}>{cmt}</span>}</>;
        const prop   = body.slice(0, colonIdx);
        const rest   = body.slice(colonIdx + 1);
        const valRaw = rest.replace(/;\s*$/, '').trim();
        const semi   = rest.trimEnd().endsWith(';') ? ';' : '';
        const isHex  = /^#[0-9a-fA-F]{3,8}$/.test(valRaw) || /^rgba?\(/.test(valRaw);
        return (
          <>
            {indent}
            <span style={{color:C.prop}}>{prop}</span>
            <span style={{color:C.colon}}>: </span>
            <span style={{color:isHex ? C.hex : C.value}}>{valRaw}</span>
            <span style={{color:C.semi}}>{semi}</span>
            {cmt && <span style={{color:C.comment}}>  {cmt.trim()}</span>}
          </>
        );
      };

      // ── HTML/JSX attribute string tokeniser ──
      // Handles: attr="val"  attr='val'  attr={{obj}}  attr={expr}  boolAttr
      const tokenizeAttrs = (attrStr) => {
        const out = []; let i = 0; let k = 0;
        const n = attrStr.length;
        while (i < n) {
          // Whitespace
          let ws = '';
          while (i < n && /\s/.test(attrStr[i])) ws += attrStr[i++];
          if (ws) out.push(<span key={k++} style={{color:C.text}}>{ws}</span>);
          if (i >= n) break;
          // Attr name
          let name = '';
          while (i < n && /[\w:-]/.test(attrStr[i])) name += attrStr[i++];
          if (!name) { out.push(<span key={k++} style={{color:C.text}}>{attrStr[i++]}</span>); continue; }
          if (i < n && attrStr[i] === '=') {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>);
            out.push(<span key={k++} style={{color:C.colon}}>=</span>);
            i++; // skip =
            // Value
            let val = ''; let valColor = C.htmlStr;
            if (attrStr[i] === '"' || attrStr[i] === "'") {
              const q = attrStr[i++]; val = q;
              while (i < n && attrStr[i] !== q) val += attrStr[i++];
              val += attrStr[i] || ''; if (i < n) i++;
            } else if (attrStr[i] === '{') {
              valColor = C.value; // JSX expr → salmon
              let depth = 0;
              while (i < n) {
                const ch = attrStr[i++]; val += ch;
                if (ch === '{') depth++;
                else if (ch === '}') { depth--; if (depth === 0) break; }
              }
            }
            out.push(<span key={k++} style={{color:valColor}}>{val}</span>);
          } else {
            out.push(<span key={k++} style={{color:C.htmlAttr}}>{name}</span>); // boolean attr
          }
        }
        return out;
      };

      // ── Find closing > or /> index, skipping quoted strings & braces ──
      const findTagClose = (str) => {
        let i = 0;
        while (i < str.length) {
          const ch = str[i];
          if (ch === '"' || ch === "'") { const q=ch; i++; while(i<str.length&&str[i]!==q)i++; }
          else if (ch === '{') { let d=1; i++; while(i<str.length&&d>0){if(str[i]==='{')d++;else if(str[i]==='}')d--;i++;} continue; }
          else if (ch === '/' && str[i+1] === '>') return i;
          else if (ch === '>') return i;
          i++;
        }
        return -1;
      };

      // ── Per-line highlighter ──
      const highlightLine = (line, idx) => {
        const trimmed = line.trim();

        // Blank
        if (!trimmed) return <div key={idx} style={{height:'0.7em'}}/>;

        // Block comment  /* ... */
        if (/^\/\*/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML comment  <!-- ... -->
        if (/^<!--/.test(trimmed))
          return <div key={idx}><span style={{color:C.comment}}>{line}</span></div>;

        // HTML / JSX tag line  <tag ...>  </tag>
        if (/^\s*<\/?[\w!]/.test(line)) {
          const parts = []; let k = 0;
          const indentM = line.match(/^(\s+)/);
          let rest = indentM ? (parts.push(indentM[1]), line.slice(indentM[1].length)) : line;

          // Tag name  <div  </div
          const tagM = rest.match(/^(<\/?)(\w[\w-]*)/);
          if (tagM) {
            parts.push(<span key={k++} style={{color:C.htmlTag}}>{tagM[1]}{tagM[2]}</span>);
            rest = rest.slice(tagM[0].length);
          }

          // Find where attrs end (closing > or />)
          const closeIdx = findTagClose(rest);
          const attrStr  = closeIdx >= 0 ? rest.slice(0, closeIdx) : rest;
          const afterClose = closeIdx >= 0 ? rest.slice(closeIdx) : '';

          // Tokenise attrs
          tokenizeAttrs(attrStr).forEach((el,i) => parts.push(React.cloneElement(el,{key:k++})));

          // Closing bracket + inline text after
          if (afterClose) {
            const cbM = afterClose.match(/^(\/?>)(.*)/s);
            if (cbM) {
              parts.push(<span key={k++} style={{color:C.htmlTag}}>{cbM[1]}</span>);
              if (cbM[2].trim()) {
                // Split: optional text · closing tag · optional remainder
                const splitM = cbM[2].match(/^(.*?)(<\/[\w][\w-]*>)\s*$/s);
                const pushTextWithTags = (str) => {
                  str.split(/(<[^>]+>)/g).forEach(p => {
                    if (!p) return;
                    if (/^<[^>]+>$/.test(p))
                      parts.push(<span key={k++} style={{color:'#569CD6',opacity:0.85}}>{p}</span>);
                    else
                      parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{p}</span>);
                  });
                };
                if (splitM) {
                  if (splitM[1]) pushTextWithTags(splitM[1]);
                  parts.push(<span key={k++} style={{color:C.htmlTag}}>{splitM[2]}</span>);
                  if (splitM[3]) pushTextWithTags(splitM[3]);
                } else {
                  parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{cbM[2]}</span>);
                }
              }
            } else parts.push(<span key={k++} style={{color:'#D4D4D4'}}>{afterClose}</span>);
          }
          return <div key={idx}>{parts}</div>;
        }

        // Self-close  />  or lone  >  on its own line
        if (/^\s*\/?>$/.test(trimmed)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.htmlTag}}>{trimmed}</span></div>;
        }

        // Closing CSS brace  }
        if (/^\s*\}\s*$/.test(line)) {
          const indent = line.match(/^(\s*)/)[1];
          return <div key={idx}>{indent}<span style={{color:C.brace}}>{'}'}</span></div>;
        }

        // CSS property line: word-chars then colon (not a URL)
        if (/^\s*-?[\w-]+\s*:(?!\/\/)/.test(line))
          return <div key={idx}>{highlightPropLine(line)}</div>;

        // Single-line CSS rule: .selector { prop: val; prop: val; }
        if (/^\s*[.#&*]/.test(line) && /\{[^}]+\}/.test(line)) {
          const m = line.match(/^(\s*)([^{]+?)(\{)(.*?)(\})\s*$/);
          if (m) {
            const [, indent, selectorRaw, , declarations] = m;
            const selParts = selectorRaw.trim().split(/(::?[\w-]+)/g).map((p,i) =>
              /^::?[\w-]/.test(p)
                ? <span key={i} style={{color:C.pseudo}}>{p}</span>
                : <span key={i} style={{color:C.selector}}>{p}</span>
            );
            const declParts = []; let di = 0;
            declarations.trim().split(';').forEach(decl => {
              const d = decl.trim(); if (!d) return;
              const ci = d.indexOf(':'); if (ci === -1) return;
              const prop = d.slice(0,ci).trim();
              const valRaw = d.slice(ci+1).trim();
              const isHex = /^#[0-9a-fA-F]{3,8}$/.test(valRaw) || /^rgba?\(/.test(valRaw);
              if (di > 0) declParts.push(' ');
              declParts.push(
                <React.Fragment key={di++}>
                  <span style={{color:C.prop}}>{prop}</span>
                  <span style={{color:C.colon}}>: </span>
                  <span style={{color:isHex?C.hex:C.value}}>{valRaw}</span>
                  <span style={{color:C.semi}}>;</span>
                </React.Fragment>
              );
            });
            return (
              <div key={idx}>
                {indent}{selParts}
                <span style={{color:C.brace}}>{' {'}</span>
                {' '}{declParts}{' '}
                <span style={{color:C.brace}}>{'}'}</span>
              </div>
            );
          }
        }

        // CSS selector: must start with . # & * or end with { or ,
        // (plain text like "Button" or SVG path data should fall through to default)
        if (/^\s*[.#&*]/.test(line) || (/^\s*[\w-]/.test(line) && /[{,]\s*$/.test(line))) {
          const m = line.match(/^(\s*)(.*?)(\s*\{)?\s*$/);
          const indent = m[1], brace = m[3]||'';
          const selParts = m[2].split(/(::?[\w-]+)/g).map((p,i) =>
            /^::?[\w-]/.test(p)
              ? <span key={i} style={{color:C.pseudo}}>{p}</span>
              : <span key={i} style={{color:C.selector}}>{p}</span>
          );
          return <div key={idx}>{indent}{selParts}{brace&&<span style={{color:C.brace}}>{brace}</span>}</div>;
        }

        // HTML attribute continuation line (wrapped multi-line tag, no leading <)
        if (/^\s+[\w:-][\w:-]*\s*=/.test(line)) {
          const parts = []; let k = 0;
          const indentM = line.match(/^(\s+)/);
          let rest = indentM ? (parts.push(indentM[1]), line.slice(indentM[1].length)) : line;
          const closeM = rest.match(/^(.*?)(\s*\/?>)\s*$/);
          const attrPart = closeM ? closeM[1] : rest;
          const closePart = closeM ? closeM[2] : '';
          tokenizeAttrs(attrPart).forEach((el,i) => parts.push(React.cloneElement(el,{key:k++})));
          if (closePart) parts.push(<span key={k++} style={{color:C.htmlTag}}>{closePart.trim()}</span>);
          return <div key={idx}>{parts}</div>;
        }

        // Default: plain text, HTML text content, etc.
        return <div key={idx}><span style={{color:'#D4D4D4'}}>{line}</span></div>;
      };

      const lines = code.split('\n');
      const [open, setOpen] = useState(false);

      // ── Inline (Bootstrap-style) mode ──
      if (inline) {
        return (
          <div style={{borderTop:'1px solid #DEE2E6',overflow:'hidden',borderRadius:'0 0 8px 8px',maxWidth:'100%',width:'100%',boxSizing:'border-box'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
              padding:'7px 16px',background:'#F5F6F8',borderBottom:'1px solid #DEE2E6'}}>
              <span style={{fontSize:10,fontWeight:700,color:'#AAAAAA',fontFamily:'monospace',
                textTransform:'uppercase',letterSpacing:'0.1em'}}>{lang}</span>
              <button
                onClick={()=>{navigator.clipboard?.writeText(code).catch(()=>{});setCopied(true);setTimeout(()=>setCopied(false),1500);}}
                style={{background:'none',border:'none',cursor:'pointer',padding:4,display:'flex',alignItems:'center',gap:4,
                  color:copied?'#009900':'#AAAAAA',fontSize:10,fontFamily:font,fontWeight:600,transition:'color 0.2s'}}>
                {copied ? '✓ Copied' : (
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/>
                  </svg>
                )}
              </button>
            </div>
            <div style={{background:'#1E1E1E',padding:'14px 20px',fontFamily:'monospace',
              fontSize:12.5,lineHeight:1.7,whiteSpace:'pre',overflowX:'auto',maxWidth:'100%',boxSizing:'border-box'}}>
              {lines.map((line,i) => highlightLine(line,i))}
            </div>
          </div>
        );
      }

      return (
        <>

          {/* View Code trigger button */}
          <button
            onClick={()=>setOpen(true)}
            style={{
              display:'inline-flex', alignItems:'center', gap:6,
              background:'none', border:'1.5px solid #DA7756',
              borderRadius:6, padding:'6px 14px',
              fontSize:12, color:'#DA7756', fontFamily:font,
              cursor:'pointer', marginTop:12, fontWeight:500,
              transition:'background 0.15s, color 0.15s, border-color 0.15s',
            }}
            onMouseEnter={e=>{e.currentTarget.style.background='#DA7756';e.currentTarget.style.color='#fff';}}

          ...(pos==='bottom' && {...arrowBase, top:'calc(100% + 0.5rem - 6px)',    left:'50%', transform:'translateX(-50%)',

`/* Wrapper — must be position:relative */
.tooltip-wrapper { position: relative; display: inline-flex; }

/* Bubble */
.tooltip {

  padding: 0.4rem 0.75rem;

/* Position variants */

    const BreakpointsSection = () => {

`/* Metzler breakpoints — mobile-first (min-width) */

    // Quantity Counter Section
    const QtyCounterSection = () => {
      const sizes = [
        { key:'lg', label:'Large',   track:48, btn:48, fs:'1.125rem', gap:'1.25rem', minW:160 },
        { key:'md', label:'Default', track:40, btn:40, fs:'1rem',     gap:'1rem',    minW:132 },
        { key:'sm', label:'Small',   track:32, btn:32, fs:'0.875rem', gap:'0.75rem', minW:108 },
      ];

      const Counter = ({track, btn, fs, gap, minW, disabled=false}) => {
        const [val, setVal]         = useState(1);
        const [pressing, setPressing] = useState(null);  // 'dec' | 'inc' | null
        const radius = '0.25rem';
        const iconSz = btn < 40 ? 14 : btn < 48 ? 16 : 18;

        const btnStyle = (which) => {
          const isActive  = pressing === which && !disabled;
          const isDecDead = which === 'dec' && (val <= 0 || disabled);
          const isDisabled = disabled;
          return {
            width:btn, height:'100%', border:'none',
            background: isActive ? '#015253' : '#F5F6FA',
            cursor: isDecDead || isDisabled ? 'default' : 'pointer',
            display:'flex', alignItems:'center', justifyContent:'center',
            color: isActive ? '#fff'
                 : isDecDead  ? '#C8C8C8'
                 : which==='inc' ? '#015253'
                 : '#1A1A1F',
            borderRadius: which==='dec' ? `${radius} 0 0 ${radius}` : `0 ${radius} ${radius} 0`,
            flexShrink:0,
            transition:'background 0.1s, color 0.1s',
          };
        };

        return (
          <div style={{
            display:'inline-flex', alignItems:'center',
            border:'0.0625rem solid #DADADA', borderRadius:radius,
            height:track, minWidth:minW,
            background:'#fff', opacity:disabled ? 0.45 : 1,
            userSelect:'none', overflow:'hidden',
          }}>
            {/* Minus */}
            <button
              disabled={disabled||val<=0}
              onMouseDown={()=> !disabled && val>0 && setPressing('dec')}
              onMouseUp={()=>{ if(pressing==='dec'){ setPressing(null); !disabled && val>0 && setVal(v=>v-1); } }}
              onMouseLeave={()=>setPressing(null)}
              style={btnStyle('dec')}>
              <svg width={iconSz} height={iconSz} viewBox="0 0 14 2" fill="none">
                <line x1="1" y1="1" x2="13" y2="1" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </button>

            {/* Value */}
            <div style={{
              flex:1, textAlign:'center', fontFamily:font,
              fontSize:fs, fontWeight:600, color:'#1A1A1F',
              padding:`0 ${gap}`,
            }}>{val}</div>

            {/* Plus */}
            <button
              disabled={disabled}
              onMouseDown={()=> !disabled && setPressing('inc')}
              onMouseUp={()=>{ if(pressing==='inc'){ setPressing(null); !disabled && setVal(v=>v+1); } }}
              onMouseLeave={()=>setPressing(null)}
              style={btnStyle('inc')}>
              <svg width={iconSz} height={iconSz} viewBox="0 0 14 14" fill="none">
                <line x1="7" y1="1" x2="7" y2="13" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
                <line x1="1" y1="7" x2="13" y2="7" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </button>
          </div>
        );
      };

      return (
        <div>

              <span style={{fontSize:'0.6875rem',fontWeight:700,color:'#A1A1A1',fontFamily:font,textTransform:'uppercase',letterSpacing:'0.08em'}}>Disabled</span>
            </div>
            <div style={{padding:'1.5rem',background:'#fff',display:'flex',gap:'1.5rem',alignItems:'center',flexWrap:'wrap'}}>
              {sizes.map(s => <Counter key={s.key} {...s} disabled/>)}

          <CodeBlock inline lang="HTML" code={
`<!-- Default (md) -->
<div class="qty-counter">
  <button class="qty-btn" aria-label="Decrease">−</button>
  <span class="qty-value">1</span>
  <button class="qty-btn" aria-label="Increase">+</button>
</div>

<!-- Large -->
<div class="qty-counter qty-counter-lg">...</div>

<!-- Small -->
<div class="qty-counter qty-counter-sm">...</div>

<!-- Disabled -->
<div class="qty-counter" aria-disabled="true">...</div>`}/>

          <CodeBlock inline lang="CSS" code={
`.qty-counter {
  display: inline-flex;
  align-items: center;
  border: 0.0625rem solid #DADADA;
  border-radius: 0.25rem;  /* 4px — all sizes */
  height: 2.5rem;          /* 40px */
  min-width: 8.25rem;
  background: #fff;
  user-select: none;
  overflow: hidden;
}

.qty-counter-lg { height: 3rem;  min-width: 10rem; }
.qty-counter-sm { height: 2rem;  min-width: 6.75rem; }

.qty-btn {
  width: 2.5rem;
  height: 100%;
  border: none;
  background: #F5F6FA;     /* always filled — not just on hover */
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.1s, color 0.1s;
}
.qty-counter-lg .qty-btn { width: 3rem; }
.qty-counter-sm .qty-btn { width: 2rem; }

/* − button */
.qty-btn:first-child { border-radius: 0.25rem 0 0 0.25rem; color: #1A1A1F; }
/* + button */
.qty-btn:last-child  { border-radius: 0 0.25rem 0.25rem 0; color: #015253; }

/* Click / active — primary teal flash */
.qty-btn:active {
  background: #015253;
  color: #fff;
}

.qty-btn:disabled    { color: #C8C8C8; cursor: default; }
.qty-btn:disabled:active { background: #F5F6FA; color: #C8C8C8; }

.qty-value {
  flex: 1;
  text-align: center;
  font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-size: 1rem;
  font-weight: 600;
  color: #1A1A1F;
  /* no border — dividers removed */
}
.qty-counter-lg .qty-value { font-size: 1.125rem; }
.qty-counter-sm .qty-value { font-size: 0.875rem; }

/* Disabled whole counter */
.qty-counter[aria-disabled="true"] {
  opacity: 0.45;
  pointer-events: none;
}`}/>
        </div>

      return (

            border:'1px solid #E8E8E8',borderBottom:'none'}}>
            {['Link','Class','Usage'].map(h=>(
              <span key={h} style={{fontSize:'0.6875rem',fontWeight:700,color:'#A1A1A1',
                fontFamily:font,textTransform:'uppercase',letterSpacing:'0.08em'}}>{h}</span>
            ))}
          </div>
          <div style={{border:'1px solid #E8E8E8',borderRadius:'0 0 10px 10px',overflow:'hidden',marginBottom:24}}>
            {links.map(l=><LinkRow key={l.cls} {...l}/>)}
          </div>

          {/* ARROW LINK */}
          {(()=>{
            const [hov, setHov] = useState(false);
            return (
              <div style={{border:'1px solid #E8E8E8',borderRadius:10,overflow:'hidden',marginBottom:24}}>
                <div style={{padding:'8px 1.25rem',background:'#F5F6FA',borderBottom:'1px solid #E8E8E8'}}>
                  <span style={{fontSize:'0.6875rem',fontWeight:700,color:'#A1A1A1',fontFamily:font,textTransform:'uppercase',letterSpacing:'0.08em'}}>With arrow · hover to animate</span>

                <div style={{padding:'1.5rem 1.25rem',background:'#fff',display:'flex',flexWrap:'wrap',gap:'2.5rem',alignItems:'center'}}>
                  {/* On white */}
                  <a href="#" onClick={e=>e.preventDefault()}
                    onMouseEnter={()=>setHov(true)}
                    onMouseLeave={()=>setHov(false)}
                    style={{

                      color:'#015253',textDecoration:'none',
                    }}>
                    <span style={{

                    <svg width="14" height="12" viewBox="0 0 14 12" fill="none"
                      style={{
                        transition:'transform 0.2s cubic-bezier(0.34,1.56,0.64,1)',
                        transform: hov ? 'translateX(4px)' : 'translateX(0)',
                        flexShrink:0,

                      <path d="M1 6h12M7 1l6 5-6 5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </a>
                  {/* On dark bg */}
                  {(()=>{
                    const [hovD, setHovD] = useState(false);
                    return (
                      <div style={{background:'#01292A',borderRadius:'0.375rem',padding:'1rem 1.5rem'}}>
                        <a href="#" onClick={e=>e.preventDefault()}

                            color:'#5CDBD3',textDecoration:'none',

                            textDecoration: hovD ? 'underline' : 'none',
                            textUnderlineOffset:'0.2em',

                          <svg width="14" height="12" viewBox="0 0 14 12" fill="none"

                              transition:'transform 0.2s cubic-bezier(0.34,1.56,0.64,1)',

                          </svg>
                        </a>
                      </div>
                    );
                  })()}
                </div>
                <CodeBlock inline lang="HTML" code={
`<a class="link-arrow" href="#">
  Mehr erfahren
  <svg width="14" height="12" viewBox="0 0 14 12" fill="none">

          case 'file-pdf':          return W2(sp2('M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z')+sp2('M14 2v6h6')+fr2(4,15,16,7,2)+wp2('M7 18.5h1.5a1 1 0 000-2H7v4')+wp2('M12.5 16.5h1a2 2 0 010 4h-1v-4z')+wp2('M17 16.5v4M17 18.5h2'));
          case 'users':             return W2(sp2('M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2')+sc2(9,7,4)+sp2('M23 21v-2a4 4 0 00-3-3.87')+sp2('M16 3.13a4 4 0 010 7.75'));
          case 'headset':           return W2(sp2('M4 12a8 8 0 0116 0')+sc2(4,14,3)+sc2(20,14,3)+sp2('M7 17c0 2.5 2 4 5 4.5')+sc2(12,21.5,1));
          case 'review':            return W2(sp2('M5 3H20Q22 3 22 5V15Q22 17 20 17H10V21H6V17Q3 17 3 15V5Q3 3 5 3Z')+'<polygon points="6.5,2 7.68,5.38 11.26,5.46 8.4,7.62 9.44,11.04 6.5,9 3.56,11.04 4.6,7.62 1.74,5.46 5.32,5.38" fill="white" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>'+sp2('M12 8H20M12 11H20M12 14H17'));
          case 'wrench':            return W2(sp2('M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z'));
          case 'book-open':         return W2(sp2('M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z')+sp2('M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z'));
          case 'help-circle':       return W2(sp2('M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z')+sp2('M9.5 9a2.5 2.5 0 015 0c0 2-2.5 2-2.5 4')+sp2('M12 15.5h.01'));
          case 'monitor':       return W2(sr2(2,3,20,14,2)+sp2('M8 21h8M12 17v4'));
          case 'smartphone':    return W2(sr2(7,2,10,20,2)+sp2('M12 18h.01'));
          case 'wifi':          return W2(sp2('M5 12.55a11 11 0 0114.08 0')+sp2('M1.42 9A16 16 0 0122.58 9')+sp2('M8.53 16.11a6 6 0 016.95 0')+sc2(12,20,1));
          case 'bolt':          return W2(sp2('M13 2L3 14h9l-1 8 10-12h-9l1-8z'));
          case 'shield-check':  return W2(sp2('M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z')+sp2('M9 12l2 2 4-4'));
          case 'camera':        return W2(sr2(1,8,22,14,2)+sc2(12,13.5,3.5)+sp2('M6.5 8l1.5-2h8l1.5 2'));
          case 'cpu':           return W2(sr2(9,9,6,6,0)+sp2('M9 2v2M15 2v2M9 20v2M15 20v2M2 9h2M2 15h2M20 9h2M20 15h2M9 9h.01M15 9h.01M9 15h.01M15 15h.01'));
          case 'sun':           return W2(sc2(12,12,4)+sp2('M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41'));
          case 'face-id':       return W2(sp2('M8 3H5a2 2 0 00-2 2v3')+sp2('M16 3h3a2 2 0 012 2v3')+sp2('M8 21H5a2 2 0 01-2-2v-3')+sp2('M16 21h3a2 2 0 002-2v-3')+sc2(12,12,4));
          case 'database':      return W2(sp2('M12 2C8.13 2 5 3.79 5 6s3.13 4 7 4 7-1.79 7-4-3.13-4-7-4z')+sp2('M5 6v4c0 2.21 3.13 4 7 4s7-1.79 7-4V6')+sp2('M5 10v4c0 2.21 3.13 4 7 4s7-1.79 7-4v-4'));
          case 'moon':          return W2(sp2('M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z'));
          case 'grid':          return W2(sr2(3,3,7,7,1)+sr2(14,3,7,7,1)+sr2(3,14,7,7,1)+sr2(14,14,7,7,1));
          case 'clock':         return W2(sc2(12,12,10)+sp2('M12 6v6l4 2'));
          case 'door-lock':     return W2(sr2(3,3,14,18,2)+sp2('M17 8a5 5 0 010 8')+sc2(10,12,1.5)+sp2('M13 3h6a2 2 0 012 2v14a2 2 0 01-2 2h-6'));
          case 'video-cam':     return W2(sr2(1,6,15,12,2)+sp2('M16 10l6-3v10l-6-3V10z'));
          case 'router':        return W2(sr2(1,12,22,8,2)+sp2('M5 12V6a7 7 0 0114 0v6')+sc2(12,16,1));
          case 'guarantee': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 13.5,8.3 19.1,4.9 15.7,10.5 22,12 15.7,13.5 19.1,19.1 13.5,15.7 12,22 10.5,15.7 4.9,19.1 8.3,13.5 2,12 8.3,10.5 4.9,4.9 10.5,8.3" fill="#C09530"/><path d="M8.5 12l2.5 2.5 5-5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>`;
          case 'flag-de': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M2 9.33V5.5A1.5 1.5 0 013.5 4h17A1.5 1.5 0 0122 5.5v3.83H2z" fill="#1A1A1A"/><rect x="2" y="9.33" width="20" height="5.34" fill="#CC0000"/><path d="M2 14.67h20v3.83A1.5 1.5 0 0120.5 20H3.5A1.5 1.5 0 012 18.5v-3.83z" fill="#FFCC00"/></svg>`;
          case 'badge-pdf': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path d="M5 2h9l5 5v14a2 2 0 01-2 2H5a2 2 0 01-2-2V4a2 2 0 012-2z" fill="#EFEFEF"/><path d="M14 2l5 5h-4a1 1 0 01-1-1V2z" fill="#DCDCDC"/><rect x="6" y="9" width="7" height="1.2" rx="0.6" fill="#C5C5C5"/><rect x="6" y="11" width="9" height="1.2" rx="0.6" fill="#C5C5C5"/><path d="M3 15.5h18v5a1.5 1.5 0 01-1.5 1.5H4.5A1.5 1.5 0 013 20.5v-5z" fill="#015253"/><text x="12" y="20.5" text-anchor="middle" fill="white" font-size="5.5" font-weight="700" font-family="sans-serif">PDF</text></svg>`;
          case 'star-yellow': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#FFC041"/></svg>`;
          case 'star-gray': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#D8D8D8"/></svg>`;
          case 'star-half': return `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26" fill="#D8D8D8"/><polygon points="12,2 8.91,8.26 2,9.27 7,14.14 5.82,21.02 12,17.77" fill="#FFC041"/></svg>`;
          default: return '';
        }
    };

    // ── Icon tile sub-component ──
    const IconTile = ({ic, onSelect, font}) => {
      const [hov, setHov] = useState(false);
      return (
        <div
          onClick={()=>onSelect(ic.key)}
          onMouseEnter={()=>setHov(true)}
          onMouseLeave={()=>setHov(false)}
          style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,padding:'28px 12px 20px',
            border: hov ? '1px solid #015253' : '1px solid #E8E8E8',
            borderRadius:10,background:'#fff',cursor:'pointer',
            boxShadow: hov ? '0 2px 12px rgba(1,82,83,0.10)' : 'none',
            transition:'border-color 0.15s,box-shadow 0.15s'}}
        >
          <div style={{width:38,height:38,display:'flex',alignItems:'center',justifyContent:'center'}}>
            {renderIcon(ic.key,'#1A1A1A',29)}
          </div>
          <span style={{fontSize:11,fontFamily:font,color:'#666',textAlign:'center',lineHeight:1.3,wordBreak:'break-word'}}>
            {ic.label}
          </span>
        </div>
      );
    };

    // ── ICONS SECTION — inline SVGs, stroke-width 1.8 ──
    const IconsSection = () => {
      const [detail, setDetail] = useState(null);
      const [query, setQuery] = useState('');
      const [previewColor, setPreviewColor] = useState('#1A1A1A');
      const [previewSize, setPreviewSize] = useState(80);
      const [copied, setCopied] = useState(false);
      const font = "'Helvetica Neue',Helvetica,Arial,sans-serif";

      const handleCopy = () => {
        const code = getSvgString(detail.key);
        navigator.clipboard?.writeText(code).catch(()=>{});
        setCopied(true);
        setTimeout(()=>setCopied(false),1500);
      };

      const handleDownload = () => {
        const code = getSvgString(detail.key);
        const blob = new Blob([code], {type:'image/svg+xml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `${detail.key}.svg`; a.click();
        setTimeout(()=>URL.revokeObjectURL(url), 1000);
      };

      // Filtered icons list
      const q = query.toLowerCase();
      const filtered = icons.filter(ic =>
        !q || ic.label.toLowerCase().includes(q) || ic.tags.some(t => t.includes(q)) || ic.category.toLowerCase().includes(q)
      );

      // Categories in display order
      const categories = ['Navigation','Search','User','Commerce','Actions','Communication','Status','UI','Technology'];
      const colorfulIcons = icons.filter(ic => ic.style === 'color');

      // ── Detail page ──
      if (detail) {
        const iconData = icons.find(i => i.key === detail.key) || detail;
        return (
          <div style={{fontFamily:font}}>
            {/* Back button */}
            <button
              onClick={()=>setDetail(null)}
              style={{display:'inline-flex',alignItems:'center',gap:6,background:'none',border:'none',cursor:'pointer',color:'#015253',fontSize:14,fontWeight:500,padding:'0 0 20px 0',marginBottom:4}}
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M19 12H5M12 19l-7-7 7-7" stroke="#015253" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              Back to Icons
            </button>

            <div style={{display:'flex',gap:40,flexWrap:'wrap'}}>
              {/* Left: preview panel */}
              <div style={{flex:'0 0 260px'}}>
                {/* Colour selector */}
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:16}}>
                  <span style={{fontSize:12,color:'#888',fontWeight:500}}>Color</span>
                  {['#1A1A1A','#ffffff','#015253','#CCDCDD'].map(c=>(
                    <button key={c} onClick={()=>setPreviewColor(c)} title={c}
                      style={{width:20,height:20,borderRadius:'50%',background:c,padding:0,cursor:'pointer',
                        border: c==='#ffffff' ? '1.5px solid #DADADA' : 'none',
                        outline: previewColor===c ? '2.5px solid #015253' : '2.5px solid transparent',
                        outlineOffset:2, transition:'outline-color 0.15s'}}/>
                  ))}
                </div>
                {/* Big preview */}
                <div style={{display:'flex',alignItems:'center',justifyContent:'center',
                  background:previewColor==='#ffffff'?'#555':'#F4F6F6',
                  borderRadius:12,padding:'40px 0',marginBottom:16,transition:'background 0.2s'}}>
                  {renderIcon(detail.key, previewColor, previewSize)}
                </div>
                {/* Size slider */}
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
                  <span style={{fontSize:12,color:'#888',fontWeight:500,width:32}}>Size</span>
                  <input type="range" min={16} max={120} value={previewSize}
                    onChange={e=>setPreviewSize(Number(e.target.value))}
                    style={{flex:1,accentColor:'#015253'}}/>
                  <span style={{fontSize:12,color:'#015253',fontWeight:600,width:36}}>{previewSize}px</span>
                </div>
                {/* Size variants */}
                <div style={{display:'flex',border:'1px solid #E8E8E8',borderRadius:8,overflow:'hidden',marginBottom:20}}>
                  {[{s:16,l:'16px'},{s:24,l:'24px'},{s:32,l:'32px'},{s:48,l:'48px'}].map(({s,l},i)=>(
                    <div key={l} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:6,padding:'12px 4px',
                      background:previewColor==='#ffffff'?'#555':'transparent',
                      borderLeft:i?'1px solid #E8E8E8':'none',transition:'background 0.2s'}}>
                      {renderIcon(detail.key, previewColor, s)}
                      <span style={{fontSize:9,color:'#A1A1A1',fontWeight:500}}>{l}</span>
                    </div>
                  ))}
                </div>
                {/* Action buttons */}
                <div style={{display:'flex',gap:8}}>
                  <button onClick={handleCopy}
                    style={{flex:1,height:40,border:'none',borderRadius:6,
                      background:copied?'#009900':'#015253',color:'#fff',
                      fontFamily:font,fontSize:13,fontWeight:500,cursor:'pointer',transition:'background 0.2s'}}>
                    {copied?'✓ Copied!':'Copy SVG'}
                  </button>
                  <button onClick={handleDownload}
                    style={{flex:1,height:40,border:'1.5px solid #015253',borderRadius:6,
                      background:'transparent',color:'#015253',
                      fontFamily:font,fontSize:13,fontWeight:500,cursor:'pointer'}}>
                    Download SVG
                  </button>
                </div>
              </div>

              {/* Right: info panel */}
              <div style={{flex:1,minWidth:200}}>
                <h2 style={{fontFamily:font,fontSize:22,fontWeight:700,color:'#1A1A1A',margin:'0 0 4px 0'}}>{iconData.label}</h2>
                <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:20}}>
                  <span style={{fontSize:12,color:'#888',fontFamily:font}}>{iconData.category}</span>
                </div>

                {/* SVG code preview */}
                <div style={{marginBottom:16}}>
                  <div style={{fontSize:11,color:'#999',fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}}>SVG Code</div>
                  <div style={{background:'#F8F9FA',borderRadius:8,border:'1px solid #E8E8E8',padding:'12px 14px',overflowX:'auto'}}>
                    <code style={{fontFamily:'monospace',fontSize:11,color:'#444',whiteSpace:'pre-wrap',wordBreak:'break-all'}}>
                      {getSvgString(detail.key)}
                    </code>
                  </div>
                </div>

                {/* Tags */}
                {iconData.tags && (
                  <div>
                    <div style={{fontSize:11,color:'#999',fontWeight:600,letterSpacing:'0.06em',textTransform:'uppercase',marginBottom:8}}>Tags</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                      {iconData.tags.map(t=>(
                        <span key={t} style={{padding:'3px 10px',background:'#F0F6F6',color:'#015253',
                          borderRadius:20,fontSize:12,fontFamily:font,fontWeight:500}}>{t}</span>
                      ))}
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // ── Grid view ──
      return (
        <div style={{fontFamily:font}}>
          {/* Search bar */}
          <div style={{position:'relative',marginBottom:28}}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
              style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',pointerEvents:'none'}}>
              <circle cx="11" cy="11" r="7" stroke="#999" strokeWidth="1.8"/>
              <path d="M16.5 16.5l4 4" stroke="#999" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
            <input
              type="text" placeholder="Search icons…"
              value={query} onChange={e=>setQuery(e.target.value)}
              style={{width:'100%',boxSizing:'border-box',height:40,paddingLeft:38,paddingRight:12,
                border:'1px solid #E8E8E8',borderRadius:8,fontFamily:font,fontSize:14,color:'#1A1A1A',
                outline:'none',background:'#fff'}}
            />
            {query && (
              <button onClick={()=>setQuery('')}
                style={{position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',
                  background:'none',border:'none',cursor:'pointer',color:'#999',fontSize:16,lineHeight:1,padding:2}}>
                ✕
              </button>
            )}
          </div>

          {/* Count */}
          <div style={{fontSize:12,color:'#999',marginBottom:20}}>
            {filtered.length} icon{filtered.length !== 1 ? 's' : ''}
            {query ? ` for "${query}"` : ''}
          </div>

          {/* Categorised grid */}
          {query ? (
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:12}}>
              {filtered.map(ic => (
                <IconTile key={ic.key} ic={ic} onSelect={key=>setDetail(icons.find(i=>i.key===key))} font={font}/>
              ))}
            </div>
          ) : (<>
            {/* ── Default section ── */}
            <div style={{fontSize:13,fontWeight:700,color:'#1A1A1A',letterSpacing:'0.01em',
              marginBottom:20,paddingBottom:10,borderBottom:'2px solid #E8E8E8'}}>Default</div>
            {categories.map(cat => {
              const catIcons = icons.filter(ic => ic.category === cat);
              if (!catIcons.length) return null;
              return (
                <div key={cat} style={{marginBottom:32}}>
                  <div style={{fontSize:11,fontWeight:600,color:'#999',letterSpacing:'0.07em',
                    textTransform:'uppercase',marginBottom:12}}>{cat}</div>
                  <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(100px,1fr))',gap:12}}>
                    {catIcons.map(ic => (
                      <IconTile key={ic.key} ic={ic} onSelect={key=>setDetail(icons.find(i=>i.key===key))} font={font}/>
                    ))}
                  </div>
                </div>
              );
            })}

            {/* ── Colorful section ── */}
            <div style={{fontSize:13,fontWeight:700,color:'#1A1A1A',letterSpacing:'0.01em',
              marginTop:8,marginBottom:20,paddingBottom:10,borderBottom:'2px solid #E8E8E8'}}>Colorful</div>
            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(120px,1fr))',gap:12}}>
              {colorfulIcons.map(ic => (
                <div key={ic.key}
                  onClick={()=>setDetail(ic)}
                  onMouseEnter={e=>{e.currentTarget.style.border='1px solid #015253';e.currentTarget.style.boxShadow='0 2px 12px rgba(1,82,83,0.10)';}}
                  onMouseLeave={e=>{e.currentTarget.style.border='1px solid #E8E8E8';e.currentTarget.style.boxShadow='none';}}
                  style={{display:'flex',flexDirection:'column',alignItems:'center',gap:12,
                    padding:'28px 12px 20px',border:'1px solid #E8E8E8',
                    borderRadius:10,background:'#fff',cursor:'pointer',transition:'border-color 0.15s,box-shadow 0.15s'}}>
                  <div style={{width:44,height:44,display:'flex',alignItems:'center',justifyContent:'center'}}>
                    {renderIcon(ic.key,'#1A1A1A',40)}
                  </div>
                  <span style={{fontSize:11,fontFamily:font,color:'#666',textAlign:'center',
                    lineHeight:1.3,wordBreak:'break-word'}}>{ic.label}</span>
                </div>
              ))}
            </div>
          </>)}
        </div>
      );
    };

    // ── ALERTS SECTION ──
    const AlertsSection = () => {
      const BH = ({children}) => (
        <h2 style={{fontSize:'1.875rem',fontWeight:700,color:'#000',fontFamily:font,marginTop:'2.5rem',marginBottom:'0.375rem'}}>{children}</h2>
      );
      const BD = ({children}) => (
        <p style={{fontSize:'1rem',color:'#555',fontFamily:font,marginBottom:'1rem',lineHeight:1.65,marginTop:0}}>{children}</p>
      );
      const Chip = ({children}) => (
        <code style={{fontSize:'0.75rem',background:'#F0F4F4',color:'#015253',borderRadius:'0.1875rem',padding:'0.0625rem 0.3125rem',fontFamily:'monospace'}}>{children}</code>
      );

      const variants = [
        {
          key: 'success',
          label: 'Success',
          cls: 'alert-success',
          bg: '#F0FDF4',
          border: '#009951',
          color: '#14532D',
          iconColor: '#009951',
          linkColor: '#15803D',
          text: 'Your changes have been saved successfully.',
          icon: (
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="9" stroke="#009951" strokeWidth="1.6"/>
              <path d="M6 10l2.5 2.5L14 7" stroke="#009951" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          ),
        },
        {
          key: 'danger',
          label: 'Danger / Error',
          cls: 'alert-danger',
          bg: '#FFF1F1',
          border: '#C90000',
          color: '#4A0000',
          iconColor: '#C90000',
          linkColor: '#A30000',
          text: 'Something went wrong. Please review the errors below and try again.',
          icon: (
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="9" stroke="#C90000" strokeWidth="1.6"/>
              <path d="M10 6v5M10 13.5v.5" stroke="#C90000" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
          ),
        },
        {
          key: 'warning',
          label: 'Warning',
          cls: 'alert-warning',
          bg: '#FFFBEB',
          border: '#F59E0B',
          color: '#78350F',
          iconColor: '#F59E0B',
          linkColor: '#D97706',
          text: 'Your session will expire in 5 minutes. Save your work to avoid losing changes.',
          icon: (
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M10 2L1 18h18L10 2z" stroke="#F59E0B" strokeWidth="1.6" strokeLinejoin="round"/>
              <path d="M10 8v4M10 14.5v.5" stroke="#F59E0B" strokeWidth="1.8" strokeLinecap="round"/>
            </svg>
          ),
        },
        {

          const navW = containerRef.current.clientWidth - 48;
          const items = Array.from(measureRef.current.children);
          const moreReserve = 90;
          const minGap = 16;
          let widths = items.map(el => el.offsetWidth);
          let n = items.length;
          while (n > 0) {
            const sum = widths.slice(0, n).reduce((a,b) => a+b, 0);
            const willNeedMore = n < items.length;
            const need = sum + minGap * Math.max(0, n - 1) + (willNeedMore ? minGap + moreReserve : 0);
            if (need <= navW) break;
            n--;
          }
          setVisibleCount(n || 1);
        };
        compute();
        const ro = new ResizeObserver(compute);
        ro.observe(containerRef.current);
        return () => ro.disconnect();

    // ── ICONS PAGE ──

        setTimeout(()=>URL.revokeObjectURL(url),1000);
      };
      const handleCopyHtml = (text) => {
        navigator.clipboard?.writeText(text).catch(()=>{});
        setHtmlCopied(true); setTimeout(()=>setHtmlCopied(false),1500);
      };

      const q = query.toLowerCase().trim();
      const filtered = icons.filter(ic =>
        !q || ic.label.toLowerCase().includes(q) || (ic.tags||[]).some(t=>t.includes(q)) || (ic.category||'').toLowerCase().includes(q)

      // ─── DETAIL PAGE ───

              <button onClick={onBackToMain} style={{background:'none',border:'none',cursor:'pointer',color:'#015253',fontSize:14,padding:0,fontFamily:ff}}>

              <span style={{color:'#CCC'}}>/</span>
              <button onClick={onBackToGrid} style={{background:'none',border:'none',cursor:'pointer',color:'#015253',fontSize:14,padding:0,fontFamily:ff}}>

              <span style={{color:'#555',fontSize:14}}>{iconData.label}</span>
            </div>

            {/* Main content */}
            <div style={{maxWidth:1200,margin:'0 auto',padding:'40px 40px',display:'flex',gap:48,flexWrap:'wrap'}}>

              {/* LEFT: Preview area */}
              <div style={{flex:'1 1 340px',minWidth:260}}>

                <h1 style={{fontFamily:ff,fontSize:32,fontWeight:700,color:'#1A1A1A',margin:'0 0 6px 0'}}>{iconData.label}</h1>
                {iconData.tags && iconData.tags.length > 0 && (

                    <strong style={{color:'#555',fontWeight:600}}>Tags: </strong>{iconData.tags.join(', ')}

                {iconData.category && (
                  <p style={{fontFamily:ff,fontSize:13,color:'#888',margin:'-18px 0 24px 0'}}>
                    <strong style={{color:'#555',fontWeight:600}}>Category: </strong>{iconData.category}
                  </p>

                {/* Large preview box */}
                <div style={{
                  border:'1px solid #E8E8E8', borderRadius:8, minHeight:380,
                  display:'flex',alignItems:'center',justifyContent:'center',
                  background: previewColor==='#fff'||previewColor==='#ffffff'||previewColor==='#CCDCDD' ? '#888' : '#F8F9FA',

                  backgroundSize:'20px 20px',

                  {renderIcon(iconDetailKey, previewColor, previewSize)}
                </div>

                {/* Size variants row */}
                <div style={{display:'flex',gap:0,border:'1px solid #E8E8E8',borderRadius:8,overflow:'hidden',marginBottom:24}}>
                  {[16,24,32,48,64].map((s,i)=>(
                    <div key={s} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:10,
                      padding:'20px 4px 14px',borderLeft:i?'1px solid #E8E8E8':'none'}}>
                      {renderIcon(iconDetailKey,'#1A1A1A',s)}
                      <span style={{fontSize:11,color:'#999',fontFamily:ff}}>{s}px</span>
                    </div>

                </div>

              </div>

              {/* RIGHT: Info panel */}
