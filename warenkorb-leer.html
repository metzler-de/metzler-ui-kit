<!--
  ==================================================================
  METZLER · Empty Cart Illustration — JTL Shop / Bootstrap 4

<div class="metzler-empty-cart-icon">
  <svg class="mec-icon" viewBox="0 0 280 220" aria-hidden="true">
    <defs>

      <linearGradient id="mecShineGrad" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
        <stop offset="50%"  stop-color="#FFFFFF" stop-opacity="0.95"/>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>

    </defs>

    <!-- Slow-spinning outer dashed ring -->
    <circle class="mec-ring-spin" cx="140" cy="110" r="96"/>

    <!-- Sonar rings -->
    <circle class="mec-ring mec-ring-1" cx="140" cy="110" r="42"/>
    <circle class="mec-ring mec-ring-2" cx="140" cy="110" r="62"/>
    <circle class="mec-ring mec-ring-3" cx="140" cy="110" r="82"/>

    <!-- Floating accent dots -->
    <circle class="mec-dot mec-dot-a" cx="58"  cy="44"  r="2.6"/>
    <circle class="mec-dot mec-dot-b" cx="222" cy="56"  r="2.0"/>
    <circle class="mec-dot mec-dot-c" cx="46"  cy="160" r="1.8"/>
    <circle class="mec-dot mec-dot-d" cx="234" cy="168" r="2.4"/>

    <!-- Mini product orbiters -->
    <!-- Briefkasten (top-left) -->
    <g transform="translate(36 60)">
      <g class="mec-mini mec-mini-mailbox">
        <path d="M-11 8 v-14 a11 9 0 0 1 22 0 v14 z"/>
        <rect class="mec-mini-accent" x="-6" y="-4" width="12" height="1.6" rx="0.6"/>

        <line x1="0" y1="8" x2="0" y2="15"/>
        <path d="M11 -4 h4 v4 h-4"/>
      </g>
    </g>

    <!-- Sicherheitskamera (top-right) -->
    <g transform="translate(244 60)">
      <g class="mec-mini mec-mini-cam">
        <rect x="-12" y="-6" width="20" height="11" rx="2.2"/>
        <circle cx="-5" cy="-0.5" r="3.6"/>
        <circle class="mec-mini-accent" cx="-5" cy="-0.5" r="1.5"/>
        <rect x="8" y="-3" width="5" height="5" rx="1"/>
        <circle class="mec-mini-accent" cx="5" cy="-3.5" r="0.9"/>
        <line x1="-2" y1="5" x2="-2" y2="9"/>
        <line x1="-6" y1="10" x2="2" y2="10"/>
      </g>
    </g>

    <!-- Paketbox (bottom-left) -->
    <g transform="translate(36 152)">
      <g class="mec-mini mec-mini-box">
        <rect x="-12" y="-11" width="24" height="22" rx="1.8"/>
        <line x1="-12" y1="-3" x2="12" y2="-3"/>
        <rect class="mec-mini-accent" x="-6" y="-8" width="12" height="1.6" rx="0.6"/>
        <circle class="mec-mini-accent" cx="7" cy="5" r="1.1"/>
        <line x1="0" y1="-3" x2="0" y2="11"/>
        <line x1="-9" y1="11" x2="-9" y2="14"/>
        <line x1="9"  y1="11" x2="9"  y2="14"/>
      </g>
    </g>

    <!-- Türsprechanlage (bottom-right) -->
    <g transform="translate(244 152)">
      <g class="mec-mini mec-mini-panel">
        <rect x="-8" y="-13" width="16" height="26" rx="2.4"/>
        <circle cx="0" cy="-8" r="2"/>
        <rect x="-5" y="-4" width="10" height="6" rx="1"/>
        <circle class="mec-mini-accent" cx="0" cy="7" r="1.6"/>
      </g>
    </g>

    <!-- Ground shadow under the bag -->
    <ellipse class="mec-bag-shadow" cx="140" cy="176" rx="54" ry="4"/>

    <!-- Bag + counter badge -->
    <g class="mec-bag-group">
      <path class="mec-bag-handle"
            d="M112 80 v-12 a28 28 0 0 1 56 0 v12"/>
      <path class="mec-bag-body"
            d="M92 80 h96 l-6 82 a6 6 0 0 1 -6 5 h-72 a6 6 0 0 1 -6 -5 z"/>
      <rect class="mec-bag-rim" x="92" y="80" width="96" height="7" rx="1.5"/>
      <g clip-path="url(#mecRimClip)">
        <rect class="mec-rim-shine"
              x="62" y="80" width="28" height="7"
              fill="url(#mecShineGrad)"/>
      </g>
      <circle class="mec-badge-ring" cx="140" cy="122" r="17"/>
      <circle class="mec-badge-glow" cx="140" cy="122" r="20"/>
      <circle class="mec-badge"      cx="140" cy="122" r="17"/>

<!-- ==================================================================
     METZLER · Empty Cart Illustration — scoped styles
     ================================================================== -->
<style>
  .metzler-empty-cart-icon {
    --metzler-teal: #015253;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .metzler-empty-cart-icon .mec-icon {
    width: 300px;
    max-width: 100%;
    height: 220px;
    display: inline-block;
    overflow: visible;
    animation: mec-entrance 900ms cubic-bezier(0.2, 0.8, 0.2, 1) 120ms both;
  }
  @keyframes mec-entrance {
    0%   { opacity: 0; transform: translateY(12px) scale(0.94); }
    100% { opacity: 1; transform: translateY(0)    scale(1);    }
  }

  /* Sonar rings */
  .metzler-empty-cart-icon .mec-ring {
    fill: none;
    stroke: var(--metzler-teal);
    stroke-width: 1;
    stroke-dasharray: 2 5;
    transform-origin: 140px 110px;
    animation: mec-ring-pulse 3.6s ease-out infinite;
  }
  .metzler-empty-cart-icon .mec-ring-1 { stroke-opacity: 0.34; }
  .metzler-empty-cart-icon .mec-ring-2 { stroke-opacity: 0.24; animation-delay: 0.7s; }
  .metzler-empty-cart-icon .mec-ring-3 { stroke-opacity: 0.16; animation-delay: 1.4s; }
  @keyframes mec-ring-pulse {
    0%   { transform: scale(0.7);  opacity: 0.95; }
    100% { transform: scale(1.35); opacity: 0;    }
  }

  .metzler-empty-cart-icon .mec-ring-spin {
    fill: none;
    stroke: var(--metzler-teal);
    stroke-opacity: 0.25;
    stroke-width: 1;
    stroke-dasharray: 3 7;
    transform-origin: 140px 110px;
    animation: mec-ring-spin 22s linear infinite;
  }
  @keyframes mec-ring-spin {
    0%   { transform: rotate(0deg);   }
    100% { transform: rotate(360deg); }
  }

  /* Floating dots */
  .metzler-empty-cart-icon .mec-dot {
    fill: var(--metzler-teal);
    opacity: 0.35;
    animation: mec-float 6s ease-in-out infinite;
  }
  .metzler-empty-cart-icon .mec-dot-a { animation-delay:  0s;   }
  .metzler-empty-cart-icon .mec-dot-b { animation-delay: -1.8s; }
  .metzler-empty-cart-icon .mec-dot-c { animation-delay: -3.2s; }
  .metzler-empty-cart-icon .mec-dot-d { animation-delay: -4.5s; }
  @keyframes mec-float {
    0%, 100% { transform: translateY(0);    opacity: 0.30; }
    50%      { transform: translateY(-6px); opacity: 0.60; }
  }

  /* Mini orbiters */
  .metzler-empty-cart-icon .mec-mini {
    fill: none;
    stroke: var(--metzler-teal);
    stroke-opacity: 0.9;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: mec-mini-appear 600ms ease-out 700ms forwards;
  }
  .metzler-empty-cart-icon .mec-mini .mec-mini-accent {
    fill: var(--metzler-teal);
    stroke: none;
  }
  @keyframes mec-mini-appear { 0% { opacity: 0; } 100% { opacity: 1; } }

  .metzler-empty-cart-icon .mec-mini-mailbox { animation: mec-mini-appear 600ms ease-out 700ms forwards,  mec-drift-a 7.2s ease-in-out infinite 1.3s; }
  .metzler-empty-cart-icon .mec-mini-cam     { animation: mec-mini-appear 600ms ease-out 820ms forwards,  mec-drift-b 8.0s ease-in-out infinite 1.4s; }
  .metzler-empty-cart-icon .mec-mini-box     { animation: mec-mini-appear 600ms ease-out 940ms forwards,  mec-drift-c 7.6s ease-in-out infinite 1.5s; }
  .metzler-empty-cart-icon .mec-mini-panel   { animation: mec-mini-appear 600ms ease-out 1060ms forwards, mec-drift-d 8.4s ease-in-out infinite 1.6s; }

  @keyframes mec-drift-a { 0%,100% { transform: translate(0,0)     rotate(-4deg); } 50% { transform: translate(5px,-9px) rotate( 6deg); } }
  @keyframes mec-drift-b { 0%,100% { transform: translate(0,0)     rotate( 5deg); } 50% { transform: translate(-6px,-7px) rotate(-4deg); } }
  @keyframes mec-drift-c { 0%,100% { transform: translate(0,0)     rotate(-3deg); } 50% { transform: translate(4px,9px)   rotate( 5deg); } }
  @keyframes mec-drift-d { 0%,100% { transform: translate(0,0)     rotate( 4deg); } 50% { transform: translate(-5px,8px)  rotate(-5deg); } }

  /* Bag group */
  .metzler-empty-cart-icon .mec-bag-group {
    transform-origin: 140px 167px;
    animation: mec-bag-breathe 4.2s ease-in-out infinite;
  }
  @keyframes mec-bag-breathe {
    0%,100% { transform: scaleY(1)    translateY(0); }
    50%     { transform: scaleY(1.02) translateY(-1.5px); }
  }
  .metzler-empty-cart-icon .mec-bag-shadow {
    fill: rgba(1,82,83,0.12);
    transform-origin: 140px 176px;
    animation: mec-shadow-breathe 4.2s ease-in-out infinite;
  }
  @keyframes mec-shadow-breathe {
    0%,100% { transform: scaleX(1);    opacity: 1;   }
    50%     { transform: scaleX(0.88); opacity: 0.7; }
  }
  .metzler-empty-cart-icon .mec-bag-handle {
    fill: none;
    stroke: var(--metzler-teal);
    stroke-opacity: 0.85;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  .metzler-empty-cart-icon .mec-bag-body {
    fill: #FFFFFF;
    stroke: var(--metzler-teal);
    stroke-opacity: 0.6;
    stroke-width: 1.8;
    stroke-linejoin: round;
  }
  .metzler-empty-cart-icon .mec-bag-rim { fill: var(--metzler-teal); opacity: 0.12; }

  /* Rim shimmer */
  .metzler-empty-cart-icon .mec-rim-shine {
    fill: #FFFFFF;
    opacity: 0.85;
    animation: mec-shine 3.2s ease-in-out infinite;
  }
  @keyframes mec-shine {
    0%   { transform: translateX(-30px); opacity: 0;    }
    20%  {                                opacity: 0.9;  }
    80%  { transform: translateX(130px);  opacity: 0.2;  }
    100% { transform: translateX(140px);  opacity: 0;    }
  }

  /* Counter badge */
  .metzler-empty-cart-icon .mec-badge {
    fill: var(--metzler-teal);
    transform-origin: 140px 122px;
    animation: mec-badge-pulse 2.6s ease-in-out infinite;
  }
  .metzler-empty-cart-icon .mec-badge-glow {
    fill: rgba(1,82,83,0.18);
    transform-origin: 140px 122px;
    animation: mec-badge-glow 2.6s ease-in-out infinite;
  }
  .metzler-empty-cart-icon .mec-badge-ring {
    fill: none;
    stroke: var(--metzler-teal);
    stroke-width: 1.2;
    stroke-opacity: 0.4;
    transform-origin: 140px 122px;
    animation: mec-badge-ring 2.6s ease-out infinite;
  }
  .metzler-empty-cart-icon .mec-badge-text {
    fill: #FFFFFF;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: 0.01em;
    animation: mec-badge-blink 5s ease-in-out infinite;
  }
  @keyframes mec-badge-pulse { 0%,100% { transform: scale(1);    } 50% { transform: scale(1.08); } }
  @keyframes mec-badge-glow  { 0%,100% { transform: scale(1);    opacity: 0.7; } 50% { transform: scale(1.3); opacity: 0; } }
  @keyframes mec-badge-ring  { 0%     { transform: scale(1);    opacity: 0.55; } 100% { transform: scale(1.7); opacity: 0; } }
  @keyframes mec-badge-blink { 0%, 92%, 100% { opacity: 1; } 94% { opacity: 0.2; } 96% { opacity: 1; } }

  /* Respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .metzler-empty-cart-icon .mec-icon,
    .metzler-empty-cart-icon .mec-icon * {
      animation: none !important;
    }
  }
</style>
