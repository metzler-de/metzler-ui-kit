<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metzler Compact Header Preview</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #fff;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    button { font: inherit; cursor: pointer; background: none; border: none; }

    /* ==================== COMPACT STICKY HEADER ==================== */
    .hdr-compact {
      position: relative;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
    }
    .hdr-compact-inner {
      max-width: 1600px; margin: 0 auto;
      padding: 0 24px; height: 64px;
      display: flex; align-items: center; gap: 20px;
    }
    @media(min-width:1024px){ .hdr-compact-inner { padding: 0 40px; } }
    .hdr-logo { flex-shrink: 0; display: flex; align-items: center; }
    .hdr-logo img { height: 34px; width: auto; display: block; }

    .hdr-menu-btn {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      height: 40px; padding: 0 1.2rem; border-radius: 0.25rem;
      background: #015253; border: none; cursor: pointer;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 1rem; font-weight: 500; color: #fff;
      white-space: nowrap; line-height: 1.2;
      transition: background 0.15s ease; flex-shrink: 0;
    }
    .hdr-menu-btn:hover { background: #014A4B; }
    .hdr-menu-btn svg { width: 18px; height: 18px; }

    .hdr-searchbar {
      flex: 1; height: 40px;
      display: flex; align-items: center; gap: 12px;
      background: #F5F6FA; border-radius: 4px;
      padding: 0 16px;
      border: 1px solid #e0e0e0;
      transition: border-color 0.2s, box-shadow 0.2s;
      max-width: calc(100% - 480px);
    }
    .hdr-searchbar:focus-within {
      border-color: #015253; box-shadow: 0 0 0 3px rgba(1,82,83,0.15);
    }
    .hdr-searchbar svg { width: 16px; height: 16px; color: #999; flex-shrink: 0; }
    .hdr-searchbar input {
      flex: 1; background: none; border: none; outline: none;
      font-size: 15px; font-family: inherit; color: #0a0a0a;
    }
    .hdr-searchbar input::placeholder { color: #A1A1A1; }
    .search-clear {
      display: none; align-items: center; justify-content: center;
      width: 20px; height: 20px; border-radius: 50%;
      background: #ccc; border: none; cursor: pointer;
      flex-shrink: 0; padding: 0;
    }
    .search-clear svg { width: 12px; height: 12px; color: #fff; }
    .search-clear.visible { display: flex; }

    .hdr-icons { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-shrink: 0; }
    .hdr-icon-btn {
      width: 40px; height: 40px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%;
      color: #333; transition: all 0.2s;
    }
    .hdr-icon-btn:hover { color: #015253; background: #F5F6FA; }
    .hdr-icon-btn svg { height: 22px; width: auto; }

    /* ==================== SIDE MENU ==================== */
    .side-overlay {
      position: fixed; inset: 0; z-index: 70;
      background: rgba(0,0,0,0.4);
      opacity: 0; visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .side-overlay.open { opacity: 1; visibility: visible; }
    .side-menu {
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 71;
      width: 360px; max-width: 85vw;
      background: #fff;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      box-shadow: none;
    }
    .side-menu.open { transform: translateX(0); }
    .side-menu-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 24px; border-bottom: 1px solid #eee;
    }
    .side-menu-header img { height: 26px; }
    .side-menu-close {
      width: 36px; height: 36px; display: flex; align-items: center;
      justify-content: center; border-radius: 50%;
      background: none; border: none; cursor: pointer;
      color: #333; transition: background 0.2s;
    }
    .side-menu-close:hover { background: #F5F6FA; }
    .side-menu-close svg { width: 20px; height: 20px; }
    .side-menu-list { padding: 12px 0; }
    .side-menu-item {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 24px; font-size: 16px; font-weight: 600;
      color: #333; transition: background 0.15s, color 0.15s; cursor: pointer;
    }
    .side-menu-item:hover { background: #F5F6FA; color: #015253; }
    .side-menu-item svg { width: 20px; height: 20px; color: #999; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- ==================== COMPACT STICKY HEADER ==================== -->
  <div class="hdr-compact" id="hdrCompact">
    <div class="hdr-compact-inner">
      <a href="#" class="hdr-logo"><img src="../logo.svg" alt="Metzler" /></a>
      <button class="hdr-menu-btn" id="menuBtn" aria-label="Kategorien">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h12M3 18h18"/></svg>
        Alle Kategorien
      </button>
      <div class="hdr-searchbar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5l4 4" stroke-linecap="round"/></svg>
        <input type="text" placeholder="Suchen — Türklingel, Briefkasten, Sprechanlage..." />
        <button class="search-clear" aria-label="Suche löschen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="hdr-icons">
        <a href="#" class="hdr-icon-btn" aria-label="Konto">
          <svg viewBox="0 0 20.6 19.8" fill="none"><path d="M12.14 14.034C15.107 14.034 17.914 15.378 19.774 17.689L20.426 18.499C20.703 18.843 20.649 19.346 20.305 19.623C19.961 19.9 19.457 19.846 19.18 19.502L18.528 18.692C16.972 16.758 14.623 15.634 12.14 15.634H8.462C5.98 15.634 3.631 16.758 2.074 18.692L1.423 19.502C1.146 19.846 0.642 19.9 0.298 19.623C-0.046 19.346 -0.1 18.843 0.177 18.499L0.828 17.689C2.688 15.378 5.495 14.034 8.462 14.034H12.14Z" fill="currentColor"/><path d="M15.149 6.313C15.149 3.742 13.011 1.6 10.3 1.6C7.59 1.6 5.451 3.742 5.451 6.313C5.451 8.883 7.59 11.024 10.3 11.024V12.625C6.671 12.625 3.851 9.865 3.851 6.313C3.851 2.826 6.739 0 10.3 0C13.862 0 16.75 2.826 16.75 6.313C16.75 9.865 13.864 12.625 10.3 12.625V11.024C13.011 11.024 15.149 8.883 15.149 6.313Z" fill="currentColor"/></svg>
        </a>
        <a href="#" class="hdr-icon-btn" aria-label="Warenkorb">
          <svg viewBox="0 0 21.3 19.41" fill="none"><path d="M18.463 0C19.411 0 20.197 0.736 20.259 1.683L21.294 17.495C21.362 18.533 20.538 19.412 19.498 19.412H1.8C0.76 19.412 -0.064 18.533 0.004 17.495L1.04 1.683C1.102 0.736 1.888 0 2.836 0H18.463ZM2.836 1.6C2.731 1.6 2.643 1.682 2.636 1.787L1.6 17.6C1.593 17.715 1.684 17.813 1.8 17.813H19.498C19.613 17.813 19.705 17.715 19.697 17.6L18.662 1.787C18.655 1.682 18.568 1.6 18.463 1.6H2.836Z" fill="currentColor"/><path d="M14.033 5.55V6.112C14.033 7.382 13.003 8.412 11.733 8.412H9.566C8.295 8.412 7.266 7.382 7.266 6.112V5.55C7.266 5.163 6.952 4.849 6.566 4.849C6.179 4.849 5.866 5.163 5.866 5.55V6.112C5.866 8.156 7.522 9.813 9.566 9.813H11.733C13.776 9.813 15.432 8.156 15.432 6.112V5.55C15.432 5.163 15.119 4.849 14.733 4.849C14.346 4.849 14.033 5.163 14.033 5.55Z" fill="currentColor"/></svg>
        </a>
      </div>
    </div>
  </div>

  <!-- ==================== SIDE MENU ==================== -->
  <div class="side-overlay" id="sideOverlay"></div>
  <nav class="side-menu" id="sideMenu">
    <div class="side-menu-header">
      <img src="../logo.svg" alt="Metzler" />
      <button class="side-menu-close" id="sideClose" aria-label="Schließen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="side-menu-list">
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Briefkästen</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>Paketboxen</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="7" width="14" height="14" rx="2"/><path d="M8 7V5a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Mülltonnenboxen</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2"/><circle cx="12" cy="9" r="3"/><path d="M9 16h6"/></svg>Sprechanlagen</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2C8 4 4 4 4 4v8c0 5 8 10 8 10s8-5 8-10V4s-4 0-8-2z"/></svg>Sicherheitstechnik</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>Türklingeln</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 8v8M12 8v8M15 8v8"/></svg>Hausnummern</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18h6M12 2v1M4.22 4.22l.7.7M1 12h1M4.22 19.78l.7-.7M12 21v1M19.78 19.78l-.7-.7M23 12h-1M19.78 4.22l-.7.7"/><circle cx="12" cy="12" r="5"/></svg>Außenleuchten</a>
      <a href="#" class="side-menu-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 22V8M5 12c0-4 3-8 7-10 4 2 7 6 7 10s-3 6-7 8c-4-2-7-4-7-8z"/></svg>Garten</a>
    </div>
  </nav>

  <script>
    const menuBtn = document.getElementById("menuBtn");
    const sideMenu = document.getElementById("sideMenu");
    const sideOverlay = document.getElementById("sideOverlay");
    const sideClose = document.getElementById("sideClose");

    function openSideMenu() {
      sideMenu.classList.add("open");
      sideOverlay.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function closeSideMenu() {
      sideMenu.classList.remove("open");
      sideOverlay.classList.remove("open");
      document.body.style.overflow = "";
    }
    sideClose.addEventListener("click", closeSideMenu);
    sideOverlay.addEventListener("click", closeSideMenu);

    // Search clear
    const searchBar = document.querySelector(".hdr-searchbar");
    const input = searchBar.querySelector("input");
    const clearBtn = searchBar.querySelector(".search-clear");
    input.addEventListener("input", () => {
      clearBtn.classList.toggle("visible", input.value.length > 0);
    });
    clearBtn.addEventListener("click", () => {
      input.value = "";
      clearBtn.classList.remove("visible");
      input.focus();
    });
  </script>
</body>
</html>
