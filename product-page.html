  <!-- ─────────── Tab logic for brandbook iframe ─────────── -->
  <script>
    // Sets of brandbook page IDs to show per tab. Everything else is hidden.
    const TAB_SECTIONS = {
      beschreibung: [
        'product-hero',
        'product-highlights',
        'product-new-features',
        'product-integration',
        'product-access-methods',
        'product-feature-grid',
        'product-design-variations',
        'product-face-recognition',
        'product-security-faq',
        'product-camera-tech',
        'product-metzler-talk',
      ],
      tech:      ['product-tech-details'],
      support:   ['product-support'],
      downloads: ['product-downloads'],
    };

    const frame = document.getElementById('brand-frame');
    const loading = document.getElementById('frame-loading');
    let currentTab = 'beschreibung';

    function applyTab(tabKey) {
      const doc = frame.contentDocument;
      if (!doc || !doc.body) return;

      const ids = TAB_SECTIONS[tabKey] || [];

      // Inject (or update) a style tag that controls section visibility
      let style = doc.getElementById('pdp-tab-style');
      if (!style) {
        style = doc.createElement('style');
        style.id = 'pdp-tab-style';
        doc.head.appendChild(style);
      }

      // Hide every .page by default, then re-show only the ones we want.
      // Keep the page container's internal scroll disabled so content flows naturally.
      const showSelector = ids.map(id => '.page#' + id).join(',\n');
      style.textContent = `
        body { background:#F5F6FA !important; }
        .page { display: none !important; }
        ${showSelector} {
          display: flex !important;
          aspect-ratio: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          margin: 32px auto !important;
        }
        ${ids.map(id => `.page#${id} > *:not(.brand-strip):not(.palette-header):not(.page-title):not(.page-title-row):not(.section-intro):not(.page-footer):not(style):not(script)`).join(',\n')} {
          overflow: visible !important;
          min-height: 0 !important;
          flex: 0 0 auto !important;
        }
      `;

      // Resize the iframe to its content height
      requestAnimationFrame(() => {
        const h = doc.documentElement.scrollHeight;
        frame.style.height = (h + 40) + 'px';
        frame.style.visibility = 'visible';
        loading.style.display = 'none';
        // Scroll the iframe to top so the user sees the first selected section
        try { doc.documentElement.scrollTop = 0; } catch (e) {}
        // Scroll our parent page so the tabs stay in view
        document.querySelector('.pdp-tabs').scrollIntoView({behavior: 'smooth', block: 'start'});
      });
    }

    function onFrameLoad() {
      // The brandbook's own scrolling is replaced by the parent doc's scroll
      const doc = frame.contentDocument;
      if (doc) {
        doc.documentElement.style.overflow = 'visible';
        doc.body.style.overflow = 'visible';
      }
      applyTab(currentTab);
      // Recompute height after fonts/images load
      window.setTimeout(() => {
        const h = doc?.documentElement?.scrollHeight;
        if (h) frame.style.height = (h + 40) + 'px';
      }, 800);
    }

    frame.addEventListener('load', onFrameLoad);

    // Tab clicks
    document.querySelectorAll('.pdp-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.pdp-tab').forEach(b => {
          b.classList.remove('active');
          b.setAttribute('aria-selected','false');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected','true');
        currentTab = btn.dataset.tab;
        applyTab(currentTab);
      });
    });

    // Recompute height when window resizes (iframe content reflows)
    let rsTimer;
    window.addEventListener('resize', () => {
      clearTimeout(rsTimer);
      rsTimer = setTimeout(() => {
        const doc = frame.contentDocument;
        if (doc) frame.style.height = (doc.documentElement.scrollHeight + 40) + 'px';
      }, 150);
    });
  </script>
